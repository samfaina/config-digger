#:schema ../../../schema/agent-definition.schema.json
# Claude Desktop. Facts from docs/research/claude-desktop.md
# (verified against 2.16120.0.0), and those tagged [test] from the release
# gate's probe, uat/agents/claude-desktop.mjs in Windows Sandbox
# (docs/research/release-gate.md), run on 3.6556.2, with the move of a
# package's data folder to `Claude-Data` (#305) and, signed in, the skills
# mirror (#313). Facts tagged [bundle] about
# that move were read in 3.6556.2 and 4.29. `verified` starts at the
# research's 2.16120, on which the probe never ran, and ends at the version
# it passes on.

format_version = 1
verified = { min = "2.16120", max = "3.6556.2" }

# The data folder Claude Desktop reads, `<userData>`, is the first of these
# that exists [bundle]. The signed app ignores `CLAUDE_USER_DATA_DIR`
# [test, bundle], so no home comes from it (#368).
# `%LOCALAPPDATA%\Claude-Data` counts only while `%APPDATA%` is on a network
# share [bundle]. A package's app reads the folder it moved its data to,
# `%LOCALAPPDATA%\Claude-Data\<family>`, whenever that folder exists, a
# classic folder beside it or not [test, bundle]. Each package's app ends
# with its own `LocalCache`, which no other app sees [docs]. A package's app
# sees `%APPDATA%\Claude` with its `LocalCache` laid over it, path by path:
# beside a classic folder it reads the classic files and creates no
# `LocalCache`, but a file its `LocalCache` holds wins [test]. So a
# package's `LocalCache` home is an Overlay home over the classic one,
# which the classic app's order holds alone.
lookup_orders = [
  ["claude-data", "classic"],
  ["claude-data", "msix-moved", "msix"],
  ["claude-data", "msix-anthropicpbc-moved", "msix-anthropicpbc"],
]

[agent]
id = "claude-desktop"
name = "Claude Desktop"
# claude.ai connectors live in the account; the app keeps only snapshots of
# them in its session files [disk, docs].
notes = ["cloud_connectors_not_on_disk"]

# Each MSIX package installs to its own folder under `WindowsApps`, whose
# manifest gives its version [disk]. A package's app reads the homes of its
# lookup order, its `LocalCache` laid over the classic folder, and the
# third-party home.
[[installations]]
id = "msix"
folder = "%ProgramFiles%/WindowsApps/Claude_*"
executable = "app/claude.exe"
versions = [{ block = "appx-identity" }, { block = "exe-version" }]
homes = ["claude-data", "msix-moved", "msix", "third-party"]

[[installations]]
id = "msix-anthropicpbc"
folder = "%ProgramFiles%/WindowsApps/AnthropicPBC.Claude_*"
executable = "app/claude.exe"
versions = [{ block = "appx-identity" }, { block = "exe-version" }]
homes = ["claude-data", "msix-anthropicpbc-moved", "msix-anthropicpbc", "third-party"]

# The classic installer, which claude.ai serves beside the MSIX package, is
# Squirrel's: it installs for the user in `%LOCALAPPDATA%\AnthropicClaude`,
# a launcher `claude.exe` with the app's version beside `Update.exe` and one
# `app-<version>` folder per version, which runs the app [test]. It uninstalls
# with `Update.exe --uninstall`, from the user's `AnthropicClaude` key [test].
[[installations]]
id = "classic"
folder = "%LOCALAPPDATA%/AnthropicClaude"
executable = "claude.exe"
versions = [{ block = "exe-version" }]
homes = ["claude-data", "classic", "third-party"]

# The app runs as `claude.exe` from its package [disk] or from its classic
# `app-<version>` folder [test], as the Claude Code CLI does from
# `~/.local/bin` and from the copy Claude Desktop downloads into its data
# folder [disk]: only the path tells them apart.
[process]
images = ["claude.exe"]
paths = [
  "%ProgramFiles%/WindowsApps/Claude_*/app/claude.exe",
  "%ProgramFiles%/WindowsApps/AnthropicPBC.Claude_*/app/claude.exe",
  "%LOCALAPPDATA%/AnthropicClaude/app-*/claude.exe",
]
# Its Chromium child processes name the data folder it reads, `<userData>`,
# as `--user-data-dir=<folder>`, quoted on some and not on others [disk].
# Started with `--user-data-dir=<folder>`, it reads that folder, which every
# process names, the main one too; the signed app ignores
# `CLAUDE_USER_DATA_DIR` [test, bundle]. So a running Claude Desktop reads a
# home the user added only while one of its processes names its folder (#211).
data_folder_switch = "--user-data-dir"

[[homes]]
id = "claude-data"
folder = { block = "path", path = "%LOCALAPPDATA%/Claude-Data" }
when = [{ block = "unc-variable", variable = "APPDATA" }]

[homes.roots]
# Holds the user's servers in `mcpServers`, next to UI preferences.
config = "claude_desktop_config.json"
extensions = "Claude Extensions"
extension_settings = "Claude Extensions Settings"
installations = "extensions-installations.json"
# The mirror of the account's skills.
skills = "local-agent-mode-sessions/skills-plugin"

# The classic installer's data folder [docs].
[[homes]]
id = "classic"
default = true
folder = { block = "path", path = "%APPDATA%/Claude" }

[homes.roots]
config = "claude_desktop_config.json"
extensions = "Claude Extensions"
extension_settings = "Claude Extensions Settings"
installations = "extensions-installations.json"
# The mirror of the account's skills.
skills = "local-agent-mode-sessions/skills-plugin"

# An MSIX package virtualises what the app writes to `%APPDATA%\Claude`
# into its own `LocalCache`, where no other process sees it as
# `%APPDATA%\Claude` [disk, docs]. The Store package is `Claude_<publisher>`
# [disk]. The app sees its `LocalCache` laid over a classic folder: a file
# the `LocalCache` holds is read, else the classic one [test], and a folder
# root lists the entries of both by name, the `LocalCache`'s winning
# [docs].
[[homes]]
id = "msix"
unverified = "A package is taken to list `Claude Extensions`, `Claude Extensions Settings` and its skills mirror as the entries of its `LocalCache` and of a classic folder beside it, by name, its own winning, as Microsoft says a package's files are merged with `AppData`; only `claude_desktop_config.json` was tested (#306)."
folder = { block = "path", path = "%LOCALAPPDATA%/Packages/Claude_*/LocalCache/Roaming/Claude" }
over = "classic"

[homes.roots]
config = "claude_desktop_config.json"
extensions = "Claude Extensions"
extension_settings = "Claude Extensions Settings"
installations = "extensions-installations.json"
# The mirror of the account's skills.
skills = "local-agent-mode-sessions/skills-plugin"

# A package moves its data folder out of its `LocalCache`, at a start, to
# `%LOCALAPPDATA%\Claude-Data\<family>`, the family in lower case, which
# the package writes to its real path [test, disk]. It moves only while its
# data is in its `LocalCache` alone, `%APPDATA%\Claude` holding none
# [bundle], and once a rollout flag latched into its config's preferences
# says so [test, bundle].
# Its `LocalCache` keeps only the marker `.user-data-left.<family>` [test, disk].
[[homes]]
id = "msix-moved"
folder = { block = "path", path = "%LOCALAPPDATA%/Claude-Data/claude_pzs8sxrjxfjjc" }

[homes.roots]
config = "claude_desktop_config.json"
extensions = "Claude Extensions"
extension_settings = "Claude Extensions Settings"
installations = "extensions-installations.json"
# The mirror of the account's skills.
skills = "local-agent-mode-sessions/skills-plugin"

# The app also knows the package family `AnthropicPBC.Claude` [bundle],
# whose `LocalCache` is laid over a classic folder the same way.
[[homes]]
id = "msix-anthropicpbc"
unverified = "The `AnthropicPBC.Claude` package is taken to see its `LocalCache` laid over a classic folder as the Store package does, its folder roots listed by name, its own entries winning (#306)."
folder = { block = "path", path = "%LOCALAPPDATA%/Packages/AnthropicPBC.Claude_*/LocalCache/Roaming/Claude" }
over = "classic"

[homes.roots]
config = "claude_desktop_config.json"
extensions = "Claude Extensions"
extension_settings = "Claude Extensions Settings"
installations = "extensions-installations.json"
# The mirror of the account's skills.
skills = "local-agent-mode-sessions/skills-plugin"

# The `AnthropicPBC.Claude` package moves its data folder the same way
# [bundle].
[[homes]]
id = "msix-anthropicpbc-moved"
folder = { block = "path", path = "%LOCALAPPDATA%/Claude-Data/anthropicpbc.claude_fnn82j28hfe8t" }

[homes.roots]
config = "claude_desktop_config.json"
extensions = "Claude Extensions"
extension_settings = "Claude Extensions Settings"
installations = "extensions-installations.json"
# The mirror of the account's skills.
skills = "local-agent-mode-sessions/skills-plugin"

# Deployments that use a third-party inference provider keep a data folder
# of their own [docs, bundle], outside the lookup order. A package writes it
# to its real path [disk].
[[homes]]
id = "third-party"
folder = { block = "path", path = "%LOCALAPPDATA%/Claude-3p" }

[homes.roots]
config = "claude_desktop_config.json"
extensions = "Claude Extensions"
extension_settings = "Claude Extensions Settings"
installations = "extensions-installations.json"
# The mirror of the account's skills.
skills = "local-agent-mode-sessions/skills-plugin"

# Device policy, one registry value per setting [docs, bundle]. While the
# machine's key holds any value, the user's is ignored whole [docs, bundle].
# Switches are DWORDs [docs]. Policy the organisation sends from the cloud is
# not on disk.
[[settings]]
id = "policy"
sources = [
  { block = "registry-key", hive = "local-machine", key = 'SOFTWARE\Policies\Claude' },
  { block = "registry-key", hive = "current-user", key = 'SOFTWARE\Policies\Claude' },
]

# Claude Desktop has no project or local Scope [docs].
[[scopes]]
id = "user"

# `claude_desktop_config.json` is read with `JSON.parse` [bundle].
[[locations]]
id = "user-mcp"
anchor = { block = "home", root = "config" }
format = { block = "json", dialect = "strict" }
root = ["mcpServers"]
kind = "mcp"
scope = "user"
provenance = "file"
# Claude Desktop keeps the file in memory and writes it back whole as its
# preferences change [bundle].
store_class = "rewritten-while-running"
# The app encrypts some values, writing them as `__encrypted__:<ciphertext>`
# [bundle].
secrets.encrypted_prefixes = ["__encrypted__:"]
# It shows "Couldn't load app settings" and starts without the file's
# servers, and never writes back a file it could not load [bundle].
on_read_failure = "ignores_file"
# Each server needs a `command` [bundle]: the file is stdio only, and the app
# skips a server with a `url` alone, warning that it is not valid.
shape = { block = "fields", one_of = ["command"], types = { command = "string", args = "string-array", env = "string-map" } }

# Desktop extensions (`.mcpb`, formerly `.dxt`), each unpacked into
# `Claude Extensions\<id>`; any folder there with a `manifest.json` counts as
# installed [bundle]. `extensions-installations.json` records how each was
# installed [bundle]. An extension's server goes by its manifest's
# `display_name`, or else its `name`; a second extension with the same name
# goes by its id [bundle]. Extensions are uninstalled in
# Settings > Extensions [docs].
[[plugins]]
id = "extensions"
registry = { block = "plugin-folders", anchor = { block = "home", root = "extensions" }, marker = "manifest.json", records = { anchor = { block = "home", root = "installations" }, root = ["extensions"], version = "version" } }
name = [{ file = "manifest.json", key_path = ["display_name"] }, { file = "manifest.json", key_path = ["name"] }]
unique_names = true

# The one server of an extension, in its manifest's `server.mcp_config`
# [docs]. `${__dirname}` stands for the extension's folder, and
# `${user_config.<key>}` for a value set in its settings [docs].
[[locations]]
id = "extension-mcp"
anchor = { block = "plugin", plugins = "extensions", path = "manifest.json" }
one_entry = true
format = { block = "json", dialect = "strict" }
root = ["server", "mcp_config"]
kind = "mcp"
scope = "user"
provenance = "extension"
store_class = "plain"
interpolation = { block = "braces", namespaces = ["user_config"], namespace_separator = "." }
secrets.encrypted_prefixes = ["__encrypted__:"]
# The app counts a folder installed only while its manifest reads [bundle].
on_read_failure = "ignores_file"

# Extension servers are gathered first, then the user file's, by name: a
# user server replaces a same-named extension server whole, with no field
# merge [bundle]. A user server the app skips as invalid leaves the name to
# the extension, as does a skipped extension to the user server.
[items.mcp]
precedence = ["user-mcp", "extension-mcp"]
competition = { block = "exact-name" }
checks = ["policy", "rules", "shape", "disable", "precedence"]

# The app loads the user file's servers only while neither the policy nor
# the file's own `features` sets `isLocalDevMcpEnabled` to false [bundle].
[[items.mcp.rules]]
block = "global-switch"
off = false
every_source = true
locations = ["user-mcp"]
sources = [
  { anchor = { block = "settings", settings = "policy" }, key_path = ["isLocalDevMcpEnabled"], policy = true },
  { anchor = { block = "home", root = "config" }, key_path = ["features", "isLocalDevMcpEnabled"] },
]

# Likewise every extension, by the policy `isDesktopExtensionEnabled`, or
# its older name `isDxtEnabled`, or the file's `features.isDxtEnabled`
# [docs, bundle].
[[items.mcp.rules]]
block = "global-switch"
unverified = { sentence = "Which default a deployment for a third-party provider takes is not known: on is assumed.", needs = "a Claude Desktop deployment for a third-party provider" }
off = false
every_source = true
locations = ["extension-mcp"]
sources = [
  { anchor = { block = "settings", settings = "policy" }, key_path = ["isDesktopExtensionEnabled"], policy = true },
  { anchor = { block = "settings", settings = "policy" }, key_path = ["isDxtEnabled"], policy = true },
  { anchor = { block = "home", root = "config" }, key_path = ["features", "isDxtEnabled"] },
]

# An extension on the organisation's blocklist gets `orgBlockedReason` in its
# settings, and the app leaves it out [bundle].
[[items.mcp.gates]]
block = "policy-field"
locations = ["extension-mcp"]
sources = [
  { anchor = { block = "home", root = "extension_settings", path = "{plugin_id}.json" }, key_path = ["orgBlockedReason"] },
]

# The user file has no switch per server [bundle]: config-digger parks a
# server it Disables in its own store, and puts it back on Enable.
[[items.mcp.disable]]
block = "park"
locations = ["user-mcp"]

# The Settings > Extensions toggle: `isEnabled` in the extension's settings.
# The app loads only an extension that has `isEnabled: true`, so one without
# a settings file is off [bundle].
[[items.mcp.disable]]
block = "json-field"
switch = { anchor = { block = "home", root = "extension_settings", path = "{plugin_id}.json" }, key_path = ["isEnabled"], store_class = "plain" }
target = "plugin"
context = "all"
enable_action = "set"
enabled_value = true
disabled_value = false
default_value = false
reason = "disabled_natively"
locations = ["extension-mcp"]

# Skills exist on disk only as Claude Desktop's mirror of the account's
# skills, in `skills-plugin/<org>/<account>/skills/<name>` [disk]. They are
# managed in the account, and the app rewrites the mirror as it syncs, so
# config-digger only reads them. The account validates a skill on upload
# [bundle], so only a hand edit leaves a `SKILL.md` the app cannot read. At
# its next sync round the app keeps such a file, whether its frontmatter is
# not YAML or its body is not UTF-8, in a skill of Anthropic's or a user's;
# its manifest still lists the skill on, and a folder the manifest does not
# list it removes [test]. A skill whose frontmatter is not YAML goes by its
# folder, as the fallbacks below say. A `SKILL.md` that is not UTF-8 is a
# Read failure here, though the app keeps its skill on and hands the mirror
# to its sessions' Claude Code, which was not tested: what it does with the
# file is unknown.
[[locations]]
id = "mirrored-skills"
anchor = { block = "home", root = "skills" }
format = { block = "skill-folder", recursive = true, name_from = "frontmatter", no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name" }
kind = "skill"
scope = "user"
provenance = "cloud-mirror"
store_class = "plain"
on_read_failure = "unknown"

[items.skill]
precedence = ["mirrored-skills"]
competition = { block = "exact-name" }
checks = ["frontmatter", "disable", "precedence"]

# The mirror's `manifest.json`, two folders above each skill, lists every
# skill of the account with whether it is on, the Customize > Skills toggle
# [disk]. A mirrored skill takes its State from it; it is changed in the
# account, never on disk.
[[items.skill.disable]]
block = "json-field"
switch = { anchor = { block = "entry", up = 2, path = "manifest.json" }, key_path = ["skills", "{name}", "enabled"], named_by = "name", store_class = "plain" }
target = "name"
context = "all"
enable_action = "set"
enabled_value = true
disabled_value = false
reason = "disabled_natively"
locations = ["mirrored-skills"]
enable_offered = false
