#:schema ../../../../schema/skill-manager-definition.schema.json
# openskills. Facts from docs/research/skill-managers.md
# (read in the source of 1.5.0).

format_version = 1

[manager]
id = "openskills"
name = "openskills"

# It copies each skill and writes `.openskills.json` into each copy [source].
[[detectors]]
block = "marker-file"
file = ".openskills.json"
strength = "strong"

# With `--universal` it installs into `.agent/skills`, singular, which no
# other tool uses [source].
[[detectors]]
block = "location-glob"
glob = ".agent/skills/*"
strength = "weak"
