#:schema ../../../schema/agent-definition.schema.json
# Codex, the CLI, which its desktop app and IDE extension share their
# configuration with on Windows [docs]. Facts from docs/research/codex.md,
# and those tagged [test] from the release gate's probes,
# uat/agents/codex.mjs and, for `%ProgramData%`, codex-machine.mjs in
# Windows Sandbox (docs/research/release-gate.md), which pass on 0.159.3,
# and, for Orca's home, orca-codex.mjs, which runs Orca 1.4.239's code;
# [binary] facts about Orca were read in its bundle.

format_version = 1
verified = { min = "0.159.3", max = "0.159.3" }

[agent]
id = "codex"
name = "Codex"

# `npm i -g @openai/codex`: the `codex.cmd` shim npm writes, and the
# package's manifest [disk].
[[installations]]
id = "npm"
folder = "%APPDATA%/npm"
executable = "codex.cmd"
versions = [{ block = "json-value", file = "node_modules/@openai/codex/package.json", key_path = ["version"] }]

# The TUI and the app-server daemon it shares are both `codex.exe` [disk].
[process]
images = ["codex.exe"]

# `~\.codex`, where Codex keeps everything unless `CODEX_HOME` moves it
# [source].
[[homes]]
id = "default"
default = true
folder = { block = "path", path = "~/.codex" }

[homes.roots]
config = "config.toml"
skills = "skills"
plugins = "plugins"
cloud_bundle = "cloud-config-bundle-cache.json"
sessions = "sessions"
archived_sessions = "archived_sessions"
state = "state_5.sqlite"

# Another folder `CODEX_HOME` names, which Codex reads for every launch in
# that environment [source]. A launch without it still reads `~\.codex`, so
# both are read.
[[homes]]
id = "codex-home"
folder = { block = "env", variable = "CODEX_HOME" }

[homes.roots]
config = "config.toml"
skills = "skills"
plugins = "plugins"
cloud_bundle = "cloud-config-bundle-cache.json"
sessions = "sessions"
archived_sessions = "archived_sessions"
state = "state_5.sqlite"

# The home Orca sets `CODEX_HOME` to when it starts a Codex on its shared
# home. Orca 1.4.239 does so only when the launch's environment or
# PowerShell profile sets a `CODEX_HOME` other than `~\.codex`. Its other
# launches run on `~\.codex` itself, or on an account's own home [binary].
# Before a launch on this home, Orca merges `~\.codex\config.toml` into the
# home's, never the file of `CODEX_HOME`. So the copy follows `~\.codex` at
# each such launch, and lags it between them [binary]. A server Disabled or
# Removed in `~\.codex` is Disabled or gone in the copy; a server only the
# copy holds stays [test]. `skills`, `plugins` and the other folders it
# shares are links to those of `~\.codex`, which follow at once. So is
# `AGENTS.md` where Windows lets Orca link a file; elsewhere it is a copy
# [test]. Orca also writes back to `~\.codex\config.toml` a few settings
# changed in the copy, such as `model`, and the plugin tables added there
# [test]. config-digger only reads it.
[[mirrored_homes]]
id = "orca"
owner = "Orca"
folder = { block = "path", path = "%APPDATA%/orca/codex-runtime-home/home" }
source = "default"

[[scopes]]
id = "managed"

[[scopes]]
id = "user"

[[scopes]]
id = "project"

# The skills Codex ships [source].
[[scopes]]
id = "system"

# The Scope of a plugin's servers and skills.
[[scopes]]
id = "plugin"

# Codex records the Projects it opened in each home [source, disk]: the
# folders its trust prompt answered for, lower-cased keys of `projects` in
# `config.toml`; the folder each session started in, `cwd` in the
# `session_meta` line that opens its `sessions\YYYY\MM\DD\rollout-*.jsonl`,
# or once archived, its `archived_sessions\rollout-*.jsonl`, not kept by
# date [test]; and in
# `state_5.sqlite`, the `cwd` of each thread and the `path` of each root of
# the projects the app lists. The `5` of `state_5.sqlite` is a schema
# generation, which changes with the version.
[projects]
registries = [
  { block = "toml-keys", anchor = { block = "home", root = "config" }, root = ["projects"] },
  { block = "jsonl-heads", anchor = { block = "home", root = "sessions" }, files = "*/*/*/rollout-*.jsonl", fields = [["payload", "cwd"]] },
  { block = "jsonl-heads", anchor = { block = "home", root = "archived_sessions" }, files = "rollout-*.jsonl", fields = [["payload", "cwd"]] },
  { block = "sqlite-column", anchor = { block = "home", root = "state" }, table = "threads", column = "cwd" },
  { block = "sqlite-column", anchor = { block = "home", root = "state" }, table = "project_roots", column = "path" },
]

# Plugins Codex installed, each in
# `%CODEX_HOME%\plugins\cache\<marketplace>\<plugin>\<version>`, its
# highest version being the one it loads [source]. Codex knows each by
# `<plugin>@<marketplace>`, and names it by its folder [source]. Its own
# switch, `[plugins."<id>"] enabled`, is with the Disable mechanisms below.
# `codex plugin remove <id>` uninstalls it, taking out its folder in the
# cache and its table in `config.toml` [test].
[[plugins]]
id = "installed"
registry = { block = "plugin-cache", anchor = { block = "home", root = "plugins", path = "cache" }, separator = "@", excludes = ".codex-remote-plugin-install.json" }
uninstall = "codex plugin remove {id}"

# Plugins the account installed from its catalog, marked by
# `.codex-remote-plugin-install.json` beside their versions [source, disk].
# Codex takes whether they are on from the account, not from a file
# [source], so config-digger only reads them.
[[plugins]]
id = "remote"
registry = { block = "plugin-cache", anchor = { block = "home", root = "plugins", path = "cache" }, separator = "@", requires = ".codex-remote-plugin-install.json" }

# Servers are the tables of `mcp_servers` in each layer of `config.toml`
# files Codex folds, from the lowest up [source]:
#
# - the machine's, `%ProgramData%\OpenAI\Codex\config.toml`, the folder
#   Windows names for `FOLDERID_ProgramData`, an organisation's defaults;
# - the enterprise cloud bundle the account delivers on sign-in, as Codex
#   caches it;
# - the user's, `%CODEX_HOME%\config.toml`;
# - with `--profile <name>`, `%CODEX_HOME%\<name>.config.toml`, which a
#   launch picks and is not read here;
# - a Project's, `<folder>\.codex\config.toml` in each folder from its root
#   down to the Project's own, the deepest highest. Its root is the folder
#   holding `.git`, or the Project's when none does;
#   a `.codex` that is the home's own, as in a Project at the user's home
#   folder, is no layer [source];
# - `-c` flags, which only a launch has.
#
# `managed_config.toml` is no layer on Windows: Codex ignores it with a
# warning [source].
#
# A server's transport is `command` for stdio, or `url` for streamable
# HTTP [source]. Codex does not replace references to variables in its
# values. `http_headers` and `http_headers_helper`, a command that prints
# headers, hold Secrets, as does the OAuth client's `client_secret`;
# `bearer_token_env_var` and the values of `env_http_headers` name
# variables [source].
#
# Codex rewrites `config.toml` with no lock while it runs, and `codex mcp
# add` or `remove` writes the whole of `mcp_servers` again [source]. It
# refuses to start on a layer it cannot parse [sandbox].
[[locations]]
id = "system-mcp"
anchor = { block = "machine", path = "%ProgramData%/OpenAI/Codex/config.toml" }
format = { block = "toml" }
root = ["mcp_servers"]
kind = "mcp"
scope = "managed"
provenance = "managed"
store_class = "plain"
secrets = { fields = [["http_headers"], ["http_headers_helper"], ["oauth", "client_secret"]], variable_names = [["bearer_token_env_var"], ["env_http_headers", "*"]] }
on_read_failure = "stops_agent"

# The enterprise cloud bundle, a layer between the machine's and the
# user's that the account delivers to Codex on sign-in [source]. Codex
# caches it in `%CODEX_HOME%\cloud-config-bundle-cache.json` for an hour:
# `signed_payload.bundle.config_toml.enterprise_managed` lists TOML
# fragments, highest first, each holding its text in `contents` [source].
# The cache is read even once it has expired, as of `cached_at`, since it
# shows the account has a cloud layer. Without the file there is no cloud
# layer to show.
[[locations]]
id = "cloud-mcp"
unverified = [
  { sentence = "Whether Codex still uses the cached bundle once it has expired is not known.", needs = "a Codex enterprise account with remote plugins" },
  { sentence = "What Codex does with a bundle cache it cannot parse is not known.", needs = "a Codex enterprise account with remote plugins" },
]
anchor = { block = "home", root = "cloud_bundle" }
format = { block = "toml-fragments", lists = [["signed_payload", "bundle", "config_toml", "enterprise_managed"], ["signed_payload", "bundle", "requirements_toml", "enterprise_managed"]], contents = "contents", highest_first = true }
root = ["signed_payload", "bundle", "config_toml", "enterprise_managed", "mcp_servers"]
kind = "mcp"
scope = "managed"
provenance = "managed"
store_class = "plain"
cached_at = ["signed_payload", "cached_at"]
secrets = { fields = [["http_headers"], ["http_headers_helper"], ["oauth", "client_secret"]], variable_names = [["bearer_token_env_var"], ["env_http_headers", "*"]] }
on_read_failure = "unknown"

[[locations]]
id = "user-mcp"
anchor = { block = "home", root = "config" }
format = { block = "toml" }
root = ["mcp_servers"]
kind = "mcp"
scope = "user"
provenance = "file"
store_class = "rewritten-while-running"
secrets = { fields = [["http_headers"], ["http_headers_helper"], ["oauth", "client_secret"]], variable_names = [["bearer_token_env_var"], ["env_http_headers", "*"]] }
on_read_failure = "stops_agent"

[[locations]]
id = "project-mcp"
anchor = { block = "project", path = ".codex/config.toml", walk = "up-to-repo-root" }
format = { block = "toml" }
root = ["mcp_servers"]
kind = "mcp"
scope = "project"
provenance = "file"
store_class = "plain"
secrets = { fields = [["http_headers"], ["http_headers_helper"], ["oauth", "client_secret"]], variable_names = [["bearer_token_env_var"], ["env_http_headers", "*"]] }
on_read_failure = "stops_agent"

# A plugin's servers, those its manifest declares in `mcpServers`, inline
# or as a path to a file of the plugin shaped like `.mcp.json`, or else
# those of its `.mcp.json` [source]. The plugin owns their transport:
# `config.toml` can only switch them [source]. Such a file holds its
# servers in `mcpServers`, or at its top level [source]. Codex starts
# without the servers of a plugin's `.mcp.json` it cannot parse, and keeps
# the plugin's skills [test].
#
# Its manifest is the first of `.codex-plugin\plugin.json`,
# `.claude-plugin\plugin.json` and `.cursor-plugin\plugin.json` it has
# [source]. Codex ignores a path of the manifest, here and in `skills`,
# that does not start with `./` or holds `..`, and any other value than a
# path or, here, an object [source]. It does not load a plugin without a
# manifest it can parse [source]; config-digger reads such a plugin's
# `.mcp.json` and `skills` folder when it has no manifest, and only its
# `skills` folder when the manifest does not parse. A `plugin.json` at the
# plugin's root naming an Agent Plugins `$schema`, which Codex reads first
# and in a format of its own [source], is not read.
[[locations]]
id = "plugin-mcp"
anchor = { block = "plugin", plugins = "installed", path = [".codex-plugin/plugin.json", ".claude-plugin/plugin.json", ".cursor-plugin/plugin.json"] }
references = { root = ["mcpServers"], default = ".mcp.json", dot_slash = true, bare = true }
format = { block = "json", dialect = "strict" }
root = ["mcpServers"]
kind = "mcp"
scope = "plugin"
provenance = "plugin"
store_class = "plain"
secrets = { fields = [["http_headers"], ["http_headers_helper"], ["oauth", "client_secret"]], variable_names = [["bearer_token_env_var"], ["env_http_headers", "*"]] }
on_read_failure = "ignores_file"

# The servers of a plugin the account installed, read only.
[[locations]]
id = "remote-plugin-mcp"
unverified = { sentence = "What Codex does with a `.mcp.json` it cannot parse, in a plugin the account installed, is not known.", needs = "a Codex enterprise account with remote plugins" }
anchor = { block = "plugin", plugins = "remote", path = [".codex-plugin/plugin.json", ".claude-plugin/plugin.json", ".cursor-plugin/plugin.json"] }
references = { root = ["mcpServers"], default = ".mcp.json", dot_slash = true, bare = true }
format = { block = "json", dialect = "strict" }
root = ["mcpServers"]
kind = "mcp"
scope = "plugin"
provenance = "account-managed"
store_class = "plain"
secrets = { fields = [["http_headers"], ["http_headers_helper"], ["oauth", "client_secret"]], variable_names = [["bearer_token_env_var"], ["env_http_headers", "*"]] }
on_read_failure = "unknown"

# Same-named servers of every layer make one server, table by table [source,
# sandbox]: a Project's `[mcp_servers.docs] args = [...]` replaces only the
# `args` of the user's `docs`, and `enabled = false` alone turns it off.
# Codex refuses to start on a server with both `command` and `url`
# [sandbox]. A higher layer's `enabled = true` turns on again a server a
# lower one turned off [test]. The server built from the layers beats a plugin's server of the same name
# whole, even when it is off, and of two plugins with such a server the
# first by id wins [source].
[items.mcp]
precedence = ["project-mcp", "user-mcp", "cloud-mcp", "system-mcp", "plugin-mcp", "remote-plugin-mcp"]
competition = { block = "exact-name" }
merge = { block = "deep-merge", exclusive = ["command", "url"], enabled = "enabled", locations = ["project-mcp", "user-mcp", "cloud-mcp", "system-mcp"] }
checks = ["trust", "rules", "merge", "disable", "precedence"]

# Codex's own switch for a server is `enabled = false` in its table, in
# any layer [docs, source]: the field merges with the others, so it turns
# off the server built from every layer, and the highest layer that sets it
# decides [source, sandbox, test]. Disable writes it in the Entry's own
# table, and is not offered below a layer that sets it. A table holding
# `enabled` alone, where no other layer declares the server, stops Codex
# with "invalid transport" [test]: one in the user's `config.toml` for a
# Project layer's server stops it in every other folder. So for an Entry of
# a git-versioned Project layer Disable writes `enabled = false` in the
# user's table of that server, which turns it off in every folder, or else
# a Stand-in there: `command` as the layer has it, or `url` without its
# userinfo, query and fragment, and `enabled = false`. In the Project the
# layer's fields win, and elsewhere Codex starts and lists a Disabled
# server with that field alone [test]; a Stand-in of the other transport
# than the layer's stops Codex in the Project [test]. Disable is not offered when a known
# Project declares the server with the other transport (#297). Enable
# deletes `enabled = false` from the highest layer that sets it and from
# each lower one down to the first that sets it otherwise, whoever wrote
# it, and leaves the table even when it is empty; it deletes a Stand-in
# whole, since taking `enabled` alone out of it turns the server on in
# every folder [test], and only in a Project whose layer gives the server
# its transport. It is not offered while one of them is in a git-versioned
# or managed layer (#287).
[[items.mcp.disable]]
block = "merged-field"
locations = ["project-mcp", "user-mcp"]
requires_unset_above = true
fallback = "user-mcp"
stand_in = ["command", "url"]

# A plugin's server has its own switch, `enabled = false` under
# `[plugins."<id>".mcp_servers.<name>]`, the only key `config.toml` can set
# for it besides approval and tool settings [source]. Enable takes the
# field away. A plugin the account installed honours it too [source], but
# config-digger only reads such a plugin. Codex reads it from
# the merged layers, but config-digger reads and writes it in the user's
# `config.toml` alone.
[[items.mcp.disable]]
block = "json-field"
unverified = { sentence = "That Codex honours the switch of a plugin's server, in a plugin the account installed too, comes from its source only.", needs = "a Codex enterprise account with remote plugins" }
switch = { anchor = { block = "home", root = "config" }, key_path = ["plugins", "{plugin_id}", "mcp_servers", "{name}", "enabled"], store_class = "rewritten-while-running", toml = true }
target = "entry"
context = "all"
enable_action = "delete-key"
disabled_value = false
reason = "disabled_natively"
locations = ["plugin-mcp", "remote-plugin-mcp"]

# A plugin is on or off with every server and skill it carries by
# `[plugins."<id>"] enabled`, which Codex writes `true` when it installs the
# plugin and its `/plugins` turns `false` and back [source, docs]. A plugin
# missing from `config.toml` is off, with its servers and skills [test].
# These switches are repeated for skills below.
[[items.mcp.disable]]
block = "json-field"
switch = { anchor = { block = "home", root = "config" }, key_path = ["plugins", "{plugin_id}", "enabled"], store_class = "rewritten-while-running", toml = true }
target = "plugin"
context = "all"
enable_action = "set"
enabled_value = true
disabled_value = false
default_value = false
reason = "plugin_disabled"
locations = ["plugin-mcp"]

# A Project's layer counts only once the user trusts its folder, written by
# Codex's trust prompt as `[projects.'<path>'] trust_level = "trusted"` in
# the user's `config.toml`, the path lower-cased [source, disk]. Codex looks
# up the layer's folder, then the Project's root, then the main checkout of
# its git repository, so that trusting a repository trusts its worktrees
# [source]. The machine's layer can trust folders too [source]. An
# untrusted layer is loaded and left out [source, sandbox].
[[items.mcp.gates]]
block = "project-trust"
locations = ["project-mcp"]
sources = [
  { anchor = { block = "home", root = "config" }, key_path = ["projects"], toml = true },
  { anchor = { block = "machine", path = "%ProgramData%/OpenAI/Codex/config.toml" }, key_path = ["projects"], toml = true },
]
field = "trust_level"
trusted = "trusted"

# An organisation allows MCP servers in `requirements.toml`, which adds no
# server of its own [source]: `[mcp_servers.<name>] identity = { command =
# "…" }` allows the server of that name with that command, whatever its
# args, and `{ url = "…" }` with that URL [source, test]. `identity =
# { command = { executable = "…", args = [<matcher>, …] } }` also needs as
# many args, each matching its matcher, and `identity = { url = <matcher> }`
# a matching URL: `{ match = "exact" | "prefix", value = "…" }` or
# `{ match = "regex", expression = "…" }` on the whole value; a regex that
# does not compile stops Codex [source, test]. A prefix or regex cannot see
# a Secret config-digger masks, so config-digger lets a masked arg or URL
# meet it; a regex that does not compile matches nothing here, and
# config-digger does not say that Codex will not start. Once it lists any,
# Codex turns off every other server [source, test], checking
# the server it built from its layers [source]. The machine's
# `%ProgramData%\OpenAI\Codex\requirements.toml` is the lowest source and
# the cloud bundle's `requirements_toml` fragments rank above it, merged
# name by name [source]. A requirement turns the server off by
# `enabled = false`, so the server Codex built still beats a plugin's server
# of the same name [source].
[[items.mcp.rules]]
block = "identity-allowlist"
identity = "identity"
locations = ["project-mcp", "user-mcp", "cloud-mcp", "system-mcp"]
sources = [
  { anchor = { block = "home", root = "cloud_bundle" }, key_path = ["signed_payload", "bundle", "requirements_toml", "enterprise_managed", "mcp_servers"], fragments = { lists = [["signed_payload", "bundle", "requirements_toml", "enterprise_managed"]], contents = "contents", highest_first = true }, cached_at = ["signed_payload", "cached_at"], policy = true },
  { anchor = { block = "machine", path = "%ProgramData%/OpenAI/Codex/requirements.toml" }, key_path = ["mcp_servers"], toml = true, policy = true },
]

# A plugin's servers answer to `[plugins."<id>".mcp_servers]` alone, and
# only once some plugin has one [source].
[[items.mcp.rules]]
block = "identity-allowlist"
identity = "identity"
per_plugin = ["mcp_servers"]
locations = ["plugin-mcp", "remote-plugin-mcp"]
sources = [
  { anchor = { block = "home", root = "cloud_bundle" }, key_path = ["signed_payload", "bundle", "requirements_toml", "enterprise_managed", "plugins"], fragments = { lists = [["signed_payload", "bundle", "requirements_toml", "enterprise_managed"]], contents = "contents", highest_first = true }, cached_at = ["signed_payload", "cached_at"], policy = true },
  { anchor = { block = "machine", path = "%ProgramData%/OpenAI/Codex/requirements.toml" }, key_path = ["plugins"], toml = true, policy = true },
]

# Skills come from these roots, Repo first [source]. A skill is a folder
# holding a `SKILL.md` whose frontmatter has a `name` and a `description`
# [docs]. A folder whose name starts with `.` is not read, so `.system` is
# read apart.
#
# `.codex\skills` in each folder whose `.codex\config.toml` is a Project
# layer, from the repo root down to the Project, read even when the layer
# is untrusted [source, sandbox], against the docs.
[[locations]]
id = "project-skills"
anchor = { block = "project", path = ".codex/skills", walk = "up-to-repo-root" }
format = { block = "skill-folder", recursive = true, max_depth = 6, name_from = "frontmatter", no_frontmatter = "skip", malformed_frontmatter = "quote-values", no_name = "folder-name" }
kind = "skill"
switch_id = "{skill_file}"
scope = "project"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

# `.agents\skills` in each folder from the repo root down to the Project
# [source, docs], read even in a Project Codex does not trust [test].
[[locations]]
id = "project-agents-skills"
anchor = { block = "project", path = ".agents/skills", walk = "up-to-repo-root" }
format = { block = "skill-folder", recursive = true, max_depth = 6, name_from = "frontmatter", no_frontmatter = "skip", malformed_frontmatter = "quote-values", no_name = "folder-name" }
kind = "skill"
switch_id = "{skill_file}"
scope = "project"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

# `%CODEX_HOME%\skills`, which Codex still reads although it deprecates the
# folder [source].
[[locations]]
id = "user-skills"
anchor = { block = "home", root = "skills" }
format = { block = "skill-folder", recursive = true, max_depth = 6, name_from = "frontmatter", no_frontmatter = "skip", malformed_frontmatter = "quote-values", no_name = "folder-name" }
kind = "skill"
switch_id = "{skill_file}"
scope = "user"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

# `~\.agents\skills`, found from the user's home folder, not `CODEX_HOME`,
# so every Codex home reads it [source]. VS Code reads it too [disk].
[[locations]]
id = "agents-skills"
anchor = { block = "machine", path = "~/.agents/skills" }
format = { block = "skill-folder", recursive = true, max_depth = 6, name_from = "frontmatter", no_frontmatter = "skip", malformed_frontmatter = "quote-values", no_name = "folder-name" }
kind = "skill"
switch_id = "{skill_file}"
scope = "user"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

# The skills Codex ships, which it deletes and extracts again into
# `%CODEX_HOME%\skills\.system` whenever its own differ [source].
[[locations]]
id = "system-skills"
anchor = { block = "home", root = "skills", path = ".system" }
format = { block = "skill-folder", recursive = true, max_depth = 6, name_from = "frontmatter", no_frontmatter = "skip", malformed_frontmatter = "quote-values", no_name = "folder-name" }
kind = "skill"
scope = "system"
provenance = "built-in"
store_class = "plain"
on_read_failure = "ignores_file"

# An organisation's skills, next to the machine's `config.toml` [source, docs].
[[locations]]
id = "admin-skills"
anchor = { block = "machine", path = "%ProgramData%/OpenAI/Codex/skills" }
format = { block = "skill-folder", recursive = true, max_depth = 6, name_from = "frontmatter", no_frontmatter = "skip", malformed_frontmatter = "quote-values", no_name = "folder-name" }
kind = "skill"
scope = "managed"
provenance = "managed"
store_class = "plain"
on_read_failure = "ignores_file"

# A plugin's skills, in the folders of skill folders its manifest names in
# `skills`, a path or a list of them, or else in its `skills` folder
# [source]. Codex names them `<plugin>:<skill>` [source]. It finds every
# `SKILL.md` below each folder, the folder's own included, up to 6 folders
# down [source], as in the `skills` folder of an installed plugin [test]; a
# declared folder holding one is read here as that one skill alone.
[[locations]]
id = "plugin-skills"
anchor = { block = "plugin", plugins = "installed", path = [".codex-plugin/plugin.json", ".claude-plugin/plugin.json", ".cursor-plugin/plugin.json"] }
format = { block = "manifest-skills", field = ["skills"], default = "skills", dot_slash = true, path_may_name_one = true, skills = { recursive = true, max_depth = 6, name_from = "frontmatter", no_frontmatter = "skip", malformed_frontmatter = "quote-values", no_name = "folder-name" } }
name_template = "{plugin}:{name}"
kind = "skill"
scope = "plugin"
provenance = "plugin"
store_class = "plain"
on_read_failure = "ignores_file"

# The skills of a plugin the account installed, read only.
[[locations]]
id = "remote-plugin-skills"
unverified = { sentence = "That Codex caps a plugin's skill folders at 6 folders deep too is not tested.", needs = "a Codex enterprise account with remote plugins" }
anchor = { block = "plugin", plugins = "remote", path = [".codex-plugin/plugin.json", ".claude-plugin/plugin.json", ".cursor-plugin/plugin.json"] }
format = { block = "manifest-skills", field = ["skills"], default = "skills", dot_slash = true, path_may_name_one = true, skills = { recursive = true, max_depth = 6, name_from = "frontmatter", no_frontmatter = "skip", malformed_frontmatter = "quote-values", no_name = "folder-name" } }
name_template = "{plugin}:{name}"
kind = "skill"
scope = "plugin"
provenance = "account-managed"
store_class = "plain"
on_read_failure = "ignores_file"

# Codex lists every skill it finds, by the path of its `SKILL.md`, so two
# skills with one name are both used [source, docs]. Trust keeps out no
# skill. It finds skill folders up to 6 folders below a root [test], and
# below a plugin's skills folder by the same loader [source], an installed
# plugin's `skills` folder too [test]. It skips a `SKILL.md` that is not
# UTF-8 or cannot be opened [test]. A frontmatter that is not YAML it reads again with each
# plain value that holds `: ` quoted, as `quote-values` says:
# `description: Use when: x` loads, and `name: [unclosed` names a skill
# `[unclosed` [source, test]. A stray line, an indented `name`, two `name`
# lines, a quote that never closes, such a value going on over indented
# lines and a value ending in `:` without holding `: ` still skip the
# skill, and a frontmatter that never closes is none [source, test]. A
# frontmatter without a `name`, or with an empty one, names the skill after
# its folder, with its `description` [source, test], as
# `no_name = "folder-name"` says (#466). One without a `description` skips
# it [source], which config-digger does not: a ticket, not filed yet.
[items.skill]
precedence = ["project-skills", "project-agents-skills", "user-skills", "agents-skills", "system-skills", "admin-skills", "plugin-skills", "remote-plugin-skills"]
competition = { block = "never" }
checks = ["frontmatter", "disable", "precedence"]

# Codex turns a skill off by a `[[skills.config]]` rule in the user's
# `config.toml` alone, a Project's layer holding none it reads [docs,
# source, sandbox]: `path`, the skill's `SKILL.md`, or `name`, every skill
# of that name, with `enabled = false`, the later rule winning [source].
# Disable adds a rule by path, which reaches the one skill, written as an
# absolute path with the links of its folders resolved, since Codex
# canonicalises the paths of rules before it compares them [source]: a
# rule's path matches the `SKILL.md` in any case, with either slash, and
# with or without `\\?\` [test]. Enable takes the rule out. Of several
# rules by path, or by name, for one skill the later counts, but a rule by
# path and one by name are each read on their own.
[[items.skill.disable]]
block = "json-item-list"
switch = { anchor = { block = "home", root = "config" }, key_path = ["skills", "config", "{name}"], named_by = "path", later_wins = true, store_class = "rewritten-while-running", toml = true }
target = "entry"
context = "all"
enable_action = "remove-item"
disabled_item = { path = "{name}", enabled = false }
enabled_item = { path = "{name}", enabled = true }
ignore_case = true
reason = "disabled_natively"
locations = ["project-skills", "project-agents-skills", "user-skills", "agents-skills"]

# A rule by name turns off every skill of that name; config-digger only
# reads it.
[[items.skill.disable]]
block = "json-field"
switch = { anchor = { block = "home", root = "config" }, key_path = ["skills", "config", "{name}", "enabled"], named_by = "name", later_wins = true, store_class = "rewritten-while-running", toml = true }
target = "name"
context = "all"
enable_action = "delete-key"
disabled_value = false
enable_offered = false
reason = "disabled_by_name"
locations = ["project-skills", "project-agents-skills", "user-skills", "agents-skills"]

[[items.skill.disable]]
block = "json-field"
switch = { anchor = { block = "home", root = "config" }, key_path = ["plugins", "{plugin_id}", "enabled"], store_class = "rewritten-while-running", toml = true }
target = "plugin"
context = "all"
enable_action = "set"
enabled_value = true
disabled_value = false
default_value = false
reason = "plugin_disabled"
locations = ["plugin-skills"]
