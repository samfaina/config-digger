format = { block = "manifest-skills", field = ["skills"], default = "skills", adds_to_default = true, path_may_name_one = true, skills = { name_from = "folder", sanitize = "hyphen-per-unit", no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name", name_rule = "visible-chars", name_rule_on = "entry-name" }, one_skill = { name_from = "frontmatter", trims_name = true, sanitize = "hyphen-per-unit", no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name", name_rule = "visible-chars", name_rule_on = "entry-name" } }
name_rule_when = { gate = "tengu_slate_wicket" }
name_template = "{plugin}:{name}"
kind = "skill"
scope = "plugin"
provenance = "plugin"
store_class = "plain"
on_read_failure = "fails_plugin"

