# The `/skills` menu: `skillOverrides: {"<name>": "off"}` in the Project's
# local settings [docs]. `"name-only"` lists only the name to Claude and
# `"user-invocable-only"` lists nothing, both keeping the skill in the `/`
# menu: partial switches. `"on"` is the default. It does not apply to plugin
# skills [docs]. It turns a synced skill off by `anthropic-skills:<folder>`,
# or by `<folder>` alone, which a local skill of that folder answers to too
# [test]. It turns a nested skill off by the name it is listed under, and
# one listed as `<subfolder>:<name>` by its folder's name too, which a
# Project or user skill of that name answers to [test]. In each of the
# three files below, `name-only` and `user-invocable-only` limit a synced
# skill under either of its keys, and leave `/anthropic-skills:<folder>`
# running it; of two keys that disagree, `anthropic-skills:<folder>`
# decides, whichever the file holds first [test]. config-digger reads both
# keys through `also_names`, and Disable writes the first; it counts `off`
# under either, so it shows Disabled a skill whose prefixed key holds `on`
# (#510). Each of the three switches marks what config-digger does not
# show yet, and what the probe did not test.
[[items.skill.disable]]
unverified = [
  "Of a synced skill's two keys, config-digger counts `off` under the bare `<folder>` beside `\"anthropic-skills:<folder>\": \"on\"`, though Claude Code then reads the skill: the prefixed key decides (#510).",
  "`name-only` and `user-invocable-only` are taken to limit a nested skill, under either of its keys, as they do another skill.",
]
block = "json-field"
switch = { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["skillOverrides", "{name}"], also_names = ["{own_name}"], store_class = "plain" }
target = "name"
context = "project"
enable_action = "delete-key"
reason = "disabled_by_name"
disabled_value = "off"
partial_values = ["name-only", "user-invocable-only"]
locations = ["managed-skills", "user-skills", "project-skills", "nested-skills", "synced-skills"]

