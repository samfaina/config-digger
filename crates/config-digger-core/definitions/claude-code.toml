interpolation = { block = "braces", default_separator = ":-" }
plugin_root = { reference = "${CLAUDE_PLUGIN_ROOT}", fields = ["command", "args", "env", "url", "headers", "headersHelper"], forward_slashes = true }
on_read_failure = "fails_plugin"
on_shape_failure = "fails_plugin"
shape = { block = "fields", one_of = ["command", "url"], types = { type = "string", command = "string", args = "string-array", env = "string-map", url = "string", headers = "string-map" } }

# A synced plugin's servers, in its `.mcp.json` and its manifest's
