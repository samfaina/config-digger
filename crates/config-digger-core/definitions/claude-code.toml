#:schema ../../../schema/agent-definition.schema.json
# Claude Code. Facts from docs/research/claude-code.md, and those tagged
# [test] from the release gate's probes, uat/agents/claude-code.mjs and,
# for `%ProgramFiles%` and the policy values, claude-code-machine.mjs in
# Windows Sandbox, and, for the skills synced from claude.ai,
# claude-account.mjs with a claude.ai account
# (docs/research/release-gate.md). They pass on 2.1.299 to 2.1.309;
# 2.1.286 reads plain-string lists and skill names as before 2.1.299.

format_version = 1
verified = { min = "2.1.299", max = "2.1.309" }

[agent]
id = "claude-code"
name = "Claude Code"
# claude.ai connectors live in the account; Claude Code keeps only their
# names, as `claude.ai <Name>`, in `disabledMcpServers` [docs, disk].
notes = ["cloud_connectors_not_on_disk"]

# The native installer's launcher. It is a copy of the newest file in
# `~/.local/share/claude/versions`, whose older files are not Installations.
[[installations]]
id = "native"
folder = "~/.local/bin"
executable = "claude.exe"
versions = [{ block = "exe-version" }]

# `npm i -g @anthropic-ai/claude-code`: the `claude.cmd` shim npm writes, and
# the package's manifest [docs]. It runs in `node.exe`, which the session
# files of `[process]` cover.
[[installations]]
id = "npm"
folder = "%APPDATA%/npm"
executable = "claude.cmd"
versions = [{ block = "json-value", file = "node_modules/@anthropic-ai/claude-code/package.json", key_path = ["version"] }]

# The copy Claude Desktop downloads, one folder per version, for its classic
# install [docs] and virtualised into its MSIX package [disk]. 2.1.284 sat in
# its version folder; 2.1.286 and 2.1.299 sit one hash-named folder further
# down [disk]. A package that moved its data folder to
# `%LOCALAPPDATA%\Claude-Data\<family>` keeps the copy there: the Store
# package's on disk [disk], the `AnthropicPBC.Claude` package's by its
# bundle [bundle].
[[installations]]
id = "claude-desktop"
folder = "%APPDATA%/Claude/claude-code/{*,*/*}"
executable = "claude.exe"
versions = [{ block = "exe-version" }]

[[installations]]
id = "claude-desktop-msix"
folder = "%LOCALAPPDATA%/{Packages/Claude_pzs8sxrjxfjjc/LocalCache/Roaming/Claude,Packages/AnthropicPBC.Claude_fnn82j28hfe8t/LocalCache/Roaming/Claude,Claude-Data/claude_pzs8sxrjxfjjc,Claude-Data/anthropicpbc.claude_fnn82j28hfe8t}/claude-code/{*,*/*}"
executable = "claude.exe"
versions = [{ block = "exe-version" }]

# The version whose release notes were last shown: the one that last ran
# against the home [disk].
[last_ran]
anchor = { block = "home", root = "state_file" }
key_path = ["lastReleaseNotesSeen"]

# The native Installation runs as `claude.exe` from `~/.local/bin`. Claude
# Desktop is also `claude.exe`, so the path tells them apart. Each running
# session keeps `~/.claude/sessions/<pid>.json`, which also covers an npm
# Installation in `node.exe`; only its name is read.
[process]
images = ["claude.exe"]
paths = ["~/.local/bin/claude.exe"]
session_files = { block = "pid-named", folder = { block = "path", path = "~/.claude/sessions" }, extension = "json" }

# The claude.ai account Claude Code is signed in to, its Signed-in account:
# `oauthAccount` in `~/.claude.json` names it [disk]. Signing in writes it,
# and `claude auth logout` and `/logout` take it away, the 2.1.309 to
# 2.1.311 binaries say [binary]. Claude Code reads the skills and plugins
# it syncs from claude.ai only from the account's folder,
# `<organizationUuid>_<accountUuid>` [test]. It runs on the account by the
# claude.ai tokens it keeps, though, `.credentials.json` on Windows: with
# `oauthAccount` and no tokens it is signed out and reads no synced skill
# or plugin; with tokens and no `oauthAccount` it reads none offline, and
# online it fetches the account at start, writes `oauthAccount` back and
# reads the synced skills [test]. config-digger reads `oauthAccount` alone
# (#491).
[account]
name = "claude.ai"
anchor = { block = "home", root = "state_file" }
ids = { organization = ["oauthAccount", "organizationUuid"], account = ["oauthAccount", "accountUuid"] }
folder = "{organization}_{account}"

# What takes Claude Code off the account, so that it reads none of the
# account's synced skills and plugins in the context. It runs on the
# account only while its token is its own claude.ai sign-in [binary]:
# `apiKeyHelper` in the user's or a Project's settings, or a non-empty
# `ANTHROPIC_AUTH_TOKEN` or `CLAUDE_CODE_OAUTH_TOKEN` in the `env` of the
# user's or a Project's settings or in the environment, takes it off; an
# empty one leaves it on [test]. In a Project's settings,
# `CLAUDE_CODE_OAUTH_TOKEN` takes only the synced skills off, and the
# synced plugins stay loaded [test] (#493). Settings files rank managed
# (every source), local, Project, user, and a higher file's variable wins
# [docs]. Set in the environment config-digger runs in, those variables
# only may: Claude Code can start in another.
#
# A third-party provider leaves Claude Code on the account: with
# `CLAUDE_CODE_USE_BEDROCK` it reads the synced skills, and keeps out the
# synced plugins only because it holds the plugin sync gate off [test]. The
# other providers leave it on alike [binary], and hold the gate off as its
# bypass says. `ANTHROPIC_API_KEY` leaves it on under
# `-p` [test], and `primaryApiKey` in `~/.claude.json` leaves it on [test].
[account.off]
unverified = "`ANTHROPIC_API_KEY` is taken to leave an interactive session on the account too, whether the user approved the key or not, as the binary says (#492)."
settings = [
  { anchor = { block = "settings", settings = "managed" }, key_path = ["apiKeyHelper"], every_source = true },
  { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["apiKeyHelper"] },
  { anchor = { block = "project", path = ".claude/settings.json" }, key_path = ["apiKeyHelper"] },
  { anchor = { block = "home", root = "settings_file" }, key_path = ["apiKeyHelper"] },
]
variables = [
  { name = "ANTHROPIC_AUTH_TOKEN", values = "non-empty" },
  { name = "CLAUDE_CODE_OAUTH_TOKEN", values = "non-empty" },
]
env_maps = [
  { anchor = { block = "settings", settings = "managed" }, key_path = ["env"], every_source = true },
  { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["env"] },
  { anchor = { block = "project", path = ".claude/settings.json" }, key_path = ["env"] },
  { anchor = { block = "home", root = "settings_file" }, key_path = ["env"] },
]

[[homes]]
id = "default"
default = true
folder = { block = "path", path = "~" }

[homes.roots]
# `~/.claude.json` holds user and local Scope MCP servers.
state_file = ".claude.json"
# The user settings, which hold Disable switches but no Entries.
settings_file = ".claude/settings.json"
# Personal skills, one folder each, and the skills synced from claude.ai.
skills = ".claude/skills"
# The plugins Claude Code installed, and the cache of their files.
plugins = ".claude/plugins"

# The settings an organisation deploys, highest first [docs]. The cache of
# server-managed settings, which claude.ai or a gateway delivers, ranks
# above them all [docs]. Claude Code reads them only from the first source
# that holds a setting, a key other than the two control keys [docs, test].
# An admin source it cannot parse stops it; an HKCU value it cannot parse
# it skips [docs, test]. When the highest source that holds a control key
# or a setting sets
# `managedSourcesBehavior = "merge"`, it merges that source with every
# admin source below it that holds a setting: a higher source's value
# wins, and lists combine [docs]. The HKCU value is user-writable: it
# applies only when no admin source holds settings, and never merges [docs].
[[settings]]
id = "managed"
unverified = { sentence = "`~/.claude/remote-settings.json` is taken to hold the server-managed settings as one JSON object, as a managed settings file does.", needs = "Claude Teams or Enterprise" }
control_keys = ["managedSourcesBehavior", "wslInheritsWindowsSettings"]
merge = { key = "managedSourcesBehavior", value = "merge" }
sources = [
  { block = "files", path = "~/.claude/remote-settings.json" },
  { block = "registry-value", hive = "local-machine", key = 'SOFTWARE\Policies\ClaudeCode', value = "Settings", on_read_failure = "stops_agent" },
  { block = "files", path = "%ProgramFiles%/ClaudeCode/managed-settings.json", drop_ins = "%ProgramFiles%/ClaudeCode/managed-settings.d", on_read_failure = "stops_agent" },
  { block = "registry-value", hive = "current-user", key = 'SOFTWARE\Policies\ClaudeCode', value = "Settings", user_writable = true, on_read_failure = "ignores_file" },
]

[[scopes]]
id = "managed"

[[scopes]]
id = "local"

[[scopes]]
id = "project"

[[scopes]]
id = "user"

# The Scope Claude Code applies a plugin's servers and skills at [docs].
[[scopes]]
id = "plugin"

# Every Project Claude Code has been started on has a key in `projects`, in
# whatever spelling it was started with (`E:/x` and `E:\x` both occur).
[projects]
registries = [
  { block = "json-keys", anchor = { block = "home", root = "state_file" }, root = ["projects"] },
]

# Plugins installed from a marketplace [docs, disk]. `installed_plugins.json`
# maps each `<name>@<marketplace>` to an array of records, one per Scope it
# is installed at, each with its folder in the plugin cache; a `local` or
# `project` record names the one Project it applies in. When Claude Code
# updates a plugin it marks the version it supersedes with `.orphaned_at`
# and deletes it 14 days later; it no longer loads it. A plugin is named by
# its manifest's `name`, the manifest being optional [docs], or else by its
# id up to `@`. `claude plugin uninstall` also deletes the plugin's data
# folder [docs].
[[plugins]]
id = "installed"
superseded_marker = ".orphaned_at"
name = { file = ".claude-plugin/plugin.json", key_path = ["name"] }
id_separator = "@"
uninstall = "claude plugin uninstall {id} --scope {scope}"

[plugins.registry]
block = "json-plugin-records"
anchor = { block = "home", root = "plugins", path = "installed_plugins.json" }
root = ["plugins"]
folder = "installPath"
scope = "scope"
project = "projectPath"
version = "version"

# A plugin of a `directory` marketplace, a folder of the user's, is read
# from that folder, not from its copy in the cache [test]: the folder its
# entry in the marketplace's `.claude-plugin/marketplace.json` names, its
# `source` being a path relative to the marketplace's folder [test]. Its
# servers and skills, `${CLAUDE_PLUGIN_ROOT}` and every path config-digger
# shows or writes for it are there; `.orphaned_at` is still looked for in
# the copy its record names. An entry whose `source` is not a path below
# the marketplace's folder, a `github` object or `../x`, leaves the plugin
# read from its copy in the cache [test]. When the manifest is missing or
# does not parse, Claude Code loads none of the marketplace's plugins, and
# when it does not list a plugin, not that one [test]; config-digger still
# reads them from the cache (#506). Claude Code records the marketplace in
# `known_marketplaces.json`, with the folder in `installLocation` and in
# its `source`, and the user settings record that `source` under
# `extraKnownMarketplaces` [disk].
[plugins.registry.marketplaces]
anchor = { block = "home", root = "plugins", path = "known_marketplaces.json" }
settings = [{ anchor = { block = "home", root = "settings_file" }, key_path = ["extraKnownMarketplaces"] }]
kind = ["source", "source"]
folder_kind = "directory"
folder = [["installLocation"], ["source", "path"]]
manifest = ".claude-plugin/marketplace.json"
plugins = ["plugins"]
name = "name"
source = "source"

# Plugins synced from claude.ai, one folder each in
# `plugins/synced/<org>_<account>/<name>~g<generation>` [disk], `<name>` in
# 2.1.309 [disk], beside the account's `manifest.json`,
# `.marketplaces.json`, `.last-complete-round` and a
# `<name>~g<generation>.meta.json` per plugin, none of them a plugin, and
# the empty file `synced/.bucket-<org>_<account>` [disk]. Claude Code
# owns this copy and loads it with no `enabledPlugins` key [disk]. It loads
# only a plugin the account's `manifest.json` lists, and a sync round
# deletes one claude.ai does not list [test]; config-digger reads every
# folder (#494). A synced plugin is named by its manifest's `name`, not by
# its folder [disk], and its switches know it as `<name>@synced` [docs].
# Its Entries are read-only, being a copy of the
# account's configuration. Like `synced-skills`, its servers and skills
# are read only in the Signed-in account's folder, and while Claude Code
# runs on that account [test]; unlike them, only while the plugin sync gate
# is on [test]. The locations anchored in synced plugins take the gate's
# and the `signed-in-account` conditions.
#
# Of same-named plugins Claude Code loads one: an installed marketplace
# plugin, then a skills-dir plugin, then a synced one [docs]. While an
# installed plugin of its name applies, a synced plugin loses to it whole
# (`loses_to`): every server and skill of the synced plugin is Shadowed,
# those the installed one lacks too, and none of them competes with
# another server or skill.
[[plugins]]
id = "synced"
unverified = [
  "A synced plugin folder with no manifest `name` is taken to be named by its folder up to `~g<generation>`.",
  "An installed plugin of a synced plugin's name that is off, by `enabledPlugins` or forced off by the managed settings, or that no settings file names, is taken to leave the synced one loaded.",
  "An installed plugin of a synced plugin's name bound to one Project, by its record's `projectPath`, is taken to keep the synced one out in that Project alone.",
  "An installed plugin of a synced plugin's name that fails to load, its manifest failing, is taken to keep the synced one out still.",
  "A synced plugin is taken to carry the servers of its `.mcp.json` and its manifest's `mcpServers`, and the skills of its manifest's `skills`, as an installed plugin does; its servers compete by endpoint as an installed plugin's do.",
]
registry = { block = "plugin-folders", anchor = { block = "home", root = "plugins", path = "synced" }, depth = 2 }
name = { file = ".claude-plugin/plugin.json", key_path = ["name"] }
id_separator = "~g"
id_template = "{plugin}@synced"
loses_to = ["installed"]

# Servers an administrator deploys to the machine [docs]. config-digger
# only reads them. Claude Code skips a `managed-mcp.json` it cannot parse,
# `claude mcp list` reports it, and the file keeps its exclusive control:
# only the servers of `managedMcpServers` load [test].
[[locations]]
id = "managed-mcp"
anchor = { block = "machine", path = "%ProgramFiles%/ClaudeCode/managed-mcp.json" }
format = { block = "json", dialect = "strict" }
root = ["mcpServers"]
kind = "mcp"
scope = "managed"
provenance = "managed"
store_class = "plain"
interpolation = { block = "braces", default_separator = ":-" }
on_read_failure = "ignores_file"
shape = { block = "fields", one_of = ["command", "url"], types = { type = "string", command = "string", args = "string-array", env = "string-map", url = "string", headers = "string-map" } }

# Servers the managed settings declare in `managedMcpServers` [docs]. An
# HKLM value, `managed-settings.json` or drop-in that Claude Code cannot
# parse stops it, even beside a source that parses; an HKCU value it cannot
# parse is skipped [test]. Each source says so. Claude Code never reads
# `managedMcpServers` from the HKCU value [docs, test], though it applies
# the value's other settings when no admin source holds any: the location
# leaves the HKCU value out, `skips_user_writable`. It drops an entry that
# fails one of these checks and still loads the others: `type` is `http`,
# `sse` or `streamable-http`, an alias of `http` [docs]; `url` starts with
# `https://`, a plain `http://` URL refused [test], `localhost` included
# [docs]; the entry holds no `command` [test], `args`, `env` or
# `headersHelper` [docs]; no key or value holds a control or invisible
# formatting character [docs], a control or format character, U+2028 or
# U+2029, in any key of an object or any string [binary]; no value holds a
# `${VAR}` reference, since it expands none here [docs], a string being
# checked for the characters first [binary]; and the name holds only
# letters, digits, `-` and `_` [docs], the name being no key of that walk
# [binary], and is none of `constructor`, `prototype`, `__proto__`,
# `__defineGetter__`, `__defineSetter__`, `__lookupGetter__` and
# `__lookupSetter__`, matched exactly and with case [binary], a rule the docs
# do not state. Claude Code walks no deeper than five levels of nesting
# [binary]; config-digger checks every depth, and every string for the
# characters before any for a reference. A dropped entry competes with no server by name: a user server of
# its name loads, beside an entry with a command or at an `http://` URL, in
# `managed-settings.json` or the HKLM value [test].
[[locations]]
id = "managed-settings-mcp"
unverified = [
  { sentence = "What Claude Code does with a `remote-settings.json` it cannot parse is not known.", needs = "Claude Teams or Enterprise" },
  "Every character the rule against control and invisible formatting characters refuses is taken from the 2.1.312 binary, with config-digger's Unicode tables; none was tested.",
  "The seven server names Claude Code refuses, and that it takes the other `Object.prototype` names such as `toString`, are read from the 2.1.312 binary; none was tested.",
]
anchor = { block = "settings", settings = "managed", skips_user_writable = true }
format = { block = "json", dialect = "strict" }
root = ["managedMcpServers"]
kind = "mcp"
scope = "managed"
provenance = "managed"
store_class = "plain"
on_read_failure = "unknown"
shape = { block = "fields", required = ["type", "url"], values = { type = ["http", "sse", "streamable-http"] }, prefixes = { url = "https://" }, forbidden = ["command", "args", "env", "headersHelper"], refused_chars = "control-or-format", no_references = true, name = "letters-digits-dash-underscore", refused_names = ["constructor", "prototype", "__proto__", "__defineGetter__", "__defineSetter__", "__lookupGetter__", "__lookupSetter__"], types = { type = "string", url = "string", headers = "string-map" } }

[[locations]]
id = "local-mcp"
anchor = { block = "home", root = "state_file" }
format = { block = "json", dialect = "strict" }
root = ["projects", "{project}", "mcpServers"]
kind = "mcp"
scope = "local"
provenance = "file"
# Claude Code rewrites `~/.claude.json` every few minutes while it runs.
store_class = "rewritten-while-running"
# `${VAR}` and `${VAR:-default}` in `command`, `args`, `env`, `url` and `headers`.
interpolation = { block = "braces", default_separator = ":-" }
# When `~/.claude.json` doesn't parse, Claude Code keeps a `.corrupted` copy
# and asks whether to exit or reset the file [docs].
on_read_failure = "asks_user"
risks = ["agent_may_reset_file"]
shape = { block = "fields", one_of = ["command", "url"], types = { type = "string", command = "string", args = "string-array", env = "string-map", url = "string", headers = "string-map" } }

# Claude Code reads `.mcp.json` in the Project folder and in every folder
# above it, past the root of its git repo and outside one, the user's home
# folder included, but not at the root of the drive, and of same-named
# servers the nearest folder's wins [test]. It walks up while the folder is
# not its path's root [binary], so it skips the root of a share too. Each
# file's servers are the Project's: `disabledMcpjsonServers` in the
# Project's local settings skips a parent folder's server, and the list in
# a parent folder's own settings does not [test]. The approvals name a
# server, not its file [docs], and are read from the Project's own settings
# and state too. Claude Code skips a `.mcp.json` it cannot parse, the
# others still read, and `claude mcp list` reports it [test].
# A linked worktree is walked the same way, with no fallback to its main
# checkout: the main checkout's `.mcp.json` is read in a worktree inside
# it, as a folder above, and not in one outside it [test].
[[locations]]
id = "project-mcp"
anchor = { block = "project", path = ".mcp.json", walk = "up-to-below-root" }
format = { block = "json", dialect = "strict" }
root = ["mcpServers"]
kind = "mcp"
scope = "project"
provenance = "file"
store_class = "plain"
# `${VAR}` and `${VAR:-default}` in `command`, `args`, `env`, `url` and `headers`.
interpolation = { block = "braces", default_separator = ":-" }
on_read_failure = "ignores_file"
shape = { block = "fields", one_of = ["command", "url"], types = { type = "string", command = "string", args = "string-array", env = "string-map", url = "string", headers = "string-map" } }

# A `mcpServers` of `~/.claude.json` that is not an object, here or in a
# Project's state (`local-mcp`), Claude Code skips: `claude mcp list` reports
# it "[Failed to parse]", the file's other servers are read, and the value
# is left as written [test].
[[locations]]
id = "user-mcp"
anchor = { block = "home", root = "state_file" }
format = { block = "json", dialect = "strict" }
root = ["mcpServers"]
kind = "mcp"
scope = "user"
provenance = "file"
store_class = "rewritten-while-running"
# `${VAR}` and `${VAR:-default}` in `command`, `args`, `env`, `url` and `headers`.
interpolation = { block = "braces", default_separator = ":-" }
# Keys of `~/.claude.json` outside any Entry that hold a Secret: an API key
# Claude Code stores when signed in with one, and the key suffixes it
# records as approved or rejected.
secrets.file_fields = [["primaryApiKey"], ["customApiKeyResponses", "*", "*"]]
on_read_failure = "asks_user"
risks = ["agent_may_reset_file"]
shape = { block = "fields", one_of = ["command", "url"], types = { type = "string", command = "string", args = "string-array", env = "string-map", url = "string", headers = "string-map" } }

# A plugin's default `.mcp.json` [docs]. Claude Code loads a plugin whose
# `.mcp.json` does not parse without its servers [test]. It reads a plugin
# of a `directory` marketplace from the folder its entry in the
# marketplace's manifest names, not from the cache [test], and so does
# config-digger (`marketplaces` of the `installed` registry).
[[locations]]
id = "plugin-mcp"
anchor = { block = "plugin", plugins = "installed", path = ".mcp.json" }
# `/mcp` names it `plugin:<plugin>:<server>`, which is what
# `disabledMcpServers` holds [disk].
name_template = "plugin:{plugin}:{name}"
format = { block = "json", dialect = "strict" }
root = ["mcpServers"]
kind = "mcp"
scope = "plugin"
provenance = "plugin"
store_class = "plain"
# Plugins can also use `${CLAUDE_PLUGIN_ROOT}`, `${CLAUDE_PLUGIN_DATA}` and
# `${CLAUDE_PROJECT_DIR}` [docs]. `${user_config.KEY}` is shown as text.
interpolation = { block = "braces", default_separator = ":-" }
# Claude Code puts the plugin's folder, with `/` between its names, in place
# of `${CLAUDE_PLUGIN_ROOT}` in these fields [docs], so two plugins' servers
# written alike have two endpoints.
plugin_root = { reference = "${CLAUDE_PLUGIN_ROOT}", fields = ["command", "args", "env", "url", "headers", "headersHelper"], forward_slashes = true }
on_read_failure = "ignores_file"
shape = { block = "fields", one_of = ["command", "url"], types = { type = "string", command = "string", args = "string-array", env = "string-map", url = "string", headers = "string-map" } }

# The servers a plugin's manifest declares in `mcpServers` [docs, disk]:
# inline, as a path to a file of the plugin shaped like `.mcp.json`, as the
# path or URL of an MCP bundle, `.mcpb` or `.dxt`, or a list of these.
# Claude Code reads them after the plugin's `.mcp.json`, and a server name
# declared later replaces an earlier one [docs], so this location ranks
# above it. It extracts a bundle into the plugin's `.mcpb-cache` folder and
# reads its server config [docs]: the `server.mcp_config` of its
# `manifest.json`, `${__dirname}` standing for the folder [docs, test],
# named by its `name` [test]. It records each bundle it extracts in
# `.mcpb-cache/<hash>.metadata.json`, with the `source` that names it and
# the absolute `extractedPath`, `.mcpb-cache/<content hash>`, it went to
# [test]. A bundle it has not extracted yet, before it first loads the
# plugin, has no Entry. It does not start a bundle's server whose required
# `user_config` is not set [binary], which config-digger does not check. A
# plugin whose `plugin.json` does not parse fails to load, the servers of
# its `.mcp.json` and its skills with it [test], and so does one whose
# `mcpServers` is of a shape the manifest's schema refuses, such as a
# number, `true`, `null` or a list holding a number ("Manifest validation
# failed") [test]: every server and skill of the plugin is Invalid
# (`fails_plugin`).
[[locations]]
id = "plugin-manifest-mcp"
anchor = { block = "plugin", plugins = "installed", path = ".claude-plugin/plugin.json" }
name_template = "plugin:{plugin}:{name}"
references = { root = ["mcpServers"], bundles = { block = "mcpb-cache", extensions = [".mcpb", ".dxt"], cache = ".mcpb-cache" } }
format = { block = "json", dialect = "strict" }
root = ["mcpServers"]
