# Same-named Entries compete whole; the highest location wins. Claude Code
# skips a malformed Entry with a warning [docs], and a Disabled one, before
# they compete, so the next one down can win. A plugin server competes by
# endpoint instead, the same URL, ignoring the host's case, the default port
# and a trailing slash, or the same command, and loses to any other server
# [docs]. Of two plugins' servers with one endpoint, the server of the plugin
# that comes first in `enabledPlugins` wins, the key merged from the user's,
# the Project's and the local settings in that order, each plugin keeping
# its first place [test] (`plugin_order`). A plugin Claude Code does not
# load, its manifest failing, has none of its servers compete [test]; one
# that is off or forced off stays Disabled or Blocked, its manifest a
# secondary reason.
[items.mcp]
unverified = "A plugin that is off, or forced off by the managed settings, and whose manifest fails is taken to be Disabled or Blocked rather than Invalid, since Claude Code does not load an off plugin."
precedence = ["managed-mcp", "managed-settings-mcp", "local-mcp", "project-mcp", "user-mcp", "plugin-manifest-mcp", "plugin-mcp", "synced-plugin-manifest-mcp", "synced-plugin-mcp"]
# An exclusive `managed-mcp.json` suppresses the other servers, and an
# unapproved server is not loaded: neither competes. The allow and deny
# lists apply after precedence, to the server that wins [docs].
checks = ["policy", "shape", "disable", "plugin-load", "approval", "precedence", "rules"]

[items.mcp.competition]
block = "exact-name"
by_endpoint = ["plugin-mcp", "plugin-manifest-mcp", "synced-plugin-manifest-mcp", "synced-plugin-mcp"]

# An installed plugin's servers rank by the plugin's place in
# `enabledPlugins`, read from the user's settings, then the Project's, then
# the local settings. A plugin keeps the place where it first appears: when
# a later file names it again, its value can change but its place does not
# [test]. Outside a Project, only the user's settings count. A plugin
# turned off keeps its place and is Disabled, so the next one wins. Within
# one plugin, the manifest's server still replaces the same-named server
# of its `.mcp.json`.
[items.mcp.competition.plugin_order]
unverified = [
  "The managed settings' `enabledPlugins` are taken not to count toward the order: only the user's, the Project's and the local settings do.",
  "A synced plugin is taken to have no place in `enabledPlugins`: its servers rank after every installed plugin's, as they do by `precedence` (#354).",
  "Between two plugins, the order of `enabledPlugins` is taken to decide whatever file of the plugin a server comes from: the manifest's `mcpServers`, its `.mcp.json` or a bundle.",
]
locations = ["plugin-manifest-mcp", "plugin-mcp"]
sources = [
  { anchor = { block = "home", root = "settings_file" }, key_path = ["enabledPlugins"] },
  { anchor = { block = "project", path = ".claude/settings.json" }, key_path = ["enabledPlugins"] },
  { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["enabledPlugins"] },
]

# Claude Code loads a `.mcp.json` server only once the user approves it,
# which it asks about when it starts in the Project [docs]. Approvals are
# names in `enabledMcpjsonServers`, or `enableAllProjectMcpServers: true`,
# in any settings file [docs, disk], and in the Project's state in
# `~/.claude.json`, `enableAllProjectMcpServers` included [docs, test].
# `disabledMcpjsonServers` wins over an approval [docs], so it is checked
# first. The approvals of the Project's state, its settings and its local
# settings count only while the Project's state holds
# `hasTrustDialogAccepted: true` (`trusted_only`, `trust`); the user's
# count in any Project [test]. Claude Code reads the Project's state only
# under its path with forward slashes: under one with backslashes,
# neither the trust nor the approvals count [test] (`forward_slashes`).
# config-digger never trusts a Project. Since 2.1.299 a list written as
# one plain-string name, of letters, digits, `-` or `_`, no longer voids
# its settings file [docs]: in a settings file it approves that one
# server, and in the Project's state none [test], so only the settings
# files' sources read it (`plain_string_name`).
[[items.mcp.gates]]
unverified = [
  "The Project's state is taken to be looked up under its path with forward slashes without regard to case, as changelog 2.1.285 suggests for trust.",
  "The managed settings' approvals are taken to count in any Project, trusted or not, as the user's do.",
]
block = "approval-list"
locations = ["project-mcp"]
prompt = "on-start"
trust = { anchor = { block = "home", root = "state_file" }, key_path = ["projects", "{project}", "hasTrustDialogAccepted"], forward_slashes = true }
sources = [
  { anchor = { block = "settings", settings = "managed" }, key_path = ["enabledMcpjsonServers"], plain_string_name = true },
  { anchor = { block = "settings", settings = "managed" }, key_path = ["enableAllProjectMcpServers"] },
  { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["enabledMcpjsonServers"], plain_string_name = true, trusted_only = true },
  { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["enableAllProjectMcpServers"], trusted_only = true },
  { anchor = { block = "project", path = ".claude/settings.json" }, key_path = ["enabledMcpjsonServers"], plain_string_name = true, trusted_only = true },
  { anchor = { block = "project", path = ".claude/settings.json" }, key_path = ["enableAllProjectMcpServers"], trusted_only = true },
  { anchor = { block = "home", root = "settings_file" }, key_path = ["enabledMcpjsonServers"], plain_string_name = true },
  { anchor = { block = "home", root = "settings_file" }, key_path = ["enableAllProjectMcpServers"] },
  { anchor = { block = "home", root = "state_file" }, key_path = ["projects", "{project}", "enabledMcpjsonServers"], trusted_only = true, forward_slashes = true },
  { anchor = { block = "home", root = "state_file" }, key_path = ["projects", "{project}", "enableAllProjectMcpServers"], trusted_only = true, forward_slashes = true },
]

# `deniedMcpServers` keeps out every server one of its items names, by
# `serverName`, by `serverCommand` (the command and its args) or by
# `serverUrl` (`*` for any text). It is merged from every settings file and
# always wins [docs]. In the managed settings it is policy.
[[items.mcp.rules]]
block = "allow-deny-list"
list = "deny"
match = { name = "serverName", command = "serverCommand", url = "serverUrl" }
sources = [
  { anchor = { block = "settings", settings = "managed" }, key_path = ["deniedMcpServers"], policy = true },
  { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["deniedMcpServers"] },
  { anchor = { block = "project", path = ".claude/settings.json" }, key_path = ["deniedMcpServers"] },
  { anchor = { block = "home", root = "settings_file" }, key_path = ["deniedMcpServers"] },
]

# `allowedMcpServers`, once any settings file holds it, keeps out every
# server none of its items names, merged from every settings file [docs]:
# an empty list keeps out all of them. While it names a server by command,
# a server with a command passes only by its command, and likewise by URL
# [docs]. `allowManagedMcpServersOnly: true` in the managed settings leaves
# only the managed lists [docs]. Merging managed sources takes the managed
# list whole from the highest source that holds one [docs].
[[items.mcp.rules]]
block = "allow-deny-list"
list = "allow"
strict = true
match = { name = "serverName", command = "serverCommand", url = "serverUrl" }
policy_only = { anchor = { block = "settings", settings = "managed" }, key_path = ["allowManagedMcpServersOnly"], policy = true }
sources = [
  { anchor = { block = "settings", settings = "managed" }, key_path = ["allowedMcpServers"], policy = true, highest_source = true },
  { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["allowedMcpServers"] },
  { anchor = { block = "project", path = ".claude/settings.json" }, key_path = ["allowedMcpServers"] },
  { anchor = { block = "home", root = "settings_file" }, key_path = ["allowedMcpServers"] },
]

# While `managed-mcp.json` exists, even empty, Claude Code loads only its
# servers and those of the managed settings [docs].
[[items.mcp.gates]]
block = "managed-exclusive"
location = "managed-mcp"
except = ["managed-settings-mcp"]

# The `/mcp` toggle: names in `projects["<path>"].disabledMcpServers`, which
# Claude Code skips in that Project whatever file declares them. It is
# written under the Project key in the spelling Claude Code recorded; until
