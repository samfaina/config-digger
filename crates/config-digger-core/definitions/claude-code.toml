# plugin whose manifest does not parse, or whose `mcpServers` is `42` or
# `[42]`, fails whole, as an installed plugin does: the servers of its
# manifest and its `.mcp.json` and its skills with it, and `claude plugin
# list` reports a corrupt or an invalid manifest [test] (`fails_plugin`).
[[locations]]
id = "synced-plugin-manifest-mcp"
anchor = { block = "plugin", plugins = "synced", path = ".claude-plugin/plugin.json" }
when = [{ block = "feature-gate", gate = "tengu_claudeai_plugins_sync_enabled" }, { block = "signed-in-account" }]
name_template = "plugin:{plugin}:{name}"
references = { root = ["mcpServers"], bundles = { block = "mcpb-cache", extensions = [".mcpb", ".dxt"], cache = ".mcpb-cache" } }
format = { block = "json", dialect = "strict" }
root = ["mcpServers"]
kind = "mcp"
scope = "user"
provenance = "cloud-mirror"
store_class = "plain"
interpolation = { block = "braces", default_separator = ":-" }
plugin_root = { reference = "${CLAUDE_PLUGIN_ROOT}", fields = ["command", "args", "env", "url", "headers", "headersHelper"], forward_slashes = true }
on_read_failure = "fails_plugin"
on_shape_failure = "fails_plugin"
shape = { block = "fields", one_of = ["command", "url"], types = { type = "string", command = "string", args = "string-array", env = "string-map", url = "string", headers = "string-map" } }

[[locations]]
id = "synced-plugin-mcp"
anchor = { block = "plugin", plugins = "synced", path = ".mcp.json" }
when = [{ block = "feature-gate", gate = "tengu_claudeai_plugins_sync_enabled" }, { block = "signed-in-account" }]
name_template = "plugin:{plugin}:{name}"
format = { block = "json", dialect = "strict" }
root = ["mcpServers"]
kind = "mcp"
scope = "user"
provenance = "cloud-mirror"
store_class = "plain"
interpolation = { block = "braces", default_separator = ":-" }
plugin_root = { reference = "${CLAUDE_PLUGIN_ROOT}", fields = ["command", "args", "env", "url", "headers", "headersHelper"], forward_slashes = true }
on_read_failure = "ignores_file"
shape = { block = "fields", one_of = ["command", "url"], types = { type = "string", command = "string", args = "string-array", env = "string-map", url = "string", headers = "string-map" } }

# Same-named Entries compete whole; the highest location wins. Claude Code
# skips a malformed Entry with a warning [docs], and a Disabled one, before
# they compete, so the next one down can win. A plugin server competes by
# endpoint instead, the same URL, ignoring the host's case, the default port
# and a trailing slash, or the same command, and loses to any other server
# [docs]. Of two plugins' servers with one endpoint, the server of the plugin
# that comes first in `enabledPlugins` wins, the key merged from the user's,
# the Project's and the local settings in that order, each plugin keeping
# its first place [test] (`plugin_order`). A plugin Claude Code does not
# load, its manifest failing, has none of its servers compete [test]; one
# that is off, by `false` in `enabledPlugins` or by default, or forced off
# by the managed settings' `enabledPlugins`, stays Disabled or Blocked, its
# manifest a secondary reason: Claude Code does not report the manifest of
# a plugin it does not load, `claude plugin list` giving no error, and
# `disabled` for an off plugin, `enabled` for a forced-off one [test].
[items.mcp]
precedence = ["managed-mcp", "managed-settings-mcp", "local-mcp", "project-mcp", "user-mcp", "plugin-manifest-mcp", "plugin-mcp", "synced-plugin-manifest-mcp", "synced-plugin-mcp"]
# An exclusive `managed-mcp.json` suppresses the other servers, and an
# unapproved server is not loaded: neither competes. The allow and deny
# lists apply after precedence, to the server that wins [docs].
checks = ["policy", "shape", "disable", "plugin-load", "approval", "precedence", "rules"]

[items.mcp.competition]
block = "exact-name"
by_endpoint = ["plugin-mcp", "plugin-manifest-mcp", "synced-plugin-manifest-mcp", "synced-plugin-mcp"]

# An installed plugin's servers rank by the plugin's place in
# `enabledPlugins`, read from the user's settings, then the Project's, then
# the local settings. A plugin keeps the place where it first appears: when
# a later file names it again, its value can change but its place does not
# [test]. Outside a Project, only the user's settings count. A plugin
# turned off keeps its place and is Disabled, so the next one wins. Within
# one plugin, the manifest's server still replaces the same-named server
# of its `.mcp.json`.
[items.mcp.competition.plugin_order]
unverified = [
  "The managed settings' `enabledPlugins` are taken not to count toward the order: only the user's, the Project's and the local settings do.",
  "A synced plugin is taken to have no place in `enabledPlugins`: the servers of one no installed plugin keeps out rank after every installed plugin's, as they do by `precedence`.",
  "Between two plugins, the order of `enabledPlugins` is taken to decide whatever file of the plugin a server comes from: the manifest's `mcpServers`, its `.mcp.json` or a bundle.",
]
locations = ["plugin-manifest-mcp", "plugin-mcp"]
sources = [
  { anchor = { block = "home", root = "settings_file" }, key_path = ["enabledPlugins"] },
  { anchor = { block = "project", path = ".claude/settings.json" }, key_path = ["enabledPlugins"] },
  { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["enabledPlugins"] },
]

# Claude Code loads a `.mcp.json` server only once the user approves it,
# which it asks about when it starts in the Project [docs]. Approvals are
# names in `enabledMcpjsonServers`, or `enableAllProjectMcpServers: true`,
# in any settings file [docs, disk], and in the Project's state in
# `~/.claude.json`, `enableAllProjectMcpServers` included [docs, test].
# `disabledMcpjsonServers` wins over an approval [docs], so it is checked
# first. The approvals of the Project's state, its settings and its local
# settings count only while the Project's state holds
# `hasTrustDialogAccepted: true` (`trusted_only`, `trust`); the user's
# count in any Project [test], and the managed settings' do with no state
# or a state without the trust [test]. Claude Code reads the Project's
# state only under the path of the folder it starts in, with forward
# slashes (`forward_slashes`), in that folder's case: under one with
# backslashes, or in another case, neither the trust nor the approvals
# count, nor do the Project's settings approve [test]. config-digger
# still matches the key without regard to case, since which case Claude
# Code starts in is not on disk (#503). config-digger never trusts a
# Project. Since 2.1.299 a list written as one plain-string name, of
# letters, digits, `-` or `_`, no longer voids its settings file [docs]:
# in a settings file it approves that one server, and in the Project's
# state none [test], so only the settings files' sources read it
# (`plain_string_name`).
[[items.mcp.gates]]
block = "approval-list"
locations = ["project-mcp"]
prompt = "on-start"
trust = { anchor = { block = "home", root = "state_file" }, key_path = ["projects", "{project}", "hasTrustDialogAccepted"], forward_slashes = true }
sources = [
  { anchor = { block = "settings", settings = "managed" }, key_path = ["enabledMcpjsonServers"], plain_string_name = true },
  { anchor = { block = "settings", settings = "managed" }, key_path = ["enableAllProjectMcpServers"] },
  { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["enabledMcpjsonServers"], plain_string_name = true, trusted_only = true },
  { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["enableAllProjectMcpServers"], trusted_only = true },
  { anchor = { block = "project", path = ".claude/settings.json" }, key_path = ["enabledMcpjsonServers"], plain_string_name = true, trusted_only = true },
  { anchor = { block = "project", path = ".claude/settings.json" }, key_path = ["enableAllProjectMcpServers"], trusted_only = true },
  { anchor = { block = "home", root = "settings_file" }, key_path = ["enabledMcpjsonServers"], plain_string_name = true },
  { anchor = { block = "home", root = "settings_file" }, key_path = ["enableAllProjectMcpServers"] },
  { anchor = { block = "home", root = "state_file" }, key_path = ["projects", "{project}", "enabledMcpjsonServers"], trusted_only = true, forward_slashes = true },
  { anchor = { block = "home", root = "state_file" }, key_path = ["projects", "{project}", "enableAllProjectMcpServers"], trusted_only = true, forward_slashes = true },
]

# `deniedMcpServers` keeps out every server one of its items names, by
# `serverName`, by `serverCommand` (the command and its args) or by
# `serverUrl` (`*` for any text). It is merged from every settings file and
# always wins [docs]. In the managed settings it is policy.
[[items.mcp.rules]]
block = "allow-deny-list"
list = "deny"
match = { name = "serverName", command = "serverCommand", url = "serverUrl" }
sources = [
  { anchor = { block = "settings", settings = "managed" }, key_path = ["deniedMcpServers"], policy = true },
  { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["deniedMcpServers"] },
  { anchor = { block = "project", path = ".claude/settings.json" }, key_path = ["deniedMcpServers"] },
  { anchor = { block = "home", root = "settings_file" }, key_path = ["deniedMcpServers"] },
]

# `allowedMcpServers`, once any settings file holds it, keeps out every
# server none of its items names, merged from every settings file [docs]:
# an empty list keeps out all of them. While it names a server by command,
# a server with a command passes only by its command, and likewise by URL
# [docs]. `allowManagedMcpServersOnly: true` in the managed settings leaves
# only the managed lists [docs]. Merging managed sources takes the managed
# list whole from the highest source that holds one [docs].
[[items.mcp.rules]]
block = "allow-deny-list"
list = "allow"
strict = true
match = { name = "serverName", command = "serverCommand", url = "serverUrl" }
policy_only = { anchor = { block = "settings", settings = "managed" }, key_path = ["allowManagedMcpServersOnly"], policy = true }
sources = [
  { anchor = { block = "settings", settings = "managed" }, key_path = ["allowedMcpServers"], policy = true, highest_source = true },
  { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["allowedMcpServers"] },
  { anchor = { block = "project", path = ".claude/settings.json" }, key_path = ["allowedMcpServers"] },
  { anchor = { block = "home", root = "settings_file" }, key_path = ["allowedMcpServers"] },
]

# While `managed-mcp.json` exists, even empty, Claude Code loads only its
# servers and those of the managed settings [docs].
[[items.mcp.gates]]
block = "managed-exclusive"
location = "managed-mcp"
except = ["managed-settings-mcp"]

# The `/mcp` toggle: names in `projects["<path>"].disabledMcpServers`, which
# Claude Code skips in that Project whatever file declares them. It is
# written under the Project key in the spelling Claude Code recorded; until
# it has recorded the Project, this switch is skipped rather than written
# under a spelling Claude Code might not look up.
[[items.mcp.disable]]
block = "json-name-list"
switch = { anchor = { block = "home", root = "state_file" }, key_path = ["projects", "{project}", "disabledMcpServers"], store_class = "rewritten-while-running" }
target = "name"
context = "project"
enable_action = "remove-item"
reason = "disabled_by_name"

# `disabledMcpjsonServers` in any settings file skips `.mcp.json` servers by
# name [docs], in a Project trusted or not [test]. Written as one
# plain-string name, it skips that server [test] (`plain_string_name`):
# Disable then writes a list of the old name and the new one, and Enable of
# the old name deletes the key. The local settings file is the one meant to
# stay out of git.
[[items.mcp.disable]]
block = "json-name-list"
switch = { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["disabledMcpjsonServers"], store_class = "plain" }
target = "name"
context = "project"
enable_action = "remove-item"
reason = "disabled_by_name"
locations = ["project-mcp"]
plain_string_name = true

# The `.mcp.json` approval dialog keeps the servers it rejects per Project
# in `~/.claude.json`. Enable lifts it there too. Claude Code writes a list
# there itself, and a plain string there is untested, so it names nothing.
[[items.mcp.disable]]
block = "json-name-list"
switch = { anchor = { block = "home", root = "state_file" }, key_path = ["projects", "{project}", "disabledMcpjsonServers"], store_class = "rewritten-while-running" }
target = "name"
context = "project"
enable_action = "remove-item"
reason = "disabled_by_name"
locations = ["project-mcp"]

# The shared Project settings and the user settings can hold the list too.
# config-digger only reads them: the first belongs to the team, and the
# second applies in every Project.
[[items.mcp.disable]]
block = "json-name-list"
switch = { anchor = { block = "project", path = ".claude/settings.json" }, key_path = ["disabledMcpjsonServers"], store_class = "plain" }
target = "name"
context = "project"
enable_action = "remove-item"
reason = "disabled_by_name"
locations = ["project-mcp"]
plain_string_name = true
enable_offered = false

[[items.mcp.disable]]
block = "json-name-list"
switch = { anchor = { block = "home", root = "settings_file" }, key_path = ["disabledMcpjsonServers"], store_class = "plain" }
target = "name"
context = "all"
enable_action = "remove-item"
reason = "disabled_by_name"
locations = ["project-mcp"]
plain_string_name = true
enable_offered = false

# A plugin is on or off as a whole, with every server and skill it carries,
# by `enabledPlugins["<name>@<marketplace>"]` in a settings file, which
# `claude plugin disable --scope local|project|user` writes [docs, disk].
# Settings merge the key across files, managed over local over Project over
# user [docs]: the first of these switches that holds the plugin decides.
# The managed settings force a plugin on or off [docs]: what they turn off
# is Blocked, and config-digger only reads them. Disable writes `false` to
# the local settings in a Project, and to the user settings otherwise;
# Enable sets `true`. The shared Project settings belong to the team, so
# config-digger only reads them. A plugin no settings file names is off
# [test]. These switches are repeated for skills below.
[[items.mcp.disable]]
block = "json-field"
switch = { anchor = { block = "settings", settings = "managed" }, key_path = ["enabledPlugins", "{plugin_id}"], store_class = "plain" }
target = "plugin"
context = "all"
enable_action = "set"
enabled_value = true
disabled_value = false
reason = "plugin_disabled"
layered = true
policy = true
locations = ["plugin-mcp", "plugin-manifest-mcp", "synced-plugin-manifest-mcp", "synced-plugin-mcp"]
enable_offered = false

[[items.mcp.disable]]
block = "json-field"
switch = { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["enabledPlugins", "{plugin_id}"], store_class = "plain" }
target = "plugin"
context = "project"
enable_action = "set"
enabled_value = true
disabled_value = false
reason = "plugin_disabled"
layered = true
locations = ["plugin-mcp", "plugin-manifest-mcp", "synced-plugin-manifest-mcp", "synced-plugin-mcp"]

[[items.mcp.disable]]
block = "json-field"
switch = { anchor = { block = "project", path = ".claude/settings.json" }, key_path = ["enabledPlugins", "{plugin_id}"], store_class = "plain" }
target = "plugin"
context = "project"
enable_action = "set"
enabled_value = true
disabled_value = false
reason = "plugin_disabled"
layered = true
locations = ["plugin-mcp", "plugin-manifest-mcp", "synced-plugin-manifest-mcp", "synced-plugin-mcp"]
enable_offered = false

[[items.mcp.disable]]
block = "json-field"
switch = { anchor = { block = "home", root = "settings_file" }, key_path = ["enabledPlugins", "{plugin_id}"], store_class = "plain" }
target = "plugin"
context = "all"
enable_action = "set"
enabled_value = true
disabled_value = false
default_value = false
reason = "plugin_disabled"
layered = true
locations = ["plugin-mcp", "plugin-manifest-mcp"]

# A synced plugin takes the same switches, under `<name>@synced` [docs],
# but one no settings file names is on [disk], so its user switch has no
# default. config-digger only reads them for a synced plugin, which is
# read-only.
[[items.mcp.disable]]
unverified = "`enabledPlugins[\"<name>@synced\"]: false` is taken to turn a synced plugin off, merged across settings files as an installed plugin's key is, as the docs say."
block = "json-field"
switch = { anchor = { block = "home", root = "settings_file" }, key_path = ["enabledPlugins", "{plugin_id}"], store_class = "plain" }
target = "plugin"
context = "all"
enable_action = "set"
enabled_value = true
disabled_value = false
reason = "plugin_disabled"
layered = true
locations = ["synced-plugin-manifest-mcp", "synced-plugin-mcp"]
enable_offered = false

# `syncClaudeAiPlugins: false` turns off every synced plugin [docs], ranked
# as `syncClaudeAiSkills` is below. These switches are repeated for skills.
[[items.mcp.rules]]
unverified = "`syncClaudeAiPlugins: false` is taken to turn every synced plugin off, the highest settings file that holds it deciding, as the docs say."
block = "global-switch"
off = false
locations = ["synced-plugin-manifest-mcp", "synced-plugin-mcp"]
sources = [
  { anchor = { block = "settings", settings = "managed" }, key_path = ["syncClaudeAiPlugins"], policy = true },
  { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["syncClaudeAiPlugins"] },
  { anchor = { block = "project", path = ".claude/settings.json" }, key_path = ["syncClaudeAiPlugins"] },
  { anchor = { block = "home", root = "settings_file" }, key_path = ["syncClaudeAiPlugins"] },
]

# Skills are folders holding a `SKILL.md`, read one level down only [docs].
# A skill is named by its folder, as written, and competes by it; its
# frontmatter `name`, when the name rule lets it, is an alias the skill
# also runs by, and `skillOverrides` names the folder [test], against the
# docs. Claude Code reads the frontmatter only when `---` is the first line,
# and loads a skill whose YAML does not parse with no fields set [docs]. It
# never loads a skill from a folder named `synced` or `anthropic-skills`, in
# any capitalisation, outside claude.ai sync [docs].

# Enterprise skills, in the managed settings directory [docs].
[[locations]]
id = "managed-skills"
anchor = { block = "machine", path = "%ProgramFiles%/ClaudeCode/.claude/skills" }
format = { block = "skill-folder", name_from = "folder", reserved = ["synced", "anthropic-skills"], no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name", name_rule = "visible-chars" }
name_rule_when = { gate = "tengu_slate_wicket" }
kind = "skill"
scope = "managed"
provenance = "managed"
store_class = "plain"
on_read_failure = "ignores_file"

[[locations]]
id = "user-skills"
anchor = { block = "home", root = "skills" }
format = { block = "skill-folder", name_from = "folder", reserved = ["synced", "anthropic-skills"], no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name", name_rule = "visible-chars" }
name_rule_when = { gate = "tengu_slate_wicket" }
kind = "skill"
scope = "user"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

# `.claude/skills` in the Project folder and in every parent up to the repo
# root [docs]. Outside a repo only the Project folder is read. Of two
# same-named skills in that walk, the nearest folder's wins [test].
# In a linked worktree, made with `--worktree` or `git worktree add`, the
# walk stops at the worktree root, inside the main checkout or outside it
# [docs, test]. When the worktree root has no `.claude/skills`, the main
# checkout root's `.claude/skills` is read too, below every folder of the
# walk [docs, test]: its skills add to those of a folder between the
# Project and the worktree root, and lose a shared name to them [test]. An
# empty `.claude/skills` at the worktree root keeps them out, and a `.claude`
# without `skills` does not; the main checkout's other `.claude/skills`
# folders are never read [test]. They are the worktree's Project skills, at
# their path in the main checkout. Claude Code does this from 2.1.277
# [docs], before the tested range. A `.claude/skills` file at the worktree
# root keeps them out too, and a junction there to a missing folder does
# not [test]. For a worktree of a bare repo, a `--separate-git-dir`
# checkout or a submodule, whose `.git` file names a `worktrees` folder in
# a folder not named `.git`, Claude Code reads that folder's
# `.claude/skills` instead, not the checkout's [test].
[[locations]]
id = "project-skills"
anchor = { block = "project", path = ".claude/skills", walk = "up-to-repo-root", linked_worktree = "main-checkout-fallback" }
format = { block = "skill-folder", name_from = "folder", reserved = ["synced", "anthropic-skills"], no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name", name_rule = "visible-chars" }
name_rule_when = { gate = "tengu_slate_wicket" }
kind = "skill"
scope = "project"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

# Nested skills: the `.claude/skills` of every folder below the Project
# folder, at any depth, the Project folder's own left to `project-skills`
# [docs, code]. Claude Code loads none at start. From the folder of each
# file it reads or edits, it walks up while the folder is below the one it
# started in, and loads the skills of each `.claude/skills` on the way the
# first time, keeping them for the session [test]; `/add-dir` on such a
# folder loads them sooner [docs]. A folder no such file is under is never
# read [test]. Each skill is Effective, with a note naming its folder.
# Claude Code skips a skills folder whose holding folder git ignores, as
# `git check-ignore` says [test]: a `.gitignore` leaving out a folder on the
# way skips the skills below it, and one leaving out the `.claude` folder
# alone skips none [test]. config-digger reads only the `.gitignore` files,
# not `.git\info\exclude` nor git's global excludes, and those above the
# repo root too, which git does not read. Outside a git repo, where the
# check fails, Claude Code loads nested skills too [test]; config-digger
# reads them only in a git work tree, so as not to walk every folder below
# a Project that is a home folder or a drive. Claude Code also skips its own claude.ai sync folders, and on Windows a
# path holding an 8.3 short name (`~1`), which a walk never meets [code]. It
# runs no discovery at all while the `projectSettings` source is off or a
# policy allows only plugin customization ("Dynamic skill discovery
# skipped") [code], which config-digger does not read yet. It loads these
# skills as Project skills, as `project-skills` reads them [code].
[[locations]]
id = "nested-skills"
unverified = [
  "The reserved folder names, the name rule and the frontmatter handling of `project-skills` are taken to apply to a nested skill, as the binary loads it as a Project skill.",
  "A nested skills folder reached through a link or a junction is taken to load as any other, as the binary walks up the path of the file as Claude Code reads it.",
]
anchor = { block = "project", path = ".claude/skills", walk = { down = { needs_git = true, skip = [], ignore_files = [".gitignore"], ignores_path = false, follow_links = true } } }
format = { block = "skill-folder", name_from = "folder", reserved = ["synced", "anthropic-skills"], no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name", name_rule = "visible-chars" }
name_rule_when = { gate = "tengu_slate_wicket" }
loaded_on_file_under_folder = true
kind = "skill"
scope = "project"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

# A plugin's skills, in its `skills` folder [docs, disk], and in each folder
# its manifest's `skills` declares besides it, a path or a list of paths:
# each a folder of skill folders, or one skill's folder, `.` the plugin's
# own [docs]. They answer to `<plugin>:<folder>`, and to `<plugin>:<name>`
# as an alias [test], so they never compete with other skills [docs]. A
# declared folder that holds a `SKILL.md` is one skill, named
# `<plugin>:<name>` by its frontmatter, or else by its folder [test], and
# Claude Code loads a `SKILL.md` it reaches twice once [binary]. A
# `SKILL.md` at the plugin's root, with no `skills` folder or field, is not
# read.
# No name rule skips a plugin's skill folder or refuses a declared skill's
# `name` [test]. Claude Code writes `-` for each UTF-16 unit of the name
# other than `A`-`Z`, `a`-`z`, `0`-`9`, `_` and `-`, a declared skill's
# `name` trimmed and rid of a leading `<plugin>:` first, and holds the
# whole `<plugin>:<name>` to the folder name rule, so that only one over
# 256 characters is skipped [test]. In a folder of skill folders, a
# frontmatter `name` the rule refuses is no alias [test].
