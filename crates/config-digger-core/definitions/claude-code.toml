# Skills are folders holding a `SKILL.md`, read one level down only [docs].
# A skill is named by its folder, as written, and competes by it; its
# frontmatter `name`, when the name rule lets it, is an alias the skill
# also runs by, and `skillOverrides` names the folder [test], against the
# docs. Claude Code reads the frontmatter only when `---` is the first line,
# and loads a skill whose YAML does not parse with no fields set [docs]. It
# never loads a skill from a folder named `synced` or `anthropic-skills`, in
# any capitalisation, outside claude.ai sync [docs].

# Enterprise skills, in the managed settings directory [docs].
[[locations]]
id = "managed-skills"
anchor = { block = "machine", path = "%ProgramFiles%/ClaudeCode/.claude/skills" }
format = { block = "skill-folder", name_from = "folder", reserved = ["synced", "anthropic-skills"], no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name", name_rule = "visible-chars" }
name_rule_when = { gate = "tengu_slate_wicket" }
kind = "skill"
scope = "managed"
provenance = "managed"
store_class = "plain"
on_read_failure = "ignores_file"

[[locations]]
id = "user-skills"
anchor = { block = "home", root = "skills" }
format = { block = "skill-folder", name_from = "folder", reserved = ["synced", "anthropic-skills"], no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name", name_rule = "visible-chars" }
name_rule_when = { gate = "tengu_slate_wicket" }
kind = "skill"
scope = "user"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

# `.claude/skills` in the Project folder and in every parent up to the repo
# root [docs]. Outside a repo only the Project folder is read. Of two
# same-named skills in that walk, the nearest folder's wins [test].
[[locations]]
id = "project-skills"
anchor = { block = "project", path = ".claude/skills", walk = "up-to-repo-root" }
format = { block = "skill-folder", name_from = "folder", reserved = ["synced", "anthropic-skills"], no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name", name_rule = "visible-chars" }
name_rule_when = { gate = "tengu_slate_wicket" }
kind = "skill"
scope = "project"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

# A plugin's skills, in its `skills` folder [docs, disk], and in each folder
# its manifest's `skills` declares besides it, a path or a list of paths:
# each a folder of skill folders, or one skill's folder, `.` the plugin's
# own [docs]. They answer to `<plugin>:<folder>`, and to `<plugin>:<name>`
# as an alias [test], so they never compete with other skills [docs]. A
# declared folder that holds a `SKILL.md` is one skill, named
# `<plugin>:<name>` by its frontmatter, or else by its folder [test], and
# Claude Code loads a `SKILL.md` it reaches twice once [binary]. A
# `SKILL.md` at the plugin's root, with no `skills` folder or field, is not
# read.
# No name rule skips a plugin's skill folder or refuses a declared skill's
# `name` [test]. Claude Code writes `-` for each UTF-16 unit of the name
# other than `A`-`Z`, `a`-`z`, `0`-`9`, `_` and `-`, a declared skill's
# `name` trimmed and rid of a leading `<plugin>:` first, and holds the
# whole `<plugin>:<name>` to the folder name rule, so that only one over
# 256 characters is skipped [test]. config-digger applies the rule of local
# skills instead (#429). In a folder of skill folders, a frontmatter `name`
# the rule refuses is no alias [test].
[[locations]]
id = "plugin-skills"
anchor = { block = "plugin", plugins = "installed", path = ".claude-plugin/plugin.json" }
format = { block = "manifest-skills", field = ["skills"], default = "skills", adds_to_default = true, path_may_name_one = true, skills = { name_from = "folder", no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name", name_rule = "visible-chars" }, one_skill = { name_from = "frontmatter", no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name", name_rule = "visible-chars" } }
name_rule_when = { gate = "tengu_slate_wicket" }
name_template = "{plugin}:{name}"
kind = "skill"
scope = "plugin"
provenance = "plugin"
store_class = "plain"
on_read_failure = "fails_plugin"

# A synced plugin's skills, read as an installed plugin's are, at user
# Scope.
[[locations]]
id = "synced-plugin-skills"
unverified = [
  "A synced plugin's skills are taken to be named as an installed plugin's are (#429).",
  "A synced plugin's skills are taken to fail with the plugin when its manifest does not parse, or its `mcpServers` has a shape the manifest's schema refuses, as an installed plugin's do.",
]
anchor = { block = "plugin", plugins = "synced", path = ".claude-plugin/plugin.json" }
when = [{ block = "signed-in-account" }]
format = { block = "manifest-skills", field = ["skills"], default = "skills", adds_to_default = true, path_may_name_one = true, skills = { name_from = "folder", no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name", name_rule = "visible-chars" }, one_skill = { name_from = "frontmatter", no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name", name_rule = "visible-chars" } }
name_rule_when = { gate = "tengu_slate_wicket" }
name_template = "{plugin}:{name}"
kind = "skill"
scope = "user"
provenance = "cloud-mirror"
store_class = "plain"
on_read_failure = "fails_plugin"

# Skills synced from claude.ai sit one level deeper than the docs say, in
# `synced/<org>_<account>/<folder>` [disk], next to `manifest.json` and a
# `.staging` folder. Claude Code owns this copy: it downloads the account's
# skills there while its claude.ai sync gate is on, and reads the folder
# whatever the gate, a skill `manifest.json` does not list included [test].
# While the folder holds `.last-complete-round`, it does not download again
# a skill deleted by hand [test]. It reads no skill directly under
# `synced/` or deeper than a skill folder, and a sync round that downloads
# deletes what sits directly under `synced/` [test]. A synced skill is named
# `anthropic-skills:<folder>`, its frontmatter `name` an alias with the same
# prefix [test]. It reads only the Signed-in account's folder, leaving
# another `<org>_<account>` unread [test], and none while signed in to no
# account or off it, as `[account]` says. Tested with a Max account.
[[locations]]
id = "synced-skills"
unverified = "The name rule is taken to apply to a synced skill's folder name as it does to a local skill's."
anchor = { block = "home", root = "skills", path = "synced" }
when = [{ block = "signed-in-account" }]
format = { block = "skill-folder", depth = 2, name_from = "folder", no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name", name_rule = "visible-chars" }
name_rule_when = { gate = "tengu_slate_wicket" }
name_template = "anthropic-skills:{name}"
kind = "skill"
scope = "user"
provenance = "cloud-mirror"
store_class = "plain"
on_read_failure = "ignores_file"

# Enterprise beats personal, and personal beats project [docs]. A synced
# skill never competes with them: Claude Code lists both, and only the bare
# `/<folder>` goes to the local skill, a synced skill answering to it while
# no local skill takes it [test]. Claude Code skips a skill it cannot
# load before they compete. Names are used as written, capitals and `_`
# included [test]. Since 2.1.299 a name rule applies, behind the gate
# `tengu_slate_wicket`, on by default [docs, binary]: `visible-chars`, on
# every skill location. It skips a skill whose folder name starts or ends
# with a space, or holds a hidden, direction-changing or blank-like
# character, but takes a space inside it, `.`, capitals and letters outside
# ASCII [test]. It refuses a frontmatter `name` as an alias when it holds
# any blank, `/`, `<` or `>`, a hidden or direction-changing character, or
# is over 256 characters, and takes 256 characters, capitals, `_`, `.`, `:`
# anywhere and letters outside ASCII [test]: a location that names a skill
# by its frontmatter then names it by its folder. The full classes are the
# 2.1.302 binary's: a folder name may not hold a control character, a
# format, private-use, unassigned or default-ignorable character, U+2800, a
# space separator other than the space, U+FFFC, two spaces in a row, a mark
# no letter carries, `<` or `>`, nor have a space at either end or next to a
# `:` or a `:` at either end; a frontmatter `name` holds letters, marks,
# digits, `_`, `:`, `.` and `-` alone, and none of those; both count at most
# 256 UTF-16 code units, as JavaScript's `length` does [binary]. The marks
# say which of these were tested. A plugin's skills fail with it [test],
# after its switches, as its servers do.
[items.skill]
unverified = [
  "A plugin that is off, or forced off by the managed settings, and whose manifest fails is taken to have its skills Disabled or Blocked rather than Invalid, since Claude Code does not load an off plugin.",
  "Every character the name rule refuses is taken from the 2.1.302 binary, with config-digger's Unicode tables, but for those the probe tested: a space at either end, U+200B, U+202E, U+00A0 and U+3000 in a folder name, and a space, a tab, `/`, `<`, `>`, U+200B, U+202E and U+00A0 in a frontmatter `name`, and the length of an ASCII `name`. Among the rest, a frontmatter `name` holding any character but letters, marks, digits, `_`, `:`, `.` and `-`, such as `+` or `@`, is taken to be refused.",
  "`<` and `>` in a folder name, which a Windows folder name cannot hold, are taken to break the name rule, as the binary says.",
  "Claude Code keeps a joiner or a variation selector inside an emoji sequence on Unicode's recommended list; config-digger takes any well-formed emoji sequence for one.",
]
precedence = ["managed-skills", "user-skills", "project-skills", "plugin-skills", "synced-plugin-skills", "synced-skills"]
competition = { block = "exact-name" }
checks = ["frontmatter", "disable", "plugin-load", "precedence", "rules"]

# `syncClaudeAiSkills: false` stops the claude.ai skill sync [docs]: Claude
# Code then reads no synced skill, and deletes those it downloaded, in the
# user's settings [test]. Settings files rank managed, local, Project, user
# [docs]: the highest that holds it decides.
[[items.skill.rules]]
block = "global-switch"
off = false
locations = ["synced-skills"]
sources = [
  { anchor = { block = "settings", settings = "managed" }, key_path = ["syncClaudeAiSkills"], policy = true },
  { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["syncClaudeAiSkills"] },
  { anchor = { block = "project", path = ".claude/settings.json" }, key_path = ["syncClaudeAiSkills"] },
  { anchor = { block = "home", root = "settings_file" }, key_path = ["syncClaudeAiSkills"] },
]

# The `/skills` menu: `skillOverrides: {"<name>": "off"}` in the Project's
# local settings [docs]. `"name-only"` lists only the name to Claude and
# `"user-invocable-only"` lists nothing, both keeping the skill in the `/`
# menu: partial switches. `"on"` is the default. It does not apply to plugin
# skills [docs]. It turns a synced skill off by `anthropic-skills:<folder>`,
# or by `<folder>` alone, which a local skill of that folder answers to too
# [test]; config-digger reads the first only (#309).
[[items.skill.disable]]
block = "json-field"
switch = { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["skillOverrides", "{name}"], store_class = "plain" }
target = "name"
context = "project"
enable_action = "delete-key"
reason = "disabled_by_name"
disabled_value = "off"
partial_values = ["name-only", "user-invocable-only"]
locations = ["managed-skills", "user-skills", "project-skills", "synced-skills"]

# Any settings file can hold `skillOverrides` [docs]. config-digger only
# reads the shared Project settings, which belong to the team, and the user
# settings, which apply in every Project.
[[items.skill.disable]]
block = "json-field"
switch = { anchor = { block = "project", path = ".claude/settings.json" }, key_path = ["skillOverrides", "{name}"], store_class = "plain" }
target = "name"
context = "project"
enable_action = "delete-key"
reason = "disabled_by_name"
disabled_value = "off"
partial_values = ["name-only", "user-invocable-only"]
locations = ["managed-skills", "user-skills", "project-skills", "synced-skills"]
enable_offered = false

[[items.skill.disable]]
block = "json-field"
switch = { anchor = { block = "home", root = "settings_file" }, key_path = ["skillOverrides", "{name}"], store_class = "plain" }
target = "name"
context = "all"
