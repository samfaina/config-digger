#:schema ../../../schema/agent-definition.schema.json
# Claude Code. Facts from docs/research/claude-code.md, and those tagged
# [test] from the release gate's probe, uat/agents/claude-code.mjs
# (docs/research/release-gate.md). The probe passes on 2.1.299 to 2.1.309;
# 2.1.286 reads plain-string lists and skill names as before 2.1.299.

format_version = 1
verified = { min = "2.1.299", max = "2.1.309" }

[agent]
id = "claude-code"
name = "Claude Code"

# The native installer's launcher. It is a copy of the newest file in
# `~/.local/share/claude/versions`, whose older files are not Installations.
[[installations]]
id = "native"
folder = "~/.local/bin"
executable = "claude.exe"
versions = [{ block = "exe-version" }]

# `npm i -g @anthropic-ai/claude-code`: the `claude.cmd` shim npm writes, and
# the package's manifest [docs]. It runs in `node.exe`, which the session
# files of `[process]` cover.
[[installations]]
id = "npm"
folder = "%APPDATA%/npm"
executable = "claude.cmd"
versions = [{ block = "json-value", file = "node_modules/@anthropic-ai/claude-code/package.json", key_path = ["version"] }]

# The copy Claude Desktop downloads, one folder per version, for its classic
# install [docs] and virtualised into its MSIX package [disk]. 2.1.284 sat in
# its version folder; 2.1.286 and 2.1.299 sit one hash-named folder further
# down [disk].
[[installations]]
id = "claude-desktop"
folder = "%APPDATA%/Claude/claude-code/{*,*/*}"
executable = "claude.exe"
versions = [{ block = "exe-version" }]

[[installations]]
id = "claude-desktop-msix"
folder = "%LOCALAPPDATA%/Packages/{Claude_pzs8sxrjxfjjc,AnthropicPBC.Claude_fnn82j28hfe8t}/LocalCache/Roaming/Claude/claude-code/{*,*/*}"
executable = "claude.exe"
versions = [{ block = "exe-version" }]

# The version whose release notes were last shown: the one that last ran
# against the home [disk].
[last_ran]
anchor = { block = "home", root = "state_file" }
key_path = ["lastReleaseNotesSeen"]

# The native Installation runs as `claude.exe` from `~/.local/bin`. Claude
# Desktop is also `claude.exe`, so the path tells them apart. Each running
# session keeps `~/.claude/sessions/<pid>.json`, which also covers an npm
# Installation in `node.exe`; only its name is read.
[process]
images = ["claude.exe"]
paths = ["~/.local/bin/claude.exe"]
session_files = { block = "pid-named", folder = { block = "path", path = "~/.claude/sessions" }, extension = "json" }

[[homes]]
id = "default"
default = true
folder = { block = "path", path = "~" }

[homes.roots]
# `~/.claude.json` holds user and local Scope MCP servers.
state_file = ".claude.json"
# The user settings, which hold Disable switches but no Entries.
settings_file = ".claude/settings.json"
# Personal skills, one folder each, and the skills synced from claude.ai.
skills = ".claude/skills"
# The plugins Claude Code installed, and the cache of their files.
plugins = ".claude/plugins"

# The settings an organisation deploys, highest first [docs]. The cache of
# server-managed settings, which claude.ai or a gateway delivers, ranks
# above them all [docs]. Claude Code reads them only from the first source
# that holds a setting, a key other than the two control keys [docs]. When
# the highest source that holds a control key or a setting sets
# `managedSourcesBehavior = "merge"`, it merges that source with every
# admin source below it that holds a setting: a higher source's value
# wins, and lists combine [docs]. The HKCU value is user-writable: it
# applies only when no admin source holds settings, and never merges [docs].
[[settings]]
id = "managed"
unverified = "`~/.claude/remote-settings.json` is taken to hold the server-managed settings as one JSON object, as a managed settings file does."
control_keys = ["managedSourcesBehavior", "wslInheritsWindowsSettings"]
merge = { key = "managedSourcesBehavior", value = "merge" }
sources = [
  { block = "files", path = "~/.claude/remote-settings.json" },
  { block = "registry-value", hive = "local-machine", key = 'SOFTWARE\Policies\ClaudeCode', value = "Settings" },
  { block = "files", path = "%ProgramFiles%/ClaudeCode/managed-settings.json", drop_ins = "%ProgramFiles%/ClaudeCode/managed-settings.d" },
  { block = "registry-value", hive = "current-user", key = 'SOFTWARE\Policies\ClaudeCode', value = "Settings", user_writable = true },
]

[[scopes]]
id = "managed"

[[scopes]]
id = "local"

[[scopes]]
id = "project"

[[scopes]]
id = "user"

# The Scope Claude Code applies a plugin's servers and skills at [docs].
[[scopes]]
id = "plugin"

# Every Project Claude Code has been started on has a key in `projects`, in
# whatever spelling it was started with (`E:/x` and `E:\x` both occur).
[projects]
registries = [
  { block = "json-keys", anchor = { block = "home", root = "state_file" }, root = ["projects"] },
]

# Plugins installed from a marketplace [docs, disk]. `installed_plugins.json`
# maps each `<name>@<marketplace>` to an array of records, one per Scope it
# is installed at, each with its folder in the plugin cache; a `local` or
# `project` record names the one Project it applies in. When Claude Code
# updates a plugin it marks the version it supersedes with `.orphaned_at`
# and deletes it 14 days later; it no longer loads it. A plugin is named by
# its manifest's `name`, the manifest being optional [docs], or else by its
# id up to `@`. `claude plugin uninstall` also deletes the plugin's data
# folder [docs].
[[plugins]]
id = "installed"
registry = { block = "json-plugin-records", anchor = { block = "home", root = "plugins", path = "installed_plugins.json" }, root = ["plugins"], folder = "installPath", scope = "scope", project = "projectPath", version = "version" }
superseded_marker = ".orphaned_at"
name = { file = ".claude-plugin/plugin.json", key_path = ["name"] }
id_separator = "@"
uninstall = "claude plugin uninstall {id} --scope {scope}"

# Servers an administrator deploys to the machine [docs]. config-digger
# only reads them.
[[locations]]
id = "managed-mcp"
unverified = "What Claude Code does with a `managed-mcp.json` it cannot parse is not known."
anchor = { block = "machine", path = "%ProgramFiles%/ClaudeCode/managed-mcp.json" }
format = { block = "json", dialect = "strict" }
root = ["mcpServers"]
kind = "mcp"
scope = "managed"
provenance = "managed"
store_class = "plain"
interpolation = { block = "braces", default_separator = ":-" }
on_read_failure = "unknown"
shape = { block = "fields", one_of = ["command", "url"], types = { type = "string", command = "string", args = "string-array", env = "string-map", url = "string", headers = "string-map" } }

# Servers the managed settings declare in `managedMcpServers` [docs].
[[locations]]
id = "managed-settings-mcp"
unverified = "What Claude Code does with a managed settings file it cannot parse is not known."
anchor = { block = "settings", settings = "managed" }
format = { block = "json", dialect = "strict" }
root = ["managedMcpServers"]
kind = "mcp"
scope = "managed"
provenance = "managed"
store_class = "plain"
interpolation = { block = "braces", default_separator = ":-" }
on_read_failure = "unknown"
shape = { block = "fields", one_of = ["command", "url"], types = { type = "string", command = "string", args = "string-array", env = "string-map", url = "string", headers = "string-map" } }

[[locations]]
id = "local-mcp"
anchor = { block = "home", root = "state_file" }
format = { block = "json", dialect = "strict" }
root = ["projects", "{project}", "mcpServers"]
kind = "mcp"
scope = "local"
provenance = "file"
# Claude Code rewrites `~/.claude.json` every few minutes while it runs.
store_class = "rewritten-while-running"
# `${VAR}` and `${VAR:-default}` in `command`, `args`, `env`, `url` and `headers`.
interpolation = { block = "braces", default_separator = ":-" }
# When `~/.claude.json` doesn't parse, Claude Code keeps a `.corrupted` copy
# and asks whether to exit or reset the file [docs].
on_read_failure = "asks_user"
risks = ["agent_may_reset_file"]
shape = { block = "fields", one_of = ["command", "url"], types = { type = "string", command = "string", args = "string-array", env = "string-map", url = "string", headers = "string-map" } }

# Claude Code reads `.mcp.json` in the Project folder and in every folder
# above it, past the root of its git repo, and of same-named servers the
# nearest folder's wins [test]. config-digger reads the Project folder's
# alone (#292). Claude Code skips a `.mcp.json` it cannot parse, and
# `claude mcp list` reports it [test].
[[locations]]
id = "project-mcp"
anchor = { block = "project", path = ".mcp.json" }
format = { block = "json", dialect = "strict" }
root = ["mcpServers"]
kind = "mcp"
scope = "project"
provenance = "file"
store_class = "plain"
# `${VAR}` and `${VAR:-default}` in `command`, `args`, `env`, `url` and `headers`.
interpolation = { block = "braces", default_separator = ":-" }
on_read_failure = "ignores_file"
shape = { block = "fields", one_of = ["command", "url"], types = { type = "string", command = "string", args = "string-array", env = "string-map", url = "string", headers = "string-map" } }

[[locations]]
id = "user-mcp"
anchor = { block = "home", root = "state_file" }
format = { block = "json", dialect = "strict" }
root = ["mcpServers"]
kind = "mcp"
scope = "user"
provenance = "file"
store_class = "rewritten-while-running"
# `${VAR}` and `${VAR:-default}` in `command`, `args`, `env`, `url` and `headers`.
interpolation = { block = "braces", default_separator = ":-" }
# Keys of `~/.claude.json` outside any Entry that hold a Secret: an API key
# Claude Code stores when signed in with one, and the key suffixes it
# records as approved or rejected.
secrets.file_fields = [["primaryApiKey"], ["customApiKeyResponses", "*", "*"]]
on_read_failure = "asks_user"
risks = ["agent_may_reset_file"]
shape = { block = "fields", one_of = ["command", "url"], types = { type = "string", command = "string", args = "string-array", env = "string-map", url = "string", headers = "string-map" } }

# A plugin's default `.mcp.json` [docs]. Claude Code loads a plugin whose
# `.mcp.json` does not parse without its servers [test]. It reads a plugin
# of a `directory` marketplace from the marketplace's folder, not from the
# cache [test], which config-digger reads instead (#296).
[[locations]]
id = "plugin-mcp"
anchor = { block = "plugin", plugins = "installed", path = ".mcp.json" }
# `/mcp` names it `plugin:<plugin>:<server>`, which is what
# `disabledMcpServers` holds [disk].
name_template = "plugin:{plugin}:{name}"
format = { block = "json", dialect = "strict" }
root = ["mcpServers"]
kind = "mcp"
scope = "plugin"
provenance = "plugin"
store_class = "plain"
# Plugins can also use `${CLAUDE_PLUGIN_ROOT}`, `${CLAUDE_PLUGIN_DATA}` and
# `${CLAUDE_PROJECT_DIR}` [docs]. `${user_config.KEY}` is shown as text.
interpolation = { block = "braces", default_separator = ":-" }
on_read_failure = "ignores_file"
shape = { block = "fields", one_of = ["command", "url"], types = { type = "string", command = "string", args = "string-array", env = "string-map", url = "string", headers = "string-map" } }

# The servers a plugin's manifest declares in `mcpServers` [docs, disk]:
# inline, as a path to a file of the plugin shaped like `.mcp.json`, or a
# list of either. Claude Code reads them after the plugin's `.mcp.json`,
# and a server name declared later replaces an earlier one [docs], so this
# location ranks above it. `.mcpb` bundles, and paths written with
# `${CLAUDE_PLUGIN_ROOT}`, are not read. A plugin whose `plugin.json` does
# not parse fails to load, the servers of its `.mcp.json` and its skills
# with it [test]; config-digger leaves out this file's Entries alone
# (#295).
[[locations]]
id = "plugin-manifest-mcp"
anchor = { block = "plugin", plugins = "installed", path = ".claude-plugin/plugin.json" }
name_template = "plugin:{plugin}:{name}"
references = { root = ["mcpServers"] }
format = { block = "json", dialect = "strict" }
root = ["mcpServers"]
kind = "mcp"
scope = "plugin"
provenance = "plugin"
store_class = "plain"
interpolation = { block = "braces", default_separator = ":-" }
on_read_failure = "ignores_file"
shape = { block = "fields", one_of = ["command", "url"], types = { type = "string", command = "string", args = "string-array", env = "string-map", url = "string", headers = "string-map" } }

# Same-named Entries compete whole; the highest location wins. Claude Code
# skips a malformed Entry with a warning [docs], and a Disabled one, before
# they compete, so the next one down can win. A plugin server competes by
# endpoint instead, the same URL, ignoring the host's case, the default port
# and a trailing slash, or the same command, and loses to any other server
# [docs]. Of two plugins' servers with one endpoint, the server of the plugin
# that comes first in `enabledPlugins` wins, the key merged from the user's,
# the Project's and the local settings in that order, each plugin keeping
# its first place [test]; config-digger does not order them yet
# (#294).
[items.mcp]
precedence = ["managed-mcp", "managed-settings-mcp", "local-mcp", "project-mcp", "user-mcp", "plugin-manifest-mcp", "plugin-mcp"]
competition = { block = "exact-name", by_endpoint = ["plugin-mcp", "plugin-manifest-mcp"] }
# An exclusive `managed-mcp.json` suppresses the other servers, and an
# unapproved server is not loaded: neither competes. The allow and deny
# lists apply after precedence, to the server that wins [docs].
checks = ["policy", "shape", "disable", "approval", "precedence", "rules"]

# Claude Code loads a `.mcp.json` server only once the user approves it,
# which it asks about when it starts in the Project [docs]. Approvals are
# names in `enabledMcpjsonServers`, or `enableAllProjectMcpServers: true`,
# in any settings file [docs, disk], and in the Project's state in
# `~/.claude.json`, `enableAllProjectMcpServers` included [docs, test].
# `disabledMcpjsonServers` wins over an approval [docs], so it is checked
# first. The approvals of the Project's state, its settings and its local
# settings count only while the Project's state, under its path with
# forward slashes, holds `hasTrustDialogAccepted: true`; the user's count
# in any Project [test]. config-digger does not check that trust yet
# (#293). Since 2.1.299 a list written as one plain-string name no
# longer voids its settings file [docs]: in a settings file it approves
# that one server, and in the Project's state none [test], which
# config-digger does not read yet (#172).
[[items.mcp.gates]]
block = "approval-list"
locations = ["project-mcp"]
prompt = "on-start"
sources = [
  { anchor = { block = "settings", settings = "managed" }, key_path = ["enabledMcpjsonServers"] },
  { anchor = { block = "settings", settings = "managed" }, key_path = ["enableAllProjectMcpServers"] },
  { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["enabledMcpjsonServers"] },
  { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["enableAllProjectMcpServers"] },
  { anchor = { block = "project", path = ".claude/settings.json" }, key_path = ["enabledMcpjsonServers"] },
  { anchor = { block = "project", path = ".claude/settings.json" }, key_path = ["enableAllProjectMcpServers"] },
  { anchor = { block = "home", root = "settings_file" }, key_path = ["enabledMcpjsonServers"] },
  { anchor = { block = "home", root = "settings_file" }, key_path = ["enableAllProjectMcpServers"] },
  { anchor = { block = "home", root = "state_file" }, key_path = ["projects", "{project}", "enabledMcpjsonServers"] },
  { anchor = { block = "home", root = "state_file" }, key_path = ["projects", "{project}", "enableAllProjectMcpServers"] },
]

# `deniedMcpServers` keeps out every server one of its items names, by
# `serverName`, by `serverCommand` (the command and its args) or by
# `serverUrl` (`*` for any text). It is merged from every settings file and
# always wins [docs]. In the managed settings it is policy.
[[items.mcp.rules]]
block = "allow-deny-list"
list = "deny"
match = { name = "serverName", command = "serverCommand", url = "serverUrl" }
sources = [
  { anchor = { block = "settings", settings = "managed" }, key_path = ["deniedMcpServers"], policy = true },
  { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["deniedMcpServers"] },
  { anchor = { block = "project", path = ".claude/settings.json" }, key_path = ["deniedMcpServers"] },
  { anchor = { block = "home", root = "settings_file" }, key_path = ["deniedMcpServers"] },
]

# `allowedMcpServers`, once any settings file holds it, keeps out every
# server none of its items names, merged from every settings file [docs]:
# an empty list keeps out all of them. While it names a server by command,
# a server with a command passes only by its command, and likewise by URL
# [docs]. `allowManagedMcpServersOnly: true` in the managed settings leaves
# only the managed lists [docs]. Merging managed sources takes the managed
# list whole from the highest source that holds one [docs].
[[items.mcp.rules]]
block = "allow-deny-list"
list = "allow"
strict = true
match = { name = "serverName", command = "serverCommand", url = "serverUrl" }
policy_only = { anchor = { block = "settings", settings = "managed" }, key_path = ["allowManagedMcpServersOnly"], policy = true }
sources = [
  { anchor = { block = "settings", settings = "managed" }, key_path = ["allowedMcpServers"], policy = true, highest_source = true },
  { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["allowedMcpServers"] },
  { anchor = { block = "project", path = ".claude/settings.json" }, key_path = ["allowedMcpServers"] },
  { anchor = { block = "home", root = "settings_file" }, key_path = ["allowedMcpServers"] },
]

# While `managed-mcp.json` exists, even empty, Claude Code loads only its
# servers and those of the managed settings [docs].
[[items.mcp.gates]]
block = "managed-exclusive"
location = "managed-mcp"
except = ["managed-settings-mcp"]

# The `/mcp` toggle: names in `projects["<path>"].disabledMcpServers`, which
# Claude Code skips in that Project whatever file declares them. It is
# written under the Project key in the spelling Claude Code recorded; until
# it has recorded the Project, this switch is skipped rather than written
# under a spelling Claude Code might not look up.
[[items.mcp.disable]]
block = "json-name-list"
switch = { anchor = { block = "home", root = "state_file" }, key_path = ["projects", "{project}", "disabledMcpServers"], store_class = "rewritten-while-running" }
target = "name"
context = "project"
enable_action = "remove-item"
reason = "disabled_by_name"

# `disabledMcpjsonServers` in any settings file skips `.mcp.json` servers by
# name [docs], in a Project trusted or not [test]. Written as one
# plain-string name, it skips that server [test], which config-digger does
# not read yet (#172). The local settings file is the one meant to stay out
# of git.
[[items.mcp.disable]]
block = "json-name-list"
switch = { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["disabledMcpjsonServers"], store_class = "plain" }
target = "name"
context = "project"
enable_action = "remove-item"
reason = "disabled_by_name"
locations = ["project-mcp"]

# The `.mcp.json` approval dialog keeps the servers it rejects per Project
# in `~/.claude.json`. Enable lifts it there too.
[[items.mcp.disable]]
block = "json-name-list"
switch = { anchor = { block = "home", root = "state_file" }, key_path = ["projects", "{project}", "disabledMcpjsonServers"], store_class = "rewritten-while-running" }
target = "name"
context = "project"
enable_action = "remove-item"
reason = "disabled_by_name"
locations = ["project-mcp"]

# The shared Project settings and the user settings can hold the list too.
# config-digger only reads them: the first belongs to the team, and the
# second applies in every Project.
[[items.mcp.disable]]
block = "json-name-list"
switch = { anchor = { block = "project", path = ".claude/settings.json" }, key_path = ["disabledMcpjsonServers"], store_class = "plain" }
target = "name"
context = "project"
enable_action = "remove-item"
reason = "disabled_by_name"
locations = ["project-mcp"]
enable_offered = false

[[items.mcp.disable]]
block = "json-name-list"
switch = { anchor = { block = "home", root = "settings_file" }, key_path = ["disabledMcpjsonServers"], store_class = "plain" }
target = "name"
context = "all"
enable_action = "remove-item"
reason = "disabled_by_name"
locations = ["project-mcp"]
enable_offered = false

# A plugin is on or off as a whole, with every server and skill it carries,
# by `enabledPlugins["<name>@<marketplace>"]` in a settings file, which
# `claude plugin disable --scope local|project|user` writes [docs, disk].
# Settings merge the key across files, managed over local over Project over
# user [docs]: the first of these switches that holds the plugin decides.
# The managed settings force a plugin on or off [docs]: what they turn off
# is Blocked, and config-digger only reads them. Disable writes `false` to
# the local settings in a Project, and to the user settings otherwise;
# Enable sets `true`. The shared Project settings belong to the team, so
# config-digger only reads them. A plugin no settings file names is off
# [test]. These switches are repeated for skills below.
[[items.mcp.disable]]
block = "json-field"
switch = { anchor = { block = "settings", settings = "managed" }, key_path = ["enabledPlugins", "{plugin_id}"], store_class = "plain" }
target = "plugin"
context = "all"
enable_action = "set"
enabled_value = true
disabled_value = false
reason = "plugin_disabled"
layered = true
policy = true
locations = ["plugin-mcp", "plugin-manifest-mcp"]
enable_offered = false

[[items.mcp.disable]]
block = "json-field"
switch = { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["enabledPlugins", "{plugin_id}"], store_class = "plain" }
target = "plugin"
context = "project"
enable_action = "set"
enabled_value = true
disabled_value = false
reason = "plugin_disabled"
layered = true
locations = ["plugin-mcp", "plugin-manifest-mcp"]

[[items.mcp.disable]]
block = "json-field"
switch = { anchor = { block = "project", path = ".claude/settings.json" }, key_path = ["enabledPlugins", "{plugin_id}"], store_class = "plain" }
target = "plugin"
context = "project"
enable_action = "set"
enabled_value = true
disabled_value = false
reason = "plugin_disabled"
layered = true
locations = ["plugin-mcp", "plugin-manifest-mcp"]
enable_offered = false

[[items.mcp.disable]]
block = "json-field"
switch = { anchor = { block = "home", root = "settings_file" }, key_path = ["enabledPlugins", "{plugin_id}"], store_class = "plain" }
target = "plugin"
context = "all"
enable_action = "set"
enabled_value = true
disabled_value = false
default_value = false
reason = "plugin_disabled"
layered = true
locations = ["plugin-mcp", "plugin-manifest-mcp"]

# Skills are folders holding a `SKILL.md`, read one level down only [docs].
# A skill is named by its folder, as written, and competes by it; its
# frontmatter `name`, when the name rule lets it, is an alias the skill
# also runs by, and `skillOverrides` names the folder [test], against the
# docs. Claude Code reads the frontmatter only when `---` is the first line,
# and loads a skill whose YAML does not parse with no fields set [docs]. It
# never loads a skill from a folder named `synced` or `anthropic-skills`, in
# any capitalisation, outside claude.ai sync [docs].

# Enterprise skills, in the managed settings directory [docs].
[[locations]]
id = "managed-skills"
anchor = { block = "machine", path = "%ProgramFiles%/ClaudeCode/.claude/skills" }
format = { block = "skill-folder", name_from = "folder", reserved = ["synced", "anthropic-skills"], no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name" }
kind = "skill"
scope = "managed"
provenance = "managed"
store_class = "plain"
on_read_failure = "ignores_file"

[[locations]]
id = "user-skills"
anchor = { block = "home", root = "skills" }
format = { block = "skill-folder", name_from = "folder", reserved = ["synced", "anthropic-skills"], no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name" }
kind = "skill"
scope = "user"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

# `.claude/skills` in the Project folder and in every parent up to the repo
# root [docs]. Outside a repo only the Project folder is read. Of two
# same-named skills in that walk, the nearest folder's wins [test].
[[locations]]
id = "project-skills"
anchor = { block = "project", path = ".claude/skills", walk = "up-to-repo-root" }
format = { block = "skill-folder", name_from = "folder", reserved = ["synced", "anthropic-skills"], no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name" }
kind = "skill"
scope = "project"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

# A plugin's skills, in its `skills` folder [docs, disk]. They answer to
# `<plugin>:<folder>`, and to `<plugin>:<name>` as an alias [test], so they
# never compete with other skills [docs].
[[locations]]
id = "plugin-skills"
anchor = { block = "plugin", plugins = "installed", path = "skills" }
format = { block = "skill-folder", name_from = "folder", no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name" }
name_template = "{plugin}:{name}"
kind = "skill"
scope = "plugin"
provenance = "plugin"
store_class = "plain"
on_read_failure = "ignores_file"

# Skills synced from claude.ai sit one level deeper than the docs say, in
# `synced/<org>_<account>/<name>` [disk], next to `manifest.json` and a
# `.staging` folder, and are read at that depth only. Claude Code owns this
# copy. It syncs these skills into its sessions only while its claude.ai
# sync gate is on [docs].
[[locations]]
id = "synced-skills"
unverified = [
  "Claude Code skips the synced skills folder while its claude.ai sync gate is off.",
  "Claude Code reads a synced skill only at `synced/<org>_<account>/<name>`, not directly under `synced/` or deeper.",
  "That a synced skill is named by its folder, as every other skill is, is inferred.",
]
anchor = { block = "home", root = "skills", path = "synced" }
format = { block = "skill-folder", depth = 2, name_from = "folder", no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name" }
kind = "skill"
scope = "user"
provenance = "cloud-mirror"
store_class = "plain"
on_read_failure = "ignores_file"
when = [{ block = "feature-gate", gate = "tengu_claudeai_skills_sync_enabled" }]

# Enterprise beats personal, and personal beats project [docs]. A local
# skill beats a synced one, which then answers only to
# `/anthropic-skills:<name>` [docs]. Claude Code skips a skill it cannot
# load before they compete. Names are used as written, capitals and `_`
# included [test]. Since 2.1.299 a name rule applies, behind the gate
# `tengu_slate_wicket`, on by default [docs, binary]. It skips a skill whose
# folder name starts or ends with a space, or holds a hidden,
# direction-changing or blank-like character, but takes a space inside it
# [test]. It refuses a frontmatter `name` as an alias when it holds any
# blank, `/`, `<` or `>`, a hidden or direction-changing character, or is
# over 256 characters, and takes capitals, `_`, `.`, `:` anywhere and
# letters outside ASCII [test]. config-digger does not check the rule yet
# (#171).
[items.skill]
precedence = ["managed-skills", "user-skills", "project-skills", "plugin-skills", "synced-skills"]
competition = { block = "exact-name" }
checks = ["frontmatter", "disable", "precedence", "rules"]

# `syncClaudeAiSkills: false` stops the claude.ai skill sync [docs]. Settings
# files rank managed, local, Project, user [docs]: the highest that holds it
# decides.
[[items.skill.rules]]
block = "global-switch"
off = false
locations = ["synced-skills"]
sources = [
  { anchor = { block = "settings", settings = "managed" }, key_path = ["syncClaudeAiSkills"], policy = true },
  { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["syncClaudeAiSkills"] },
  { anchor = { block = "project", path = ".claude/settings.json" }, key_path = ["syncClaudeAiSkills"] },
  { anchor = { block = "home", root = "settings_file" }, key_path = ["syncClaudeAiSkills"] },
]

# The `/skills` menu: `skillOverrides: {"<name>": "off"}` in the Project's
# local settings [docs]. `"name-only"` lists only the name to Claude and
# `"user-invocable-only"` lists nothing, both keeping the skill in the `/`
# menu: partial switches. `"on"` is the default. It does not apply to plugin
# skills [docs].
[[items.skill.disable]]
block = "json-field"
switch = { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["skillOverrides", "{name}"], store_class = "plain" }
target = "name"
context = "project"
enable_action = "delete-key"
reason = "disabled_by_name"
disabled_value = "off"
partial_values = ["name-only", "user-invocable-only"]
locations = ["managed-skills", "user-skills", "project-skills", "synced-skills"]

# Any settings file can hold `skillOverrides` [docs]. config-digger only
# reads the shared Project settings, which belong to the team, and the user
# settings, which apply in every Project.
[[items.skill.disable]]
block = "json-field"
switch = { anchor = { block = "project", path = ".claude/settings.json" }, key_path = ["skillOverrides", "{name}"], store_class = "plain" }
target = "name"
context = "project"
enable_action = "delete-key"
reason = "disabled_by_name"
disabled_value = "off"
partial_values = ["name-only", "user-invocable-only"]
locations = ["managed-skills", "user-skills", "project-skills", "synced-skills"]
enable_offered = false

[[items.skill.disable]]
block = "json-field"
switch = { anchor = { block = "home", root = "settings_file" }, key_path = ["skillOverrides", "{name}"], store_class = "plain" }
target = "name"
context = "all"
enable_action = "delete-key"
reason = "disabled_by_name"
disabled_value = "off"
partial_values = ["name-only", "user-invocable-only"]
locations = ["managed-skills", "user-skills", "project-skills", "synced-skills"]
enable_offered = false

# A plugin's switches, as for its servers above.
[[items.skill.disable]]
block = "json-field"
switch = { anchor = { block = "settings", settings = "managed" }, key_path = ["enabledPlugins", "{plugin_id}"], store_class = "plain" }
target = "plugin"
context = "all"
enable_action = "set"
enabled_value = true
disabled_value = false
reason = "plugin_disabled"
layered = true
policy = true
locations = ["plugin-skills"]
enable_offered = false

[[items.skill.disable]]
block = "json-field"
switch = { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["enabledPlugins", "{plugin_id}"], store_class = "plain" }
target = "plugin"
context = "project"
enable_action = "set"
enabled_value = true
disabled_value = false
reason = "plugin_disabled"
layered = true
locations = ["plugin-skills"]

[[items.skill.disable]]
block = "json-field"
switch = { anchor = { block = "project", path = ".claude/settings.json" }, key_path = ["enabledPlugins", "{plugin_id}"], store_class = "plain" }
target = "plugin"
context = "project"
enable_action = "set"
enabled_value = true
disabled_value = false
reason = "plugin_disabled"
layered = true
locations = ["plugin-skills"]
enable_offered = false

[[items.skill.disable]]
block = "json-field"
switch = { anchor = { block = "home", root = "settings_file" }, key_path = ["enabledPlugins", "{plugin_id}"], store_class = "plain" }
target = "plugin"
context = "all"
enable_action = "set"
enabled_value = true
disabled_value = false
default_value = false
reason = "plugin_disabled"
layered = true
locations = ["plugin-skills"]

# Claude Code fetches GrowthBook features for the signed-in account and
# caches them in `~/.claude.json` [disk]: names in clear, values as JSON,
# and when it fetched them in milliseconds. Claude Code ships compiled, so
# a gate's name is all that says what it does. The plugin sync gate,
# `tengu_claudeai_plugins_sync_enabled`, joins once synced plugins are read.
#
# It skips the fetch and uses its own defaults when any of these is set, in
# its environment or in the `env` of a settings file: `DISABLE_GROWTHBOOK`
# (1 or true), `DISABLE_TELEMETRY` and
# `CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC` (any value), `DO_NOT_TRACK`
# (a boolean), or a third-party provider, unless the host that embeds it
# sets `CLAUDE_CODE_PROVIDER_MANAGED_BY_HOST` [docs]. Settings files rank
# managed, local, Project, user, and a higher file's variable wins [docs].
# The managed `env` is read from every admin source, drop-ins included,
# whichever source supplies the other managed settings [docs]. A Project's
# settings bypass the cache in that Project alone [docs]. A Claude apps gateway
# session also skips the fetch, which nothing on disk shows.
[[feature_gates]]
name = "tengu_claudeai_skills_sync_enabled"
unverified = "That this gate turns the claude.ai skill sync on is inferred from its name."
assumed = true
affects = ["synced-skills"]
lookup = { block = "json-value", anchor = { block = "home", root = "state_file" }, key_path = ["cachedGrowthBookFeatures", "{gate}"], cached_at = ["cachedGrowthBookFeaturesAt"] }

[feature_gates.bypass]
block = "env"
variables = [
  { name = "DISABLE_GROWTHBOOK", values = "truthy" },
  { name = "DISABLE_TELEMETRY", values = "non-empty" },
  { name = "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC", values = "non-empty" },
  { name = "DO_NOT_TRACK", values = "truthy" },
  { name = "CLAUDE_CODE_USE_BEDROCK", values = "truthy", unless = ["CLAUDE_CODE_PROVIDER_MANAGED_BY_HOST"] },
  { name = "CLAUDE_CODE_USE_MANTLE", values = "truthy", unless = ["CLAUDE_CODE_PROVIDER_MANAGED_BY_HOST"] },
  { name = "CLAUDE_CODE_USE_ANTHROPIC_AWS", values = "truthy", unless = ["CLAUDE_CODE_PROVIDER_MANAGED_BY_HOST"] },
  { name = "CLAUDE_CODE_USE_VERTEX", values = "truthy", unless = ["CLAUDE_CODE_PROVIDER_MANAGED_BY_HOST"] },
  { name = "CLAUDE_CODE_USE_FOUNDRY", values = "truthy", unless = ["CLAUDE_CODE_PROVIDER_MANAGED_BY_HOST"] },
]
env_maps = [
  { anchor = { block = "settings", settings = "managed" }, key_path = ["env"], every_source = true },
  { anchor = { block = "project", path = ".claude/settings.local.json" }, key_path = ["env"] },
  { anchor = { block = "project", path = ".claude/settings.json" }, key_path = ["env"] },
  { anchor = { block = "home", root = "settings_file" }, key_path = ["env"] },
]
