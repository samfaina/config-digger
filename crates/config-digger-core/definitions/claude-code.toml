# This gate turns the 2.1.299 skill name rule on: Claude Code applies the
# rule while it is on, and without a value, whose default is on [binary].
# It is absent from the cache of the Max account tested [disk]. While it is
# cached off, Claude Code applies a looser check, which config-digger does
# not model: no rule applies. It skips the cache under the same variables
# as the other gates [docs], and then takes its default.
[[feature_gates]]
name = "tengu_slate_wicket"
unverified = "While the gate is off, Claude Code applies a looser check that is not known; config-digger applies no name rule."
assumed = true
affects = ["managed-skills", "user-skills", "project-skills", "plugin-skills", "synced-plugin-skills", "synced-skills"]
