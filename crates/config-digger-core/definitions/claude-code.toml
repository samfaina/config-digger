# Skills synced from claude.ai sit one level deeper than the docs say, in
# `synced/<org>_<account>/<folder>` [disk], next to `manifest.json` and a
# `.staging` folder. Claude Code owns this copy: it downloads the account's
# skills there while its claude.ai sync gate is on, and reads the folder
# whatever the gate, a skill `manifest.json` does not list included [test].
# While the folder holds `.last-complete-round`, it does not download again
# a skill deleted by hand [test]. It reads no skill directly under
# `synced/` or deeper than a skill folder, and a sync round that downloads
# deletes what sits directly under `synced/` [test]. A synced skill is named
# `anthropic-skills:<folder>`, its frontmatter `name` an alias with the same
# prefix [test]. It reads only the Signed-in account's folder, leaving
# another `<org>_<account>` unread [test], and none while signed in to no
# account or off it, as `[account]` says. Tested with a Max account.
[[locations]]
id = "synced-skills"
unverified = "The name rule is taken to apply to a synced skill's folder name as it does to a local skill's."
