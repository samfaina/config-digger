#:schema ../../../schema/agent-definition.schema.json
# VS Code with GitHub Copilot. Facts from docs/research/vscode-copilot.md
# (verified against 1.129.1).

format_version = 1
verified = { min = "1.129.1", max = "1.129.1" }

[agent]
id = "vscode"
name = "VS Code"

# The user setup installs to `%LOCALAPPDATA%\Programs\Microsoft VS Code`
# [disk], the system setup to `%ProgramFiles%\Microsoft VS Code` [docs].
# `Code.exe` carries the version, as does `product.json` in the folder of
# the commit it runs [disk]. Insiders is not read.
[[installations]]
id = "user"
folder = "%LOCALAPPDATA%/Programs/Microsoft VS Code"
executable = "Code.exe"
versions = [{ block = "exe-version" }, { block = "json-value", file = "*/resources/app/product.json", key_path = ["version"] }]

[[installations]]
id = "system"
folder = "%ProgramFiles%/Microsoft VS Code"
executable = "Code.exe"
versions = [{ block = "exe-version" }, { block = "json-value", file = "*/resources/app/product.json", key_path = ["version"] }]

# VS Code runs as `Code.exe` [disk].
[process]
images = ["Code.exe"]
paths = [
  "%LOCALAPPDATA%/Programs/Microsoft VS Code/Code.exe",
  "%ProgramFiles%/Microsoft VS Code/Code.exe",
]

# The default profile keeps its files in `%APPDATA%\Code\User` [docs].
# `--user-data-dir` and portable mode move them, which a home the user adds
# covers.
[[homes]]
id = "default"
folder = { block = "path", path = "%APPDATA%/Code/User" }

[homes.roots]
# The profile's MCP servers.
mcp = "mcp.json"
# The profile's settings.
settings = "settings.json"
# The profile's own state [docs, disk], such as which servers and skills
# are Disabled. A profile keeps its own even when it shares MCP servers
# [disk].
state = "globalStorage/state.vscdb"

# Every other profile, as `storage.json` lists it, keeps its files in
# `User\profiles\<location>` [docs, disk], the built-in Agents profile in
# `builtin\agents` [disk]. One whose `useDefaultFlags.mcp` is `true` reads
# the default profile's `mcp.json` [docs], so it is no home of its own.
[[homes]]
id = "profile"
folder = { block = "json-list", file = "%APPDATA%/Code/User/globalStorage/storage.json", key_path = ["userDataProfiles"], field = "location", base = "%APPDATA%/Code/User/profiles", unless = ["useDefaultFlags", "mcp"] }

[homes.roots]
mcp = "mcp.json"
settings = "settings.json"
state = "globalStorage/state.vscdb"

# The workspaces VS Code opened [disk], which every profile shares: a folder
# per workspace in `User\workspaceStorage`, whose `workspace.json` names its
# folder or its `.code-workspace` file, and the workspaces `storage.json`
# associates with a profile. Both spell them as URIs; a remote one is no
# Project here. Which profile a workspace was last opened in is not read.
[projects]
registries = [
  { block = "json-folders", anchor = { block = "machine", path = "%APPDATA%/Code/User/workspaceStorage" }, file = "workspace.json", fields = ["folder", "workspace"], spelling = "file-uri" },
  { block = "json-keys", anchor = { block = "machine", path = "%APPDATA%/Code/User/globalStorage/storage.json" }, root = ["profileAssociations", "workspaces"], spelling = "file-uri" },
]
# A `.code-workspace` file VS Code opens is a Project of its own, with a
# collection in its `settings` and those of each of its folders [docs]. The
# first folder ranks highest [docs].
workspace_files = true

# Agent plugins, each in a folder of `~\.vscode\agent-plugins` [disk]. That
# each sits directly there, with a `plugin.json` at its root or in
# `.github\plugin` or `.claude-plugin`, is inferred from the formats VS Code
# reads [docs]. A plugin is named by its manifest's `name`, or else by its
# folder. VS Code uninstalls one in the Extensions view.
[[plugins]]
id = "agent-plugins"
registry = { block = "plugin-folders", anchor = { block = "machine", path = "~/.vscode/agent-plugins" }, marker = ["plugin.json", ".github/plugin/plugin.json", ".claude-plugin/plugin.json"] }
name = [{ file = "plugin.json", key_path = ["name"] }, { file = ".github/plugin/plugin.json", key_path = ["name"] }, { file = ".claude-plugin/plugin.json", key_path = ["name"] }]

# The extensions installed in `~\.vscode\extensions`, a folder each [docs,
# disk], each named by its manifest's `name`. The built-in extensions in the
# Installation's folder, such as GitHub Copilot Chat, and the versions
# `.obsolete` lists for removal, are not told apart.
[[plugins]]
id = "extensions"
registry = { block = "plugin-folders", anchor = { block = "machine", path = "~/.vscode/extensions" }, marker = "package.json" }
name = { file = "package.json", key_path = ["name"] }

[[scopes]]
id = "workspace-folder"

[[scopes]]
id = "workspace"

[[scopes]]
id = "user"

[[scopes]]
id = "plugin"

[[scopes]]
id = "extension"

[[scopes]]
id = "discovered"

# A setting the user leaves unset takes the value an ExP experiment assigned
# as `config.<setting>`, when VS Code marks the setting as one it runs
# experiments on, before its own default [docs]. VS Code caches the
# assignment in `memento/experiment.service.memento` of the store every
# profile reads, as tas-client's feature data [docs]: each setting this
# definition reads from the user's settings is read there last, as
# `configs[0].Parameters`, whose shape is inferred from tas-client. Which
# settings VS Code marks is not read.

# Each collection VS Code builds, lowest order first: `.vscode\mcp.json` (0),
# `.mcp.json` (1), a `.code-workspace` file's `settings.mcp` (100), the
# profile's `mcp.json` (200), extensions (300), agent plugins (350) and the
# configurations of other apps it discovers (400) [docs]. The remote user
# `mcp.json` (150) lives on the remote machine and is not read.
#
# VS Code's own files replace `${env:NAME}`, `${input:id}`, whose value the
# user types, `${workspaceFolder}` and `${userHome}` [docs]. `envFile` is the
# path of a file of variables, and shown.

# A workspace folder's `.vscode\mcp.json` [docs]. What VS Code does with one
# it cannot parse is not known.
[[locations]]
id = "folder-mcp"
anchor = { block = "project", path = ".vscode/mcp.json" }
format = { block = "json", dialect = "jsonc" }
root = ["servers"]
kind = "mcp"
switch_id = "mcp.config.ws{folder_index}.{name}"
scope = "workspace-folder"
provenance = "file"
store_class = "plain"
interpolation = { block = "braces", namespaces = ["env", "input"], names = ["workspaceFolder", "userHome"] }
on_read_failure = "unknown"

# Claude Code's `.mcp.json` in a workspace folder, which VS Code reads under
# `mcpServers` or as a bare object of servers [docs]. VS Code writes no
# reference there [docs], and how it reads one is not known, so every value
# is taken as written: a `${NAME}` Claude Code replaces is a Secret to VS
# Code.
[[locations]]
id = "dot-mcp"
anchor = { block = "project", path = ".mcp.json" }
format = { block = "json", dialect = "jsonc" }
root = ["mcpServers"]
bare = true
kind = "mcp"
switch_id = "workspace-dot-mcp.{folder_index}.{name}"
scope = "workspace-folder"
provenance = "file"
store_class = "plain"
on_read_failure = "unknown"

# A `.code-workspace` file's `settings.mcp` [docs]. What VS Code does with
# one it cannot parse is not known.
[[locations]]
id = "workspace-mcp"
anchor = { block = "project-file" }
format = { block = "json", dialect = "jsonc" }
root = ["settings", "mcp", "servers"]
kind = "mcp"
switch_id = "mcp.config.workspace.{name}"
scope = "workspace"
provenance = "file"
store_class = "plain"
interpolation = { block = "braces", namespaces = ["env", "input"], names = ["workspaceFolder", "userHome"] }
# The setting `mcp.enterpriseManagedAuth.idp` holds the client Secret of
# the identity provider VS Code signs in to MCP servers with [disk], and a
# workspace's settings can hold it too, as one key or nested in `mcp`.
secrets.file_fields = [
  ["settings", "mcp.enterpriseManagedAuth.idp", "clientSecret"],
  ["settings", "mcp", "enterpriseManagedAuth", "idp", "clientSecret"],
]
on_read_failure = "unknown"

# The profile's `mcp.json` [docs]. VS Code rewrites it whole on every
# install or remove, dropping its comments, and deletes it once it holds
# nothing [docs]. What it does with one it cannot parse is not known.
[[locations]]
id = "user-mcp"
anchor = { block = "home", root = "mcp" }
format = { block = "json", dialect = "jsonc" }
root = ["servers"]
kind = "mcp"
switch_id = "mcp.config.usrlocal.{name}"
scope = "user"
provenance = "file"
store_class = "rewritten-while-running"
interpolation = { block = "braces", namespaces = ["env", "input"], names = ["workspaceFolder", "userHome"] }
on_read_failure = "unknown"

# The servers an extension gives VS Code exist only while it runs [docs].
# VS Code caches the last ones each extension gave in the workspace's
# `state.vscdb`, under `mcp.extCachedServers`, as
# `{"<publisher.extension>/<provider>": {"servers": [...]}}`, each server
# with its `label` and its `launch` [docs, disk]. The cache can be stale.
# How the cache spells a launch's headers and env is not known, so every
# value of its `env`, `headers`, `args` and `uri` is taken as a Secret. VS
# Code rebuilds a `state.vscdb` it cannot open from its backup [docs].
[[locations]]
id = "extension-mcp"
anchor = { block = "project-storage", path = "state.vscdb" }
format = { block = "sqlite-json", key = "mcp.extCachedServers" }
root = ["mcp.extCachedServers", "*", "servers"]
named_by = "label"
kind = "mcp"
switch_id = "{extension}/{name}"
scope = "extension"
provenance = "extension"
store_class = "sqlite"
secrets.fields = [["launch", "env"], ["launch", "headers"], ["launch", "args"], ["launch", "uri"]]
on_read_failure = "ignores_file"
risks = ["agent_may_drop_entries"]

# An agent plugin's servers, in the `.mcp.json` at its root, which is
# inferred.
[[locations]]
id = "plugin-mcp"
anchor = { block = "plugin", plugins = "agent-plugins", path = ".mcp.json" }
format = { block = "json", dialect = "jsonc" }
root = ["mcpServers"]
bare = true
kind = "mcp"
switch_id = "plugin.{plugin_uri}.{name}"
scope = "plugin"
provenance = "plugin"
store_class = "plain"
on_read_failure = "unknown"

# The configurations of other apps VS Code discovers, each only while its
# source is on in `chat.mcp.discovery.enabled`, and every source is off by
# default [disk]. Each is read in its own app's format [docs]. Which of the
# settings files hold the setting VS Code reads is not known: they are read
# as for `chat.mcp.collisionBehavior`.
[[locations]]
id = "claude-desktop-mcp"
anchor = { block = "machine", path = "%APPDATA%/Claude/claude_desktop_config.json" }
format = { block = "json", dialect = "jsonc" }
root = ["mcpServers"]
kind = "mcp"
switch_id = "claude-desktop.null.{name}"
scope = "discovered"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

[[locations.when]]
block = "setting"
equals = true
default = false
sources = [
  { anchor = { block = "project", path = ".vscode/settings.json" }, key_path = ["chat.mcp.discovery.enabled", "claude-desktop"], dialect = "jsonc" },
  { anchor = { block = "project-file" }, key_path = ["settings", "chat.mcp.discovery.enabled", "claude-desktop"], dialect = "jsonc" },
  { anchor = { block = "home", root = "settings" }, key_path = ["chat.mcp.discovery.enabled", "claude-desktop"], dialect = "jsonc" },
  { anchor = { block = "machine", path = "%APPDATA%/Code/User/globalStorage/state.vscdb" }, key_path = ["memento/experiment.service.memento", "VSCode.ABExp.FeatureData", "configs", "0", "Parameters", "config.chat.mcp.discovery.enabled", "claude-desktop"], sqlite = true },
]

[[locations]]
id = "cursor-workspace-mcp"
anchor = { block = "project", path = ".cursor/mcp.json" }
format = { block = "json", dialect = "jsonc" }
root = ["mcpServers"]
kind = "mcp"
switch_id = "cursor-workspace.{folder_index}.{name}"
scope = "discovered"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

[[locations.when]]
block = "setting"
equals = true
default = false
sources = [
  { anchor = { block = "project", path = ".vscode/settings.json" }, key_path = ["chat.mcp.discovery.enabled", "cursor-workspace"], dialect = "jsonc" },
  { anchor = { block = "project-file" }, key_path = ["settings", "chat.mcp.discovery.enabled", "cursor-workspace"], dialect = "jsonc" },
  { anchor = { block = "home", root = "settings" }, key_path = ["chat.mcp.discovery.enabled", "cursor-workspace"], dialect = "jsonc" },
  { anchor = { block = "machine", path = "%APPDATA%/Code/User/globalStorage/state.vscdb" }, key_path = ["memento/experiment.service.memento", "VSCode.ABExp.FeatureData", "configs", "0", "Parameters", "config.chat.mcp.discovery.enabled", "cursor-workspace"], sqlite = true },
]

[[locations]]
id = "cursor-global-mcp"
anchor = { block = "machine", path = "~/.cursor/mcp.json" }
format = { block = "json", dialect = "jsonc" }
root = ["mcpServers"]
kind = "mcp"
switch_id = "cursor.null.{name}"
scope = "discovered"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

[[locations.when]]
block = "setting"
equals = true
default = false
sources = [
  { anchor = { block = "project", path = ".vscode/settings.json" }, key_path = ["chat.mcp.discovery.enabled", "cursor-global"], dialect = "jsonc" },
  { anchor = { block = "project-file" }, key_path = ["settings", "chat.mcp.discovery.enabled", "cursor-global"], dialect = "jsonc" },
  { anchor = { block = "home", root = "settings" }, key_path = ["chat.mcp.discovery.enabled", "cursor-global"], dialect = "jsonc" },
  { anchor = { block = "machine", path = "%APPDATA%/Code/User/globalStorage/state.vscdb" }, key_path = ["memento/experiment.service.memento", "VSCode.ABExp.FeatureData", "configs", "0", "Parameters", "config.chat.mcp.discovery.enabled", "cursor-global"], sqlite = true },
]

[[locations]]
id = "windsurf-mcp"
anchor = { block = "machine", path = "~/.codeium/windsurf/mcp_config.json" }
format = { block = "json", dialect = "jsonc" }
root = ["mcpServers"]
kind = "mcp"
switch_id = "windsurf.null.{name}"
scope = "discovered"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

[[locations.when]]
block = "setting"
equals = true
default = false
sources = [
  { anchor = { block = "project", path = ".vscode/settings.json" }, key_path = ["chat.mcp.discovery.enabled", "windsurf"], dialect = "jsonc" },
  { anchor = { block = "project-file" }, key_path = ["settings", "chat.mcp.discovery.enabled", "windsurf"], dialect = "jsonc" },
  { anchor = { block = "home", root = "settings" }, key_path = ["chat.mcp.discovery.enabled", "windsurf"], dialect = "jsonc" },
  { anchor = { block = "machine", path = "%APPDATA%/Code/User/globalStorage/state.vscdb" }, key_path = ["memento/experiment.service.memento", "VSCode.ABExp.FeatureData", "configs", "0", "Parameters", "config.chat.mcp.discovery.enabled", "windsurf"], sqlite = true },
]

# Nothing is merged: each Entry is a server of its own [docs]. While
# `chat.mcp.collisionBehavior` is `"disable"`, the default, servers whose
# names match without regard to case form a group, and VS Code leaves every
# one but the first of the lowest-order collection off [docs]. With
# `"suffix"` every one of them runs, its tools numbered apart [docs].
# Settings rank a folder's over a workspace file's over the user's [docs].
# For a profile that shares the default profile's settings, its own
# `settings.json` is read all the same.
[items.mcp]
precedence = ["folder-mcp", "dot-mcp", "workspace-mcp", "user-mcp", "extension-mcp", "plugin-mcp", "claude-desktop-mcp", "cursor-workspace-mcp", "cursor-global-mcp", "windsurf-mcp"]
checks = ["rules", "disable", "precedence", "trust", "approval"]

[items.mcp.competition]
block = "case-insensitive-name"

[items.mcp.competition.only_while]
equals = "disable"
default = "disable"
sources = [
  { anchor = { block = "project", path = ".vscode/settings.json" }, key_path = ["chat.mcp.collisionBehavior"], dialect = "jsonc" },
  { anchor = { block = "project-file" }, key_path = ["settings", "chat.mcp.collisionBehavior"], dialect = "jsonc" },
  { anchor = { block = "home", root = "settings" }, key_path = ["chat.mcp.collisionBehavior"], dialect = "jsonc" },
  { anchor = { block = "machine", path = "%APPDATA%/Code/User/globalStorage/state.vscdb" }, key_path = ["memento/experiment.service.memento", "VSCode.ABExp.FeatureData", "configs", "0", "Parameters", "config.chat.mcp.collisionBehavior"], sqlite = true },
]

# `chat.mcp.access` lets every server run (`"all"`, the default), none
# (`"none"`), or only those installed from the registry (`"registry"`),
# which VS Code then reads from the profile's `mcp.json` alone [docs]. That
# an installed server must also match the registry is not checked. An
# account's policy replaces the user's value [docs]: VS Code caches the
# policy it fetched in `defaultAccount.cachedPolicyData` of the store every
# profile reads, and reads `policyData.mcp: false` as `"none"` and
# `policyData.mcpAccess: "registry_only"` as `"registry"`, leaving the
# setting to the user otherwise [docs]. That `entitlementsFetchedAt` is when
# it fetched the policy is inferred from its name. config-digger never
# writes either.
[[items.mcp.rules]]
block = "global-switch"
off = "none"
sources = [
  { anchor = { block = "machine", path = "%APPDATA%/Code/User/globalStorage/state.vscdb" }, key_path = ["defaultAccount.cachedPolicyData", "accountPolicyData", "policyData", "mcp"], sqlite = true, policy = true, map = [[false, "none"]], cached_at = ["defaultAccount.cachedPolicyData", "accountPolicyData", "entitlementsFetchedAt"] },
  { anchor = { block = "machine", path = "%APPDATA%/Code/User/globalStorage/state.vscdb" }, key_path = ["defaultAccount.cachedPolicyData", "accountPolicyData", "policyData", "mcpAccess"], sqlite = true, policy = true, map = [["registry_only", "registry"]], cached_at = ["defaultAccount.cachedPolicyData", "accountPolicyData", "entitlementsFetchedAt"] },
  { anchor = { block = "home", root = "settings" }, key_path = ["chat.mcp.access"], dialect = "jsonc" },
  { anchor = { block = "machine", path = "%APPDATA%/Code/User/globalStorage/state.vscdb" }, key_path = ["memento/experiment.service.memento", "VSCode.ABExp.FeatureData", "configs", "0", "Parameters", "config.chat.mcp.access"], sqlite = true },
]

[[items.mcp.rules]]
block = "global-switch"
off = "registry"
locations = ["folder-mcp", "dot-mcp", "workspace-mcp", "extension-mcp", "plugin-mcp", "claude-desktop-mcp", "cursor-workspace-mcp", "cursor-global-mcp", "windsurf-mcp"]
sources = [
  { anchor = { block = "machine", path = "%APPDATA%/Code/User/globalStorage/state.vscdb" }, key_path = ["defaultAccount.cachedPolicyData", "accountPolicyData", "policyData", "mcp"], sqlite = true, policy = true, map = [[false, "none"]], cached_at = ["defaultAccount.cachedPolicyData", "accountPolicyData", "entitlementsFetchedAt"] },
  { anchor = { block = "machine", path = "%APPDATA%/Code/User/globalStorage/state.vscdb" }, key_path = ["defaultAccount.cachedPolicyData", "accountPolicyData", "policyData", "mcpAccess"], sqlite = true, policy = true, map = [["registry_only", "registry"]], cached_at = ["defaultAccount.cachedPolicyData", "accountPolicyData", "entitlementsFetchedAt"] },
  { anchor = { block = "home", root = "settings" }, key_path = ["chat.mcp.access"], dialect = "jsonc" },
  { anchor = { block = "machine", path = "%APPDATA%/Code/User/globalStorage/state.vscdb" }, key_path = ["memento/experiment.service.memento", "VSCode.ABExp.FeatureData", "configs", "0", "Parameters", "config.chat.mcp.access"], sqlite = true },
]

# A workspace's own collections, its extensions' included, start only once
# the user trusts the workspace: VS Code keeps listing them and they still
# compete, but asks for trust before one starts [docs]. A folder is trusted
# with every folder below it, and a workspace file only when it and each of
# its folders are [docs]. VS Code keeps the folders it trusts in
# `content.trust.model.key` of the store every profile shares, under
# `uriTrustInfo`, as `{"uri": <URI>, "trusted": true}` items, and moves
# them there from the default profile's store when it finds them only in
# the latter [docs]. That stable VS Code shares that store in
# `~\.vscode-shared` is inferred from its product name. `--disable-workspace-trust`
# turns trust off for one launch, which nothing on disk shows.
[[items.mcp.gates]]
block = "trusted-folders"
locations = ["folder-mcp", "dot-mcp", "workspace-mcp", "extension-mcp", "cursor-workspace-mcp"]
uri = "uri"
trusted = "trusted"
sources = [
  { anchor = { block = "machine", path = "~/.vscode-shared/sharedStorage/state.vscdb" }, key_path = ["content.trust.model.key", "uriTrustInfo"], sqlite = true },
  { anchor = { block = "machine", path = "%APPDATA%/Code/User/globalStorage/state.vscdb" }, key_path = ["content.trust.model.key", "uriTrustInfo"], sqlite = true },
]

[items.mcp.gates.trust_all]
equals = false
default = true
sources = [
  { anchor = { block = "home", root = "settings" }, key_path = ["security.workspace.trust.enabled"], dialect = "jsonc" },
  { anchor = { block = "machine", path = "%APPDATA%/Code/User/globalStorage/state.vscdb" }, key_path = ["memento/experiment.service.memento", "VSCode.ABExp.FeatureData", "configs", "0", "Parameters", "config.security.workspace.trust.enabled"], sqlite = true },
]

# The servers VS Code discovers in other apps' files start only once the
# user trusts them, and VS Code asks again whenever a server's launch
# configuration changes [docs]. It records each in the `serverTools` of
# `mcpToolCache`, in the profile's store for a profile's collection and in
# the workspace's for a workspace's, as `[id, record]` pairs whose record's
# `trustedAtNonce` is the nonce of the configuration the user trusted and
# `nonce` that of the one it last saw [docs]. The nonce hashes the launch
# configuration [docs], which config-digger does not compute: a server is
# taken as trusted while the two match, though its file may have changed
# since VS Code last saw it.
[[items.mcp.gates]]
block = "nonce-trust"
locations = ["claude-desktop-mcp", "cursor-global-mcp", "windsurf-mcp"]
trusted_at = "trustedAtNonce"
nonce = "nonce"
sources = [
  { anchor = { block = "home", root = "state" }, key_path = ["mcpToolCache", "serverTools"], sqlite = true },
]

[[items.mcp.gates]]
block = "nonce-trust"
locations = ["cursor-workspace-mcp"]
trusted_at = "trustedAtNonce"
nonce = "nonce"
sources = [
  { anchor = { block = "project-storage", path = "state.vscdb" }, key_path = ["mcpToolCache", "serverTools"], sqlite = true },
]

# VS Code turns a server off or on in the `mcp.enablement` of a `state.vscdb`,
# the JSON text of a list of `[id, enabled]` pairs, each id the server's
# collection followed by its name, as each location's `switch_id` makes it
# [docs]. A workspace's store holds the pairs VS Code writes for that
# workspace alone, and the profile's those for every workspace; a pair in
# the workspace's store decides over the profile's, `true` included, and a
# server without one is on [docs]. Disable writes `false` to the workspace's
# store in a Project, and to the profile's otherwise; Enable takes the pair
# out of both, as VS Code's own Enable does [docs]. That a store holds the
# pairs in this shape, and the ids, come from VS Code's source only, so
# they are unverified until the release gate confirms them.
[[items.mcp.disable]]
block = "json-item-list"
switch = { anchor = { block = "project-storage", path = "state.vscdb" }, key_path = ["mcp.enablement", "{name}"], named_by = "0", store_class = "sqlite" }
target = "entry"
context = "project"
enable_action = "remove-item"
disabled_item = ["{name}", false]
enabled_item = ["{name}", true]
reason = "disabled_natively"
layered = true

[[items.mcp.disable]]
block = "json-item-list"
switch = { anchor = { block = "home", root = "state" }, key_path = ["mcp.enablement", "{name}"], named_by = "0", store_class = "sqlite" }
target = "entry"
context = "all"
enable_action = "remove-item"
disabled_item = ["{name}", false]
enabled_item = ["{name}", true]
reason = "disabled_natively"
layered = true

# Skills are folders holding a `SKILL.md`, read one level down [docs], each
# named by its folder [docs]. What VS Code does with a `SKILL.md` without a
# frontmatter, or one whose YAML does not parse, is not known: it is taken
# to load the first under its folder's name and to skip the second.

# A workspace folder's `.agents`, `.github` and `.claude` skills, in that
# order [docs]. Whether that order is one VS Code keeps is not known.
[[locations]]
id = "folder-agents-skills"
anchor = { block = "project", path = ".agents/skills" }
format = { block = "skill-folder", name_from = "folder", no_frontmatter = "folder-name", malformed_frontmatter = "skip", no_name = "folder-name" }
kind = "skill"
switch_id = "{uri_path}/SKILL.md"
scope = "workspace-folder"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

[[locations]]
id = "folder-github-skills"
anchor = { block = "project", path = ".github/skills" }
format = { block = "skill-folder", name_from = "folder", no_frontmatter = "folder-name", malformed_frontmatter = "skip", no_name = "folder-name" }
kind = "skill"
switch_id = "{uri_path}/SKILL.md"
scope = "workspace-folder"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

# Claude Code's project skills, which VS Code reads too [docs].
[[locations]]
id = "folder-claude-skills"
anchor = { block = "project", path = ".claude/skills" }
format = { block = "skill-folder", name_from = "folder", no_frontmatter = "folder-name", malformed_frontmatter = "skip", no_name = "folder-name" }
kind = "skill"
switch_id = "{uri_path}/SKILL.md"
scope = "workspace-folder"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

# The personal `~\.agents`, `~\.copilot` and `~\.claude` skills, in that
# order [docs], which every profile reads.
[[locations]]
id = "user-agents-skills"
anchor = { block = "machine", path = "~/.agents/skills" }
format = { block = "skill-folder", name_from = "folder", no_frontmatter = "folder-name", malformed_frontmatter = "skip", no_name = "folder-name" }
kind = "skill"
switch_id = "{uri_path}/SKILL.md"
scope = "user"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

[[locations]]
id = "user-copilot-skills"
anchor = { block = "machine", path = "~/.copilot/skills" }
format = { block = "skill-folder", name_from = "folder", no_frontmatter = "folder-name", malformed_frontmatter = "skip", no_name = "folder-name" }
kind = "skill"
switch_id = "{uri_path}/SKILL.md"
scope = "user"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

# Claude Code's personal skills, which VS Code reads too [docs].
[[locations]]
id = "user-claude-skills"
anchor = { block = "machine", path = "~/.claude/skills" }
format = { block = "skill-folder", name_from = "folder", no_frontmatter = "folder-name", malformed_frontmatter = "skip", no_name = "folder-name" }
kind = "skill"
switch_id = "{uri_path}/SKILL.md"
scope = "user"
provenance = "file"
