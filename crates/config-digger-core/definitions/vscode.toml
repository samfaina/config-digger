# A workspace's own collections, its extensions' included, start only once
# the user trusts the workspace: VS Code keeps listing them and they still
# compete, but asks for trust before one starts [docs]. A folder is trusted
# with every folder below it, and a workspace file only when it and each of
# its folders are [docs]. VS Code keeps the folders it trusts in
# `content.trust.model.key` of the store every profile shares, under
# `uriTrustInfo`, as `{"uri": <URI>, "trusted": true}` items, and moves
# them there from the default profile's store when it finds them only in
# the latter [docs]. Stable VS Code shares that store in
# `~\.vscode-shared\sharedStorage\state.vscdb`, unless `--shared-data-dir`
# moves it [test]. `--disable-workspace-trust` turns trust off for one
# launch, which nothing on disk shows.
[[items.mcp.gates]]
block = "trusted-folders"
locations = ["folder-mcp", "dot-mcp", "workspace-mcp", "extension-mcp", "cursor-workspace-mcp"]
uri = "uri"
trusted = "trusted"
sources = [
  { anchor = { block = "machine", path = "~/.vscode-shared/sharedStorage/state.vscdb" }, key_path = ["content.trust.model.key", "uriTrustInfo"], sqlite = true },
  { anchor = { block = "machine", path = "%APPDATA%/Code/User/globalStorage/state.vscdb" }, key_path = ["content.trust.model.key", "uriTrustInfo"], sqlite = true },
]

[items.mcp.gates.trust_all]
equals = false
default = true
sources = [
  { anchor = { block = "home", root = "settings" }, key_path = ["security.workspace.trust.enabled"], dialect = "jsonc" },
]

# The servers VS Code discovers in other apps' files start only once the
# user trusts them, and VS Code asks again whenever a server's launch
# configuration changes [docs]. It records each in the `serverTools` of
# `mcpToolCache`, in the profile's store for a profile's collection and in
# the workspace's for a workspace's, as `[id, record]` pairs whose record's
# `trustedAtNonce` is the nonce of the launch the user trusted and `nonce`
# that of the one it last ran [docs]. VS Code trusts a server while the
# nonce of its launch, as the file now gives it, equals `trustedAtNonce`
# [docs]; it writes `nonce` only when it runs the server [binary], so once
# the file changes, VS Code no longer starts the server without asking,
# though both fields still match, before that launch and after it [test].
#
# config-digger computes the nonce of a stdio server as VS Code does,
# `hash = "vscode"`: the SHA-256 of the JSON text of the launch VS Code
# builds from the file [docs], with the user's home folder as its `cwd`,
# its drive letter in lower case [test]. The `trustedAtNonce` VS Code
# writes for a Claude Desktop server, with its `args` and `env`, is that
# nonce, so the server is Effective once trusted, Blocked once its file
# changes, and Effective again once VS Code trusts the new launch [test].
# The launch of an HTTP server, one with a `url`, holds VS Code's own URI
# object, which config-digger does not build: for such a server it keeps
# the rule that its record's two fields match, with a caveat that VS Code
# may ask again if its file changed since VS Code last ran it.
[[items.mcp.gates]]
unverified = "VS Code is taken to launch the servers of Cursor's `~/.cursor/mcp.json` and Windsurf's `mcp_config.json` in the user's home folder, as it does Claude Desktop's and as its code says; a probe trusting a server of each would test it."
block = "nonce-trust"
locations = ["claude-desktop-mcp", "cursor-global-mcp", "windsurf-mcp"]
trusted_at = "trustedAtNonce"
nonce = "nonce"
hash = "vscode"
cwd = "user-folder"
sources = [
  { anchor = { block = "home", root = "state" }, key_path = ["mcpToolCache", "serverTools"], sqlite = true },
]

# A workspace folder's `.cursor\mcp.json` launches its servers with no
# `cwd`, but VS Code hashes the folder's `fsPath` as one [docs].
[[items.mcp.gates]]
unverified = "The nonce of a server of a workspace folder's `.cursor/mcp.json` is taken to hash the folder as config-digger spells the Project, its drive letter in lower case, as VS Code's code says; a probe trusting such a server in a Project, opened by a path in another case too, would test it."
block = "nonce-trust"
locations = ["cursor-workspace-mcp"]
trusted_at = "trustedAtNonce"
nonce = "nonce"
hash = "vscode"
cwd = "project-folder"
sources = [
  { anchor = { block = "project-storage", path = "state.vscdb" }, key_path = ["mcpToolCache", "serverTools"], sqlite = true },
]

# VS Code turns a server off or on in the `mcp.enablement` of a `state.vscdb`,
# the JSON text of a list of `[id, enabled]` pairs, each id the server's
# collection followed by its name, as each location's `switch_id` makes it
# [docs, test]: VS Code gives the model no tool of a server a `false` pair
# names, in a workspace's store or the profile's [test]. A workspace's
# store holds the pairs VS Code writes for that
# workspace alone, and the profile's those for every workspace; a pair in
# the workspace's store decides over the profile's, `true` included, and a
# server without one is on [docs]. Disable writes `false` to the workspace's
# store in a Project, and to the profile's otherwise; Enable takes the pair
# out of both, as VS Code's own Enable does [docs].
[[items.mcp.disable]]
block = "json-item-list"
switch = { anchor = { block = "project-storage", path = "state.vscdb" }, key_path = ["mcp.enablement", "{name}"], named_by = "0", store_class = "sqlite" }
target = "entry"
context = "project"
enable_action = "remove-item"
disabled_item = ["{name}", false]
enabled_item = ["{name}", true]
reason = "disabled_natively"
layered = true

[[items.mcp.disable]]
block = "json-item-list"
switch = { anchor = { block = "home", root = "state" }, key_path = ["mcp.enablement", "{name}"], named_by = "0", store_class = "sqlite" }
target = "entry"
context = "all"
enable_action = "remove-item"
disabled_item = ["{name}", false]
enabled_item = ["{name}", true]
reason = "disabled_natively"
layered = true

# Skills are folders holding a `SKILL.md`, read one level down [docs], each
# named by its folder [docs]. VS Code loads a `SKILL.md` with no
# frontmatter, or whose frontmatter never closes or is not YAML, under its
# folder's name, a workspace folder's skill or a personal one [test], as
# one code reads every location's skills [binary]. It keeps the values it
# can read, which config-digger does not, so it may show no description
# where VS Code has one. A skill with no description, or with
# `disable-model-invocation: true`, is one the user can run [test], but
# VS Code does not list it to its model [binary], whatever its location,
# as one code builds that list: config-digger shows it in its State with
# an `unlisted` note, for a `SKILL.md` with no frontmatter or with one it
# reads as YAML. A frontmatter config-digger reads as malformed, or one
# with a `[` or `{` value that never closes, gets no note, as VS Code may
# keep values from it that config-digger does not read (#473).

# A workspace folder's `.agents`, `.github` and `.claude` skills, in that
# order [docs, test].
[[locations]]
id = "folder-agents-skills"
anchor = { block = "project", path = ".agents/skills" }
format = { block = "skill-folder", name_from = "folder", no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name", unlisted = ["no-description", "disable-model-invocation"] }
kind = "skill"
switch_id = "{uri_path}/SKILL.md"
scope = "workspace-folder"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

[[locations]]
id = "folder-github-skills"
anchor = { block = "project", path = ".github/skills" }
format = { block = "skill-folder", name_from = "folder", no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name", unlisted = ["no-description", "disable-model-invocation"] }
kind = "skill"
switch_id = "{uri_path}/SKILL.md"
scope = "workspace-folder"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

# Claude Code's project skills, which VS Code reads too [docs].
[[locations]]
id = "folder-claude-skills"
anchor = { block = "project", path = ".claude/skills" }
format = { block = "skill-folder", name_from = "folder", no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name", unlisted = ["no-description", "disable-model-invocation"] }
kind = "skill"
switch_id = "{uri_path}/SKILL.md"
scope = "workspace-folder"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

# The personal `~\.agents`, `~\.copilot` and `~\.claude` skills, in that
# order [docs], which every profile reads.
[[locations]]
id = "user-agents-skills"
anchor = { block = "machine", path = "~/.agents/skills" }
format = { block = "skill-folder", name_from = "folder", no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name", unlisted = ["no-description", "disable-model-invocation"] }
kind = "skill"
switch_id = "{uri_path}/SKILL.md"
scope = "user"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

[[locations]]
id = "user-copilot-skills"
anchor = { block = "machine", path = "~/.copilot/skills" }
format = { block = "skill-folder", name_from = "folder", no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name", unlisted = ["no-description", "disable-model-invocation"] }
kind = "skill"
switch_id = "{uri_path}/SKILL.md"
scope = "user"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

# Claude Code's personal skills, which VS Code reads too [docs].
[[locations]]
id = "user-claude-skills"
anchor = { block = "machine", path = "~/.claude/skills" }
format = { block = "skill-folder", name_from = "folder", no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name", unlisted = ["no-description", "disable-model-invocation"] }
kind = "skill"
switch_id = "{uri_path}/SKILL.md"
scope = "user"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

# An agent plugin's skills, in its `skills` folder [docs].
[[locations]]
id = "plugin-skills"
anchor = { block = "plugin", plugins = "agent-plugins", path = "skills" }
format = { block = "skill-folder", name_from = "folder", no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name", unlisted = ["no-description", "disable-model-invocation"] }
kind = "skill"
switch_id = "{uri_path}/SKILL.md"
scope = "plugin"
provenance = "plugin"
store_class = "plain"
on_read_failure = "ignores_file"

# The skills an extension, built-in or installed, contributes in its
# `package.json`'s `contributes.chatSkills`, each a path to a skill folder
# or its `SKILL.md` [disk]. A skill's `when` clause is not read.
[[locations]]
id = "extension-skills"
anchor = { block = "plugin", plugins = ["built-in-extensions", "extensions"], path = "package.json" }
format = { block = "skill-list", list = ["contributes", "chatSkills"], field = "path", skills = { name_from = "folder", no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name", unlisted = ["no-description", "disable-model-invocation"] } }
kind = "skill"
switch_id = "{uri_path}/SKILL.md"
scope = "extension"
provenance = "extension"
store_class = "plain"
on_read_failure = "ignores_file"

# The first skill of a name wins: workspace, then personal, then plugin,
# then extension [docs].
[items.skill]
precedence = ["folder-agents-skills", "folder-github-skills", "folder-claude-skills", "user-agents-skills", "user-copilot-skills", "user-claude-skills", "plugin-skills", "extension-skills"]
competition = { block = "exact-name" }
checks = ["frontmatter", "rules", "disable", "precedence"]

# VS Code has no switch that keeps a skill from its model. The profile's
# `chat.disabledPromptFiles.skill` is the JSON text of a list of the URIs of
# `SKILL.md` files, each as VS Code writes a URI: an object whose `path` is
# the file's, with its drive as the folder spells it, compared without
# regard to case [docs]. A URI names the skill's `SKILL.md`, not its folder
# [test]. A skill listed there is hidden from the user only, who can no
# longer run it [test]: VS Code still lists it in `chat.getSkills` [test],
# the list it builds its model's `<skills>` from [binary]. config-digger
# shows the list as a partial switch on a skill that keeps its State, as it
# shows Claude Code's `name-only`. Disable never writes it; Enable takes the
# skill's URI out (#341).
[[items.skill.disable]]
block = "json-item-list"
switch = { anchor = { block = "home", root = "state" }, key_path = ["chat.disabledPromptFiles.skill", "{name}"], named_by = "path", store_class = "sqlite" }
target = "entry"
context = "all"
enable_action = "remove-item"
ignore_case = true
partial = "hidden_from_user"

# So config-digger parks the folder of a skill it Disables in its own
# store, and puts it back on Enable, as for Cursor; a skill listed above
# comes back still listed, for its Enable to take out. A skill in a
# git-versioned folder is never parked, so it has no Disable, nor has a
# plugin's or an extension's.
# Parking a skill of another Agent's folder, such as `~\.claude\skills`,
# takes it from that Agent too.
[[items.skill.disable]]
block = "park"
locations = ["folder-agents-skills", "folder-github-skills", "folder-claude-skills", "user-agents-skills", "user-copilot-skills", "user-claude-skills"]

# `chat.useAgentSkills: false` turns every skill off [docs].
[[items.skill.rules]]
block = "global-switch"
off = false
sources = [
  { anchor = { block = "home", root = "settings" }, key_path = ["chat.useAgentSkills"], dialect = "jsonc" },
]
