#:schema ../../../schema/agent-definition.schema.json
# VS Code with GitHub Copilot. Facts from docs/research/vscode-copilot.md
# (verified against 1.129.1), and those tagged [test] from the release
# gate's probe, uat/agents/vscode.mjs (docs/research/release-gate.md),
# which passes on 1.129.1, 1.135.0 and 1.141.0.

format_version = 1
verified = { min = "1.129.1", max = "1.141.0" }

[agent]
id = "vscode"
name = "VS Code"

# The user setup installs to `%LOCALAPPDATA%\Programs\Microsoft VS Code`
# [disk], the system setup to `%ProgramFiles%\Microsoft VS Code` [docs].
# `Code.exe` carries the version, as does `product.json` in the folder of
# the commit it runs [disk]. Insiders is not read.
[[installations]]
id = "user"
folder = "%LOCALAPPDATA%/Programs/Microsoft VS Code"
executable = "Code.exe"
versions = [{ block = "exe-version" }, { block = "json-value", file = "*/resources/app/product.json", key_path = ["version"] }]

[[installations]]
id = "system"
folder = "%ProgramFiles%/Microsoft VS Code"
executable = "Code.exe"
versions = [{ block = "exe-version" }, { block = "json-value", file = "*/resources/app/product.json", key_path = ["version"] }]

# VS Code runs as `Code.exe` [disk].
[process]
images = ["Code.exe"]
paths = [
  "%LOCALAPPDATA%/Programs/Microsoft VS Code/Code.exe",
  "%ProgramFiles%/Microsoft VS Code/Code.exe",
]

# The default profile keeps its files in `%APPDATA%\Code\User` [docs].
# `--user-data-dir` and portable mode move them, which a home the user adds
# covers.
[[homes]]
id = "default"
default = true
folder = { block = "path", path = "%APPDATA%/Code/User" }

[homes.roots]
# The profile's MCP servers.
mcp = "mcp.json"
# The profile's settings.
settings = "settings.json"
# The profile's own state [docs, disk], such as which servers and skills
# are Disabled. A profile keeps its own even when it shares MCP servers
# [disk].
state = "globalStorage/state.vscdb"

# Every other profile, as `storage.json` lists it, keeps its files in
# `User\profiles\<location>` [docs, disk], the built-in Agents profile in
# `builtin\agents` [disk]. One whose `useDefaultFlags.mcp` is `true` reads
# the default profile's `mcp.json` [docs], so it is no home of its own.
[[homes]]
id = "profile"
folder = { block = "json-list", file = "%APPDATA%/Code/User/globalStorage/storage.json", key_path = ["userDataProfiles"], field = "location", base = "%APPDATA%/Code/User/profiles", unless = ["useDefaultFlags", "mcp"] }

[homes.roots]
mcp = "mcp.json"
settings = "settings.json"
state = "globalStorage/state.vscdb"

# The workspaces VS Code opened [disk], which every profile shares: a folder
# per workspace in `User\workspaceStorage`, whose `workspace.json` names its
# folder or its `.code-workspace` file, and the workspaces `storage.json`
# associates with a profile. Both spell them as URIs; a remote one is no
# Project here.
#
# `profileAssociations.workspaces` keeps one key per workspace, its
# `URI.toString()`: a folder's URI, or a `.code-workspace` file's [test].
# Its value is the id of the profile VS Code last opened the workspace in
# [test]. VS Code writes it on every window open and on every profile
# switch, one entry per workspace, and `--profile` overwrites it [docs]; an
# extension development window writes none [test]. A profile's id is the
# last segment of its `location` [docs], the whole `location` of a profile
# VS Code creates [test], and the default profile's `__default__profile__`
# [disk], which `userDataProfiles` never lists [docs]. The built-in Agents
# profile can never be associated: VS Code throws [docs]. A value naming no
# profile is skipped, and the next save drops it [docs]. That profile is
# the Project's Last-opened home: a profile that shares its MCP servers
# reads the default profile's [docs], so its Projects are last opened in
# `default`, under its name. Where VS Code opens a workspace with no entry, per
# `--profile`, then `window.newWindowProfile`, then the active window's
# profile, then Default, is not read: it says where the next open goes
# [docs].
[projects]
registries = [
  { block = "json-folders", anchor = { block = "machine", path = "%APPDATA%/Code/User/workspaceStorage" }, file = "workspace.json", fields = ["folder", "workspace"], spelling = "file-uri" },
  { block = "json-keys", anchor = { block = "machine", path = "%APPDATA%/Code/User/globalStorage/storage.json" }, root = ["profileAssociations", "workspaces"], spelling = "file-uri", last_opened = { named = { "__default__profile__" = "default" }, listed = "profile", name = "name", left_out = "default" } },
]
# A `.code-workspace` file VS Code opens is a Project of its own, with a
# collection in its `settings` and those of each of its folders [docs]. The
# first folder ranks highest [docs].
workspace_files = true

# Agent plugins, which VS Code keeps in `~\.vscode\agent-plugins` [disk].
# It reads the plugins the folder's `installed.json` lists, in
# `{"version": 1, "installed": [{"pluginUri", "marketplace", "name"}]}`,
# each `pluginUri` the `file:` URI of a plugin's folder, whatever its
# manifest: `plugin.json` at its root, in `.github\plugin`,
# `.claude-plugin` or `.plugin`, or none [test]. A plugin from a
# marketplace sits in VS Code's clone of it, `<host>\<owner>\<repo>` in
# this folder [binary], and a folder directly here that `installed.json`
# does not list is not read [test]. A plugin's id is its folder below this
# one, so two marketplaces' plugins of one name stay apart. A plugin is
# named by its manifest's `name`, or else by its folder. VS Code uninstalls
# one in the Extensions view. `chat.pluginLocations` in the user's settings
# adds plugins by their path [binary]; config-digger does not read it.
[[plugins]]
id = "agent-plugins"
unverified = "A plugin VS Code installs from a real marketplace is taken to sit in its clone `<host>\\<owner>\\<repo>` and be listed in `installed.json` as the probe laid one out by hand; installing one from a marketplace in the probe would test it."
registry = { block = "json-plugin-list", anchor = { block = "machine", path = "~/.vscode/agent-plugins/installed.json" }, list = ["installed"], folder = "pluginUri", spelling = "file-uri" }
name = [{ file = "plugin.json", key_path = ["name"] }, { file = ".github/plugin/plugin.json", key_path = ["name"] }, { file = ".claude-plugin/plugin.json", key_path = ["name"] }, { file = ".plugin/plugin.json", key_path = ["name"] }]

# The extensions that ship with each Installation, in its commit folder's
# `resources\app\extensions`, such as GitHub Copilot Chat in `copilot`
# [disk], each named by its manifest's `name`. The user cannot uninstall
# one. VS Code ranks them before the installed extensions, and each group
# by its folders' names, not by the extensions' ids: of two extensions'
# skills of one name, a built-in one's wins over an installed one's whose
# folder sorts first, and within each group the one whose folder sorts
# first [test]. VS Code loads one extension of an id: an installed
# extension with a built-in one's id takes its place when its version is
# higher, and is skipped when it is the same or lower [test]. Its CLI
# refuses to install a built-in extension's id while none of that id is
# installed [test], so such an extension is left when VS Code starts to
# ship one the user had installed. config-digger reads both (#432). GitHub
# Copilot Chat, which `product.json`'s
# `builtInExtensionsEnabledWithAutoUpdates` lets the user update, follows
# rules of its own in VS Code's scanner [binary], which #432 leaves
# untested. An Installation's folder holds one commit folder [disk]: one
# left over from an update would be read too.
[[plugins]]
id = "built-in-extensions"
registry = { block = "installation-folders", folder = "*/resources/app/extensions", marker = "package.json" }
name = { file = "package.json", key_path = ["name"] }

# The extensions installed in `~\.vscode\extensions`, a folder each [docs,
# disk], each named by its manifest's `name`. A folder is named by the
# extension's lowercased id and version [test], then its target platform,
# as `acme.helper-1.0.0-win32-x64` [binary], which is also how `.obsolete`
# names the folders VS Code is to delete, in a JSON object of `true`s, such
# as `{"acme.helper-0.9.0": true}` [test]. An update leaves the old
# version's folder, named there, until VS Code next starts and deletes both;
# such a folder holds no extension, VS Code loading the new version only
# [test]. VS Code lists the default
# profile's extensions in the folder's `extensions.json`, and adds there any
# folder it finds here [binary], so the folders are read instead.
[[plugins]]
id = "extensions"
registry = { block = "plugin-folders", anchor = { block = "machine", path = "~/.vscode/extensions" }, marker = "package.json", removals = ".obsolete" }
name = { file = "package.json", key_path = ["name"] }

[[scopes]]
id = "workspace-folder"

[[scopes]]
id = "workspace"

[[scopes]]
id = "user"

[[scopes]]
id = "plugin"

[[scopes]]
id = "extension"

[[scopes]]
id = "discovered"

# A setting the user leaves unset takes the value an ExP experiment assigned
# as `config.<setting>`, when VS Code marks the setting as one it runs
# experiments on, before its own default [docs]. VS Code caches the
# assignments in `memento/experiment.service.memento` of the store every
# profile reads, as tas-client's feature data, and reads them only while
# the telemetry level is `all` [binary]: a setting's from the `Parameters`
# of the item of `configs` whose `Id` is `vscode` [test]. It marks none of the settings
# this definition reads, `chat.mcp.access`, `chat.mcp.collisionBehavior`,
# `chat.mcp.discovery.enabled`, `chat.useAgentSkills` and
# `security.workspace.trust.enabled`: an assignment leaves them as they
# were [test], so the cache is not read.

# Each collection VS Code builds, lowest order first: `.vscode\mcp.json` (0),
# `.mcp.json` (1), a `.code-workspace` file's `settings.mcp` (100), the
# profile's `mcp.json` (200), extensions (300), agent plugins (350) and the
# configurations of other apps it discovers (400) [docs]. The remote user
# `mcp.json` (150) lives on the remote machine and is not read.
#
# VS Code's own files replace `${env:NAME}`, `${input:id}`, whose value the
# user types, `${workspaceFolder}` and `${userHome}` [docs]. `envFile` is the
# path of a file of variables, and shown.

# A workspace folder's `.vscode\mcp.json` [docs]. VS Code skips one it
# cannot parse, and leaves it as it is [test].
[[locations]]
id = "folder-mcp"
anchor = { block = "project", path = ".vscode/mcp.json" }
format = { block = "json", dialect = "jsonc" }
root = ["servers"]
kind = "mcp"
switch_id = "mcp.config.ws{folder_index}.{name}"
scope = "workspace-folder"
provenance = "file"
store_class = "plain"
interpolation = { block = "braces", namespaces = ["env", "input"], names = ["workspaceFolder", "userHome"] }
on_read_failure = "ignores_file"

# Claude Code's `.mcp.json` in a workspace folder, which VS Code reads under
# `mcpServers` or as a bare object of servers [docs]. VS Code takes every
# value as written: `${NAME}`, `${env:NAME}` and `$NAME` reach the server
# unchanged [test], so a `${NAME}` Claude Code replaces is a Secret to VS
# Code. It writes no reference there [docs]. It skips a `.mcp.json` it
# cannot parse [test]. It reads the file with
# `chat.mcp.workspaceRootConfig.enabled` off too [test]: that setting
# decides where VS Code adds a server [binary].
[[locations]]
id = "dot-mcp"
anchor = { block = "project", path = ".mcp.json" }
format = { block = "json", dialect = "jsonc" }
root = ["mcpServers"]
bare = true
kind = "mcp"
switch_id = "workspace-dot-mcp.{folder_index}.{name}"
scope = "workspace-folder"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

# A `.code-workspace` file's `settings.mcp` [docs]. VS Code skips these
# servers when the file does not parse, but still opens the file's folders
# and applies its other settings, read around the error [test].
# config-digger reads the file's folders and settings around the error too.
[[locations]]
id = "workspace-mcp"
unverified = "Of a `.code-workspace` file that does not parse, VS Code is taken to keep the folders and settings `node-jsonc-parser`'s code keeps around an error other than `,,`, the one the probe tests; a probe workspace file holding other errors would test it (#437)."
anchor = { block = "project-file" }
format = { block = "json", dialect = "jsonc" }
root = ["settings", "mcp", "servers"]
kind = "mcp"
switch_id = "mcp.config.workspace.{name}"
scope = "workspace"
provenance = "file"
store_class = "plain"
interpolation = { block = "braces", namespaces = ["env", "input"], names = ["workspaceFolder", "userHome"] }
# The setting `mcp.enterpriseManagedAuth.idp` holds the client Secret of
# the identity provider VS Code signs in to MCP servers with [disk], and a
# workspace's settings can hold it too, as one key or nested in `mcp`.
secrets.file_fields = [
  ["settings", "mcp.enterpriseManagedAuth.idp", "clientSecret"],
  ["settings", "mcp", "enterpriseManagedAuth", "idp", "clientSecret"],
]
on_read_failure = "ignores_file"

# The profile's `mcp.json` [docs]. VS Code rewrites it whole on every
# install or remove, dropping its comments, and deletes it once it holds
# nothing [docs]. It skips one it cannot parse, and leaves it as it is
# [test].
[[locations]]
id = "user-mcp"
anchor = { block = "home", root = "mcp" }
format = { block = "json", dialect = "jsonc" }
root = ["servers"]
kind = "mcp"
switch_id = "mcp.config.usrlocal.{name}"
scope = "user"
provenance = "file"
store_class = "rewritten-while-running"
interpolation = { block = "braces", namespaces = ["env", "input"], names = ["workspaceFolder", "userHome"] }
on_read_failure = "ignores_file"

# The servers an extension gives VS Code exist only while it runs [docs].
# VS Code caches the last ones each extension gave in the workspace's
# `state.vscdb`, under `mcp.extCachedServers`, as
# `{"<publisher.extension>/<provider>": {"servers": [...]}}`, each server
# with its `label` and its `launch` [docs, disk]. The cache can be stale.
# VS Code rebuilds a `state.vscdb` it cannot open from its backup [docs].
#
# A launch spells `env` as an object, `headers` as `[name, value]` pairs,
# `args` as an array, and `uri` as a URI object whose `authority`, `query`
# and `fragment` hold the URL's userinfo, query and fragment [test]. Unlike
# 1.129.1, 1.135.0 and later add `external`, the whole URL with the `=`
# and `&` of its query and fragment encoded [test]. So the env values, the header values and those
# four parts of the URI are Secrets, `external` whole since its query
# values cannot be told apart. Every arg is too: the rule that finds the
# Secrets in a server's `args` reads only an Entry's own `args`.
[[locations]]
id = "extension-mcp"
anchor = { block = "project-storage", path = "state.vscdb" }
format = { block = "sqlite-json", key = "mcp.extCachedServers" }
root = ["mcp.extCachedServers", "*", "servers"]
named_by = "label"
kind = "mcp"
switch_id = "{extension}/{name}"
scope = "extension"
provenance = "extension"
store_class = "sqlite"
secrets.fields = [
  ["launch", "env"],
  ["launch", "headers", "*", "1"],
  ["launch", "args"],
  ["launch", "uri", "external"],
  ["launch", "uri", "authority"],
  ["launch", "uri", "query"],
  ["launch", "uri", "fragment"],
]
on_read_failure = "ignores_file"
risks = ["agent_may_drop_entries"]

# An agent plugin's servers are in the `.mcp.json` at its root, whatever
# its manifest [test], and in the file a manifest's `mcpServers` names,
# which `plugin-manifest-mcp` reads. VS Code reads a `.mcp.json` it cannot
# parse around the error, and starts the servers it finds there [test].
[[locations]]
id = "plugin-mcp"
unverified = "Of a plugin `.mcp.json` that does not parse, VS Code is taken to keep what `node-jsonc-parser`'s code keeps around an error other than `,,`, the one the probe tests; a probe plugin whose `.mcp.json` holds other errors would test it (#437)."
anchor = { block = "plugin", plugins = "agent-plugins", path = ".mcp.json" }
format = { block = "json", dialect = "jsonc" }
root = ["mcpServers"]
bare = true
kind = "mcp"
switch_id = "plugin.{plugin_uri}.{name}"
scope = "plugin"
provenance = "plugin"
store_class = "plain"
on_read_failure = "reads_around_error"

# The servers of the file an agent plugin's root `plugin.json` names in
# `mcpServers`, such as `"./servers.json"`, which VS Code reads beside the
# plugin's `.mcp.json` [test]. Its manifest is the first of the four it
# has, as for its name. A server the two files both name ranks the
# `.mcp.json`'s first.
[[locations]]
id = "plugin-manifest-mcp"
unverified = [
  "A manifest in `.github/plugin`, `.claude-plugin` or `.plugin` is taken to name a file of servers in `mcpServers` as the root `plugin.json` does; the probe's `plugin-named` plugin with its manifest in each of those places would test it.",
  "An inline `mcpServers` object of a manifest, or a list of paths and objects, is taken to add its servers as a named file does; a probe plugin whose manifest holds one would test it.",
  "Of two servers of one name in a plugin's `.mcp.json` and the file its manifest names, the `.mcp.json`'s is taken to win; a probe plugin whose two files name one server, with `chat.mcp.collisionBehavior` at `disable`, would test it.",
]
anchor = { block = "plugin", plugins = "agent-plugins", path = ["plugin.json", ".github/plugin/plugin.json", ".claude-plugin/plugin.json", ".plugin/plugin.json"] }
references = { root = ["mcpServers"] }
format = { block = "json", dialect = "jsonc" }
root = ["mcpServers"]
kind = "mcp"
switch_id = "plugin.{plugin_uri}.{name}"
scope = "plugin"
provenance = "plugin"
store_class = "plain"
on_read_failure = "unknown"

# The configurations of other apps VS Code discovers, each only while its
# source is on in `chat.mcp.discovery.enabled`, and every source is off by
# default [disk]. Each is read in its own app's format [docs].
#
# VS Code reads the setting as it reads `chat.mcp.collisionBehavior`, for
# the window [binary]. A folder opened alone reads its own
# `.vscode\settings.json`, over the user's [test]. A workspace file reads
# its own `settings`, over the user's, and never the `.vscode\settings.json`
# of its folders [test]; nor does config-digger, whose `project` anchor in
# a setting source is read in a folder Project only.
[[locations]]
id = "claude-desktop-mcp"
anchor = { block = "machine", path = "%APPDATA%/Claude/claude_desktop_config.json" }
format = { block = "json", dialect = "jsonc" }
root = ["mcpServers"]
kind = "mcp"
switch_id = "claude-desktop.null.{name}"
scope = "discovered"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

[[locations.when]]
block = "setting"
equals = true
default = false
sources = [
  { anchor = { block = "project", path = ".vscode/settings.json" }, key_path = ["chat.mcp.discovery.enabled", "claude-desktop"], dialect = "jsonc" },
  { anchor = { block = "project-file" }, key_path = ["settings", "chat.mcp.discovery.enabled", "claude-desktop"], dialect = "jsonc", on_read_failure = "reads_around_error" },
  { anchor = { block = "home", root = "settings" }, key_path = ["chat.mcp.discovery.enabled", "claude-desktop"], dialect = "jsonc" },
]

[[locations]]
id = "cursor-workspace-mcp"
anchor = { block = "project", path = ".cursor/mcp.json" }
format = { block = "json", dialect = "jsonc" }
root = ["mcpServers"]
kind = "mcp"
switch_id = "cursor-workspace.{folder_index}.{name}"
scope = "discovered"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

[[locations.when]]
block = "setting"
equals = true
default = false
sources = [
  { anchor = { block = "project", path = ".vscode/settings.json" }, key_path = ["chat.mcp.discovery.enabled", "cursor-workspace"], dialect = "jsonc" },
  { anchor = { block = "project-file" }, key_path = ["settings", "chat.mcp.discovery.enabled", "cursor-workspace"], dialect = "jsonc", on_read_failure = "reads_around_error" },
  { anchor = { block = "home", root = "settings" }, key_path = ["chat.mcp.discovery.enabled", "cursor-workspace"], dialect = "jsonc" },
]

[[locations]]
id = "cursor-global-mcp"
anchor = { block = "machine", path = "~/.cursor/mcp.json" }
format = { block = "json", dialect = "jsonc" }
root = ["mcpServers"]
kind = "mcp"
switch_id = "cursor.null.{name}"
scope = "discovered"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

[[locations.when]]
block = "setting"
equals = true
default = false
sources = [
  { anchor = { block = "project", path = ".vscode/settings.json" }, key_path = ["chat.mcp.discovery.enabled", "cursor-global"], dialect = "jsonc" },
  { anchor = { block = "project-file" }, key_path = ["settings", "chat.mcp.discovery.enabled", "cursor-global"], dialect = "jsonc", on_read_failure = "reads_around_error" },
  { anchor = { block = "home", root = "settings" }, key_path = ["chat.mcp.discovery.enabled", "cursor-global"], dialect = "jsonc" },
]

[[locations]]
id = "windsurf-mcp"
anchor = { block = "machine", path = "~/.codeium/windsurf/mcp_config.json" }
format = { block = "json", dialect = "jsonc" }
root = ["mcpServers"]
kind = "mcp"
switch_id = "windsurf.null.{name}"
scope = "discovered"
provenance = "file"
store_class = "plain"
on_read_failure = "ignores_file"

[[locations.when]]
block = "setting"
equals = true
default = false
sources = [
  { anchor = { block = "project", path = ".vscode/settings.json" }, key_path = ["chat.mcp.discovery.enabled", "windsurf"], dialect = "jsonc" },
  { anchor = { block = "project-file" }, key_path = ["settings", "chat.mcp.discovery.enabled", "windsurf"], dialect = "jsonc", on_read_failure = "reads_around_error" },
  { anchor = { block = "home", root = "settings" }, key_path = ["chat.mcp.discovery.enabled", "windsurf"], dialect = "jsonc" },
]

# Nothing is merged: each Entry is a server of its own [docs]. While
# `chat.mcp.collisionBehavior` is `"disable"`, the default, servers whose
# names match without regard to case form a group, and VS Code leaves every
# one but the first of the lowest-order collection off [docs]. With
# `"suffix"` every one of them runs, its tools numbered apart [docs].
# A resource setting ranks a folder's over a workspace file's over the
# user's [docs], but VS Code reads `chat.mcp.collisionBehavior` for the
# window, as it reads `chat.mcp.discovery.enabled` (see
# `claude-desktop-mcp`), so a workspace file's member folders set neither
# [binary].
# For a profile that shares the default profile's settings, its own
# `settings.json` is read all the same.
[items.mcp]
precedence = ["folder-mcp", "dot-mcp", "workspace-mcp", "user-mcp", "extension-mcp", "plugin-mcp", "plugin-manifest-mcp", "claude-desktop-mcp", "cursor-workspace-mcp", "cursor-global-mcp", "windsurf-mcp"]
checks = ["rules", "disable", "precedence", "trust", "approval"]

[items.mcp.competition]
block = "case-insensitive-name"

[items.mcp.competition.only_while]
equals = "disable"
default = "disable"
sources = [
  { anchor = { block = "project", path = ".vscode/settings.json" }, key_path = ["chat.mcp.collisionBehavior"], dialect = "jsonc" },
  { anchor = { block = "project-file" }, key_path = ["settings", "chat.mcp.collisionBehavior"], dialect = "jsonc", on_read_failure = "reads_around_error" },
  { anchor = { block = "home", root = "settings" }, key_path = ["chat.mcp.collisionBehavior"], dialect = "jsonc" },
]

# `chat.mcp.access` lets every server run (`"all"`, the default), none
# (`"none"`), or only those installed from the registry (`"registry"`),
# which VS Code then reads from the profile's `mcp.json` alone [docs]. That
# an installed server must also match the registry is not checked. An
# account's policy replaces the user's value [docs]: VS Code caches the
# policy it fetched in `defaultAccount.cachedPolicyData` of the store every
# profile reads, and reads `policyData.mcp: false` as `"none"` and
# `policyData.mcpAccess: "registry_only"` as `"registry"`, leaving the
# setting to the user otherwise [docs]. config-digger never writes either.
#
# Each part of the policy is as old as the request that brought it, whose
# time VS Code caches beside it: `mcp` comes with the Copilot token's
# entitlements, `tokenEntitlementsFetchedAt`, and `mcpAccess` with the MCP
# registry's data, `mcpRegistryDataFetchedAt`, which VS Code asks for only
# while `mcp` is not `false` [binary]. It fetches the account's
# entitlements, `entitlementsFetchedAt`, again at each start, but keeps
# the other two times from an earlier launch [test], until they are an
# hour old [binary].
[[items.mcp.rules]]
block = "global-switch"
