on_read_failure = "ignores_file"

# An agent plugin's skills, in its `skills` folder [docs].
[[locations]]
id = "plugin-skills"
anchor = { block = "plugin", plugins = "agent-plugins", path = "skills" }
format = { block = "skill-folder", name_from = "folder", no_frontmatter = "folder-name", malformed_frontmatter = "skip", no_name = "folder-name" }
kind = "skill"
switch_id = "{uri_path}/SKILL.md"
scope = "plugin"
provenance = "plugin"
store_class = "plain"
on_read_failure = "ignores_file"

# The skills an extension contributes in its `package.json`'s
# `contributes.chatSkills`, each a path to a skill folder or its `SKILL.md`
# [disk].
[[locations]]
id = "extension-skills"
anchor = { block = "plugin", plugins = "extensions", path = "package.json" }
format = { block = "skill-list", list = ["contributes", "chatSkills"], field = "path", skills = { name_from = "folder", no_frontmatter = "folder-name", malformed_frontmatter = "skip", no_name = "folder-name" } }
kind = "skill"
switch_id = "{uri_path}/SKILL.md"
scope = "extension"
provenance = "extension"
store_class = "plain"
on_read_failure = "ignores_file"

# The first skill of a name wins: workspace, then personal, then plugin,
# then extension [docs].
[items.skill]
precedence = ["folder-agents-skills", "folder-github-skills", "folder-claude-skills", "user-agents-skills", "user-copilot-skills", "user-claude-skills", "plugin-skills", "extension-skills"]
competition = { block = "exact-name" }
checks = ["frontmatter", "rules", "disable", "precedence"]

# VS Code turns a skill off in the profile's `chat.disabledPromptFiles.skill`,
# the JSON text of a list of the URIs of the `SKILL.md` files it skips, each
# as VS Code writes a URI: an object whose `path` is the file's, with its
# drive as the folder spells it, compared without regard to case [docs].
# Disable adds a URI with its scheme and path only, which is how VS Code
# reads one back [docs]. Enable takes it out. Which file the URI names, and
# that a skill VS Code lists there is kept from the model too, come from VS
# Code's source only, so they are unverified until the release gate
# confirms them.
[[items.skill.disable]]
block = "json-item-list"
switch = { anchor = { block = "home", root = "state" }, key_path = ["chat.disabledPromptFiles.skill", "{name}"], named_by = "path", store_class = "sqlite" }
target = "entry"
context = "all"
enable_action = "remove-item"
disabled_item = { "$mid" = 1, scheme = "file", path = "{name}" }
ignore_case = true
reason = "disabled_natively"

# `chat.useAgentSkills: false` turns every skill off [docs].
[[items.skill.rules]]
block = "global-switch"
off = false
sources = [
  { anchor = { block = "home", root = "settings" }, key_path = ["chat.useAgentSkills"], dialect = "jsonc" },
  { anchor = { block = "machine", path = "%APPDATA%/Code/User/globalStorage/state.vscdb" }, key_path = ["memento/experiment.service.memento", "VSCode.ABExp.FeatureData", "configs", "0", "Parameters", "config.chat.useAgentSkills"], sqlite = true },
]
