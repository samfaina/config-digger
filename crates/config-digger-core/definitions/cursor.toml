# The skills of one of Cursor's own plugins, where its first manifest's
# `skills` says, or else in its `skills` folder [docs, code]: a path is a
# folder of skills, and an item of a list is one skill's folder, or its
# `SKILL.md`, when it holds one, and otherwise a folder of skills; any other
# value declares none [code]. Without either, Cursor takes a `SKILL.md` at
# the plugin's root as its skill [code], which is not read. Past a manifest
# that does not parse, or that it rejects for its `mcpServers`, as
# `cursor-plugin-manifest-mcp` says, Cursor reads the next manifest's
# skills, or those of the `skills` folder when there is no next manifest
# [test], as `reads_next_path` does.
[[locations]]
id = "cursor-plugin-skills"
anchor = { block = "plugin", plugins = ["project", "local"], path = [".cursor-plugin/plugin.json", ".claude-plugin/plugin.json", "plugin.json"] }
format = { block = "manifest-skills", field = ["skills"], default = "skills", skills = { recursive = true, name_from = "folder", no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name", unlisted = ["no-description", "malformed-frontmatter"] } }
kind = "skill"
scope = "plugin"
provenance = "plugin"
store_class = "plain"
on_read_failure = "reads_next_path"
rejected_unless_path_object_or_list = [["mcpServers"]]

# A Claude Code plugin's skills, in its `skills` folder [docs, disk]. A
# folder its manifest names in `skills` instead [docs] is not read.
[[locations]]
id = "claude-plugin-skills"
anchor = { block = "plugin", plugins = "claude-code", path = "skills" }
format = { block = "skill-folder", recursive = true, name_from = "folder", no_frontmatter = "folder-name", malformed_frontmatter = "folder-name", no_name = "folder-name", unlisted = ["no-description", "malformed-frontmatter"] }
kind = "skill"
scope = "plugin"
provenance = "plugin"
store_class = "plain"
on_read_failure = "ignores_file"

# Skills are not overridden by name [code]. Two compete only when they lie
# at the same path below their `.cursor`, `.claude`, `.codex`, `.grok` or
# `.agents` folder, whatever folder holds it, such as `~\.claude\skills\review`,
# `~\.agents\skills\review` and a Project's `.cursor\skills\review`; the
# first in this order wins, a user's skill over a Project's [test]. A nested
# skill wins over both [test]. Of two nested ones, the one whose folder
# holding the marker comes first by path wins, whatever their markers,
# `x\.agents\skills\k` over `y\.cursor\skills\k`, and by path, not by depth,
# `a\b\c\.cursor\skills\k` over `b\.cursor\skills\k`; of one folder's, the
# first marker in the order above [test]. So the five nested locations are
# one group of `precedence`. Its folders compare name by name from the
# root down, case aside, which puts `a\b\` before `a-b\`, as Cursor does:
# `a\b\.cursor\skills\k` wins over `a-b\.cursor\skills\k` [test].
#
# Cursor lists a `SKILL.md` without a frontmatter, one whose YAML does not
# parse or never closes, under its folder's name in the `/` menu, where the
# user can pick it [test]; every location's skills are read by the same
# code [code]. Its Customize page marks such a skill "Error parsing skill",
# as it does one with no `description` [test], and Cursor leaves those out
# of the skills its model gets [code]. The user can still run such a skill,
# which keeps its State with an `unlisted` note: every location but the
# built-in one lists `no-description`, for a `SKILL.md` with no frontmatter
# or a YAML one without the key, and `malformed-frontmatter`, for one
# config-digger reads as malformed. The probe never checked a skill with
# `disable-model-invocation: true`, which gets no note. Two skills of one
# name at different paths are both listed under `/name`, and the user picks
# one, which Cursor records by its path below `skills` [test]. Enter takes
# the first listed: a user's skill before a Project's until one is picked,
# after which the order follows that record, which can match either path
# [test].
[items.skill]
precedence = [["nested-cursor-skills", "nested-claude-skills", "nested-codex-skills", "nested-grok-skills", "nested-agents-skills"], "user-cursor-skills", "user-claude-skills", "user-codex-skills", "user-grok-skills", "user-agents-skills", "built-in-skills", "project-cursor-skills", "project-claude-skills", "project-codex-skills", "project-grok-skills", "project-agents-skills", "cursor-plugin-skills", "claude-plugin-skills"]
competition = { block = "path-key", markers = [".cursor", ".claude", ".codex", ".grok", ".agents"] }
checks = ["frontmatter", "rules", "disable", "precedence"]

# Cursor has no switch for one skill [docs, code]: config-digger parks the
# folder of one it Disables in its own store, and puts it back on Enable.
# A skill in a git-versioned folder is never parked, so it has no Disable.
# Parking a skill of another Agent's folder takes it from that Agent too.
[[items.skill.disable]]
block = "park"
locations = ["user-cursor-skills", "user-claude-skills", "user-codex-skills", "user-grok-skills", "user-agents-skills", "project-cursor-skills", "project-claude-skills", "project-codex-skills", "project-grok-skills", "project-agents-skills", "nested-cursor-skills", "nested-claude-skills", "nested-codex-skills", "nested-grok-skills", "nested-agents-skills"]

# The `enabled` of a Project's plugin, as for servers above.
[[items.skill.disable]]
block = "json-field"
switch = { anchor = { block = "project", path = ".cursor/settings.json" }, key_path = ["plugins", "{plugin_id}", "enabled"], store_class = "plain", dialect = "jsonc" }
target = "plugin"
context = "project"
enable_action = "set"
enabled_value = true
disabled_value = false
default_value = false
reason = "plugin_disabled"
locations = ["cursor-plugin-skills"]
plugin_scopes = ["project"]

