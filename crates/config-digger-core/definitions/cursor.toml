# Cursor caches the Statsig gates of the signed-in account in the
# application's state, under `workbench.experiments.statsigBootstrap`, each
# by the djb2 hash of its name, and when it fetched them in milliseconds
# [disk]. Without that cache, signed out, Cursor takes a gate's default from
# its code [code]: the three below are on by default in 3.27.12 [test], and
# were on for the owner's account, in no team [test]. Claude Code plugins'
# servers load only while `enable_cc_plugin_import` is on [test].
[[feature_gates]]
name = "enable_cc_plugin_import"
assumed = true
affects = ["claude-plugin-manifest-mcp", "claude-plugin-mcp"]
lookup = { block = "sqlite-json", anchor = { block = "home", root = "state" }, key = "workbench.experiments.statsigBootstrap", key_path = ["feature_gates", "{gate}", "value"], hash = "djb2", cached_at = ["time"] }

# Servers with the same URL collapse while `dedupe_mcp_servers` is on
# [test].
[[feature_gates]]
name = "dedupe_mcp_servers"
assumed = true
affects = ["user-mcp", "cursor-plugin-manifest-mcp", "cursor-plugin-mcp", "claude-plugin-manifest-mcp", "claude-plugin-mcp"]
lookup = { block = "sqlite-json", anchor = { block = "home", root = "state" }, key = "workbench.experiments.statsigBootstrap", key_path = ["feature_gates", "{gate}", "value"], hash = "djb2", cached_at = ["time"] }

# Servers outside Projects are Disabled in the profile's store while
# `mcp_profile_scoped_global_disabled_state` is on [test].
[[feature_gates]]
name = "mcp_profile_scoped_global_disabled_state"
assumed = true
affects = ["user-mcp", "cursor-plugin-manifest-mcp", "cursor-plugin-mcp", "claude-plugin-manifest-mcp", "claude-plugin-mcp"]
lookup = { block = "sqlite-json", anchor = { block = "home", root = "state" }, key = "workbench.experiments.statsigBootstrap", key_path = ["feature_gates", "{gate}", "value"], hash = "djb2", cached_at = ["time"] }

# Settings > Agents > Include Third-Party Plugins, Skills, and Other Configs,
# `cursor/thirdPartyExtensibilityEnabled` in the application's state, on
# unless it holds `false` [docs, code]. Off, Cursor reads none of the skills
# folders of Claude Code, Codex and Grok, nor any Claude Code plugin [code],
# so the next folder's skill at the same path wins. config-digger never
# turns it on.
[[items.mcp.rules]]
block = "global-switch"
off = false
locations = ["claude-plugin-manifest-mcp", "claude-plugin-mcp"]
sources = [
  { anchor = { block = "home", root = "state" }, key_path = ["cursor/thirdPartyExtensibilityEnabled"], sqlite = true },
]

[[items.skill.rules]]
block = "global-switch"
off = false
locations = ["user-claude-skills", "user-codex-skills", "user-grok-skills", "project-claude-skills", "project-codex-skills", "project-grok-skills", "nested-claude-skills", "nested-codex-skills", "nested-grok-skills", "claude-plugin-skills"]
sources = [
  { anchor = { block = "home", root = "state" }, key_path = ["cursor/thirdPartyExtensibilityEnabled"], sqlite = true },
]
