name: Release

# Each `vX.Y.Z` tag publishes a GitHub release with the per-user NSIS
# installer, its updater signature (`.sig`) and the updater manifest
# `latest.json`, the CLI-only zip, `SHA256SUMS` and GitHub artifact
# attestations. No release ships without the updater's signature and
# manifest: the run fails before the release is created. The installer is
# signed with the minisign key in the `TAURI_SIGNING_PRIVATE_KEY` secret.
# `vX.Y.Z-rc.N` tags are published as prereleases, never marked latest, so
# the app's updater, which reads `releases/latest`, never sees them. The tag
# must be the workspace version, which is the one version of every crate.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/config-digger-app/ui/package-lock.json
      - name: Tag is the workspace version
        id: release
        shell: bash
        run: cargo xtask release "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - name: The updater signing key is set
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::the TAURI_SIGNING_PRIVATE_KEY secret is not set: no release ships without the updater signature"
            exit 1
          fi
      - name: Build the installer and the CLI
        working-directory: crates/config-digger-app/ui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npm run tauri -- build --config tauri.bundle.conf.json
      - name: Collect the installer, its updater signature and the CLI zip
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "target/release/bundle/nsis/config-digger_${env:VERSION}_x64-setup.exe" dist/
          Copy-Item "target/release/bundle/nsis/config-digger_${env:VERSION}_x64-setup.exe.sig" dist/
          Compress-Archive -Path target/release/config-digger.exe -DestinationPath "dist/config-digger_${env:VERSION}_x64-cli.zip"
      - name: Updater manifest
        shell: bash
        run: cargo xtask updater "$GITHUB_REF_NAME" dist
      - name: Checksums
        run: cargo xtask checksums dist
      - name: Every asset is there
        shell: bash
        run: cargo xtask assets "$GITHUB_REF_NAME" dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip
      - name: winget manifest
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: cargo xtask winget "$GITHUB_REF_NAME" "dist/config-digger_${VERSION}_x64-setup.exe" winget
      - name: Upload the winget manifest
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifest
          path: winget/
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          flags=(--latest)
          if [ "$PRERELEASE" = "true" ]; then flags=(--prerelease --latest=false); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "config-digger $VERSION" --generate-notes "${flags[@]}"
