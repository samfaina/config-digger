name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/config-digger-app/ui/package-lock.json
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: JSON Schema is current
        run: cargo xtask schema --check
      - name: Built-in definitions are valid
        run: cargo xtask definitions
      - name: Installer folder is no data folder
        run: cargo xtask installer
      - name: Git ignores no fixture file
        run: cargo xtask fixtures
      - name: TypeScript bindings are current
        run: cargo xtask bindings --check
      - name: UI typecheck, tests and build
        working-directory: crates/config-digger-app/ui
        run: |
          npm ci
          npm test
          npm run build
