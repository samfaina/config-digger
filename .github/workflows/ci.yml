name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/config-digger-app/ui/package-lock.json
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Release CLI
        run: cargo build --release --package config-digger-cli --locked
      # The tests built the debug CLI.
      - name: The CLI imports no VC++ runtime
        shell: bash
        run: |
          cargo xtask vcruntime target/debug/config-digger.exe
          cargo xtask vcruntime target/release/config-digger.exe
      - name: JSON Schema is current
        run: cargo xtask schema --check
      - name: Built-in definitions are valid
        run: cargo xtask definitions
      - name: Installer folder is no data folder
        run: cargo xtask installer
      - name: Git ignores no fixture file
        run: cargo xtask fixtures
      - name: TypeScript bindings are current
        run: cargo xtask bindings --check
      - name: UAT runner and walk logic
        run: node --test uat/runner.test.mjs uat/auto/webdriver/walk.test.mjs uat/auto/webdriver/judge.test.mjs uat/auto/local.test.mjs uat/auto/sandbox/sandbox.test.mjs
      - name: UI typecheck, tests and build
        working-directory: crates/config-digger-app/ui
        run: |
          npm ci
          npm test
          npm run build

  # The UAT steps the UI on the fake backend can show, one Playwright test
  # each, in a headless Edge. A PR that breaks one fails here, without a
  # release build.
  uat-fake-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/config-digger-app/ui/package-lock.json
      # The dev server runs cargo metadata for About's licenses while it
      # serves the page: on a cold runner its download of the crates held
      # the page for more than a test's 30 s.
      - name: Fetch the crates
        run: cargo fetch --locked --target x86_64-pc-windows-msvc
      - name: UAT steps on the fake backend
        working-directory: crates/config-digger-app/ui
        run: |
          npm ci
          npm run uat:fake
      # The results only: the tests take no screenshot, and the repo is public.
      - name: Upload the UAT results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: uat-results
          path: crates/config-digger-app/ui/uat-results.json
          if-no-files-found: error

  # The WebDriver walk on the release build, built as a release builds it,
  # with no screenshot: the repo is public. Its verdicts are a report: a
  # step's KO or Blocked leaves the job green, and only the walk breaking
  # turns it red: the build, the setup or the driver failing, tauri-driver
  # stopping during the walk, the walk stopping before its last step, or a
  # write outside the throwaway root and profile.
  uat-webdriver:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/config-digger-app/ui/package-lock.json
      # cargo app-release embeds ui/dist, which cargo builds nothing of.
      - name: Build the UI
        working-directory: crates/config-digger-app/ui
        run: |
          npm ci
          npm run build
      # Steps 14.2 and 14.3 run the CLI next to the app.
      - name: Release app and CLI
        run: |
          cargo app-release --locked
          cargo build --release --package config-digger-cli --locked
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      # The plan's paths are E:\cd-throwaway, on a real volume: the app
      # resolves a subst drive to its target folder (#388, #398).
      - name: Mount a volume at E
        run: |
          $ErrorActionPreference = "Stop"
          if ([System.IO.DriveInfo]::GetDrives().Name -contains "E:\") { throw "E: is taken on this runner" }
          $vhdx = "$env:RUNNER_TEMP\e-drive.vhdx"
          $script = "$env:RUNNER_TEMP\e-drive.diskpart"
          Set-Content $script @(
            "create vdisk file=`"$vhdx`" maximum=4096 type=expandable"
            "select vdisk file=`"$vhdx`""
            "attach vdisk"
            "convert mbr"
            "create partition primary"
            "format fs=ntfs quick label=cd-uat"
            "assign letter=E"
          )
          diskpart /s $script
          if ($LASTEXITCODE) { throw "diskpart failed with exit code $LASTEXITCODE" }
          $volume = Get-Volume -DriveLetter E
          if ($volume.FileSystem -ne "NTFS") { throw "E: is not the NTFS volume diskpart made" }
          "E: is the volume of $vhdx, $([math]::Round($volume.SizeRemaining / 1GB, 1)) GB free"
      # The UI's prefers-reduced-motion rules turn the motion off when
      # Windows' animation effects are off, which WebView2 reads from
      # SPI_GETCLIENTAREAANIMATION when the app starts.
      - name: Turn on animation effects
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -Namespace Win32 -Name Spi -MemberDefinition @"
          [DllImport("user32.dll", SetLastError = true)]
          public static extern bool SystemParametersInfo(uint action, uint param, ref bool value, uint flags);
          [DllImport("user32.dll", SetLastError = true)]
          public static extern bool SystemParametersInfo(uint action, uint param, IntPtr value, uint flags);
          "@
          function Animations { $on = $false; if (-not [Win32.Spi]::SystemParametersInfo(0x1042, 0, [ref]$on, 0)) { throw "SPI_GETCLIENTAREAANIMATION failed" }; $on }
          $found = Animations
          # SPI_SETCLIENTAREAANIMATION, SPIF_UPDATEINIFILE.
          if (-not $found -and -not [Win32.Spi]::SystemParametersInfo(0x1043, 0, [IntPtr]1, 1)) { throw "SPI_SETCLIENTAREAANIMATION failed" }
          if (-not (Animations)) { throw "Windows' animation effects are still off" }
          $line = "Windows' animation effects were $(if ($found) { 'on' } else { 'off, and the job turned them on' }) before the walk."
          $line
          "$line`n" >> $env:GITHUB_STEP_SUMMARY
      - name: WebDriver walk
        run: >-
          .\uat\auto\webdriver\run.ps1 -App target\release\config-digger-app.exe -Work "$env:RUNNER_TEMP\uat" -Ci
          -Evidence "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          -Summary $env:GITHUB_STEP_SUMMARY
      # The results only: the walk takes no screenshot on CI.
      - name: Upload the WebDriver results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: uat-webdriver-results
          path: ${{ runner.temp }}/uat/uat-results.json
          if-no-files-found: error
