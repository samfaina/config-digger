[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/samfaina/config-digger"

[workspace.dependencies]
config-digger-core = { path = "crates/config-digger-core" }
anstream = "1.0"
anstyle = "1.0"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
humantime = "2.4"
# Pre-1.0, and its CST API changes between minor releases: upgrade deliberately.
jsonc-parser = { version = "=0.34.0", features = ["cst", "serde", "serde_json"] }
# The Windows picker for folders and files. Windows only, so no default
# (Linux portal) feature is needed.
rfd = { version = "0.16", default-features = false }
# SQLite stores such as `state.vscdb`, read-only. Bundled, so no system
# library is needed.
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
similar = "3.2"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.12"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tauri = "2.12"
tauri-build = "2.7"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tempfile = "3.27"
terminal_size = "0.4"
thiserror = "2.0"
toml = "1.1"
toml_edit = "0.25.15"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
winreg = "0.56"

[workspace.lints.rust]
unsafe_code = "forbid"
