<!doctype html>
<!--
  PROTOTYPE — throwaway. Answers ticket #36 "Projects & homes, Settings and About screens".
  Built on prototypes/disable-remove-flow with its chosen flow (A, one dialog). Adds the rail's other screens:
  Projects & homes (two tabs), Settings and About, plus the inventory's empty state when no Agent is found.
  Switch screens from the rail, the bottom bar or ←/→ (?view=inv|projects|homes|history|settings|about).
  Deep links: &leftovers=g (Remove leftovers dialog), &empty=1 (no Agent found), &dlg=addHome|addProject|licenses.
  The white pill at the top fakes running Agents, a file changing under the preview, and a machine with no Agent.
  Data is fictional; paths, mechanisms and rules come from the research branches and the resolved tickets. Nothing touches the disk.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>config-digger — secondary screens prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* F — A's layout in a time-tracker-style shell, with the MISTY style guide: #7D67CB / #16171B / #FFFFFF / #8B8C8F,
   Cera Pro (Outfit stand-in), solid icons */
body.vF .top{display:none}
body.vF{overflow:hidden}
.F{--f-bg:#16171B;--f-pan:#1d1e23;--f-tile:#24252b;--f-tile2:#2c2d35;--f-line:#33343c;--f-acc:#7D67CB;--f-acc2:#957fe0;--f-dim:#8B8C8F;--f-faint:#5e5f66;
  flex:1;display:flex;flex-direction:row;min-height:0;min-width:0;background:var(--f-bg);font-family:Outfit,"Segoe UI",sans-serif;font-size:13px;padding:0 10px 10px 0;color:#fff}
.F svg.i{width:18px;height:18px;fill:currentColor;flex:none;display:block}
.F svg.i.s{width:15px;height:15px}
.F-title{display:flex;align-items:center;justify-content:flex-end;height:34px;padding:0 6px;color:var(--f-dim)}
.F-title .wb{width:34px;display:grid;place-items:center;color:var(--f-dim)}
.F-shell{flex:1;display:flex;min-height:0;min-width:0;gap:10px}
.F-rail{width:76px;background:#1b1c21;border-radius:18px;display:flex;flex-direction:column;align-items:center;padding:22px 0 18px;margin:10px 0 0 10px;flex:none}
.F-logo{font-weight:800;font-size:22px;letter-spacing:-.06em;color:var(--f-acc);line-height:1}
.F-rb{width:48px;height:48px;border-radius:50%;background:#25262d;display:grid;place-items:center;color:var(--f-dim);cursor:pointer;flex:none}
.F-grp2{width:48px;border-radius:999px;background:#25262d;display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;margin-top:12px}
.F-grp2 .F-rb{background:transparent}
.F-rb:hover{color:#fff}.F-rb.sel{color:var(--f-acc)}
.F-rail .sp{flex:1}.F-rail .sp2{flex:1.6}
.F-main{margin-left:10px;flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.F-col{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.F-pan{background:var(--f-pan);border-radius:16px;padding:14px;min-height:0;min-width:0;overflow:hidden;display:flex;flex-direction:column}
.F-pan>.h{display:flex;align-items:center;gap:8px;font-weight:500;font-size:14.5px;margin-bottom:12px}
.F-pan>.h .q{width:16px;height:16px;border-radius:50%;border:1px solid var(--f-faint);color:var(--f-faint);font-size:10px;display:grid;place-items:center;cursor:help}
.F-pan>.h .sp{flex:1}
.F-hero{background:radial-gradient(600px 200px at 0% 0%,#7D67CB66,transparent 70%),linear-gradient(100deg,#3a3060,#25222f 55%,#1d1e23);flex-direction:row;align-items:center;gap:30px;padding:14px 20px}
.F-ring{position:relative;width:74px;height:74px;flex:none}
.F-ring svg{transform:rotate(-90deg)}
.F-ring .c{position:absolute;inset:14px;border-radius:50%;background:var(--f-acc);display:grid;place-items:center;font-weight:700;font-size:14px;box-shadow:0 0 0 6px #7D67CB33}
.F-k{color:#bdb6d8;font-size:12px}
.F-big{font-size:28px;font-weight:700;letter-spacing:-.01em}
.F-v{font-size:15px;font-weight:500;margin-top:4px}
.F-hero select{background:transparent;border:0;color:#fff;font:500 15px Outfit,"Segoe UI",sans-serif;padding:0;margin-top:4px;cursor:pointer}
.F select option,.F select optgroup{background:var(--f-pan);color:#fff}
.F-hero .sp{flex:1}
.F-cta{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:999px;padding:8px 16px;font:700 11px Outfit,"Segoe UI",sans-serif;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;color:#fff;background:var(--f-acc);box-shadow:0 4px 14px #7D67CB44}
.F-cta:hover{background:var(--f-acc2)}
.F-cta.sec{background:#34353f;box-shadow:none}.F-cta.sec:hover{background:#40414c}
.F-cta.danger{background:#3a2328;color:#ffb4b4;box-shadow:none}.F-cta.danger:hover{background:#4a2a31}
.F-cta[disabled]{background:#26272d;color:var(--f-faint);box-shadow:none;cursor:not-allowed}
.F-scroll{overflow:auto;min-height:0;min-width:0;flex:1;margin-right:-6px;padding-right:6px;display:flex;flex-direction:column;gap:6px}
.F-ag{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:var(--f-tile);cursor:pointer}
.F-ag:hover{background:var(--f-tile2)}
.F-ag.sel{background:linear-gradient(100deg,#7D67CB,#5d4c9e);box-shadow:0 4px 16px #7D67CB33}
.F-ag .grip{color:var(--f-faint);letter-spacing:-2px}
.F-ag .nm{flex:1;font-weight:500;font-size:13.5px;display:flex;align-items:center;gap:6px}
.F-ag .rt{text-align:right;font-size:11.5px;color:var(--f-dim);line-height:1.45}
.F-ag.sel .rt{color:#e3dcff}
.F-ag .warn{color:#f87171}
.F-ag.all{margin-bottom:4px}
.F-bar{display:grid;grid-template-columns:80px 1fr;align-items:end;gap:10px;margin:7px 0;cursor:pointer;color:var(--f-dim)}
.F-bar:hover .lbl,.F-bar.on .lbl{color:#fff}
.F-bar .tr{position:relative;height:3px;background:#ffffff14;border-radius:2px;margin-bottom:5px}
.F-bar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.F-bar .n{position:absolute;right:0;bottom:7px;font-size:12px;color:#fff}
.F-bar.on .tr{box-shadow:0 0 0 1px var(--f-acc2)}
.F-hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--f-tile);border-radius:12px;padding:7px 12px}
.F-hrow select{background:transparent;border:0;color:#fff;font:500 12.5px Outfit,sans-serif;max-width:170px}
.F-hsub{color:var(--f-faint);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin:6px 2px 2px}
.F-search{display:flex;align-items:center;gap:8px;background:var(--f-tile);border-radius:999px;padding:7px 14px;color:var(--f-dim);margin-bottom:10px}
.F-search input{flex:1;background:transparent;border:0;color:#fff;font:13px Outfit,"Segoe UI",sans-serif;outline:none;padding:0}
.F-seg{display:inline-flex;background:var(--f-tile);border-radius:999px;padding:3px;gap:2px}
.F-seg button{background:transparent;border:0;border-radius:999px;padding:3px 12px;color:var(--f-dim);font:500 12px Outfit,sans-serif}
.F-seg button.on{background:var(--f-acc);color:#fff}
.F-grp{display:flex;align-items:center;gap:8px;color:var(--f-dim);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:10px 2px 2px}
.F-grp .ln{flex:1;height:1px;background:var(--f-line)}
.F-grp .warn{color:#f87171}
.F-row{min-width:0;display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:12px;cursor:pointer}
.F-row:hover{background:var(--f-tile)}
.F-row.sel{background:var(--f-tile2)}
.F-row .ic{width:32px;height:32px;border-radius:50%;background:#ffffff12;display:grid;place-items:center;flex:none;color:#cfc4f5}
.F-row.sel .ic{background:var(--f-acc);color:#fff}
.F-row .tx{flex:1;min-width:0}
.F-row .nm{font-weight:500;font-size:14px}
.F-row .lc{color:var(--f-dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;font-family:"Cascadia Mono",Consolas,monospace}
.F-pill{display:inline-flex;align-items:center;gap:8px;background:#ffffff0d;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:500;white-space:nowrap;min-width:112px;justify-content:space-between}
.F-pill .d{width:7px;height:7px;border-radius:50%}
.F-cnt{color:var(--f-faint);font-size:11.5px;width:58px;text-align:right}
.F .badge{border-radius:999px;padding:1px 9px;font-family:Outfit,sans-serif;font-weight:500}
.F .tag{border-color:var(--f-line);color:var(--f-dim);border-radius:999px;padding:0 7px}
.F .tag.git{border-color:#a78bfa;color:#c4b5fd}.F .tag.link{border-color:#60a5fa;color:#93c5fd}.F .tag.ro{border-color:#fb923c;color:#fdba74}
.F .explain{background:transparent;padding:0;margin-top:8px}
.F .explain ul{color:var(--f-dim)}
.F .explain a{color:var(--f-acc2)}
.F .fields{width:100%;table-layout:fixed}.F .fields td{word-break:break-all;font-size:11px}
.F-rung{background:var(--f-tile);border-radius:14px;padding:12px 14px;margin-bottom:8px;border:1px solid transparent}
.F-rung.win{border-color:#7D67CB99;background:linear-gradient(180deg,#7D67CB22,var(--f-tile) 60%)}
.F-rung.lose .loc{text-decoration:line-through;text-decoration-color:var(--f-faint)}
.F-rung .hd{display:flex;align-items:center;gap:8px}
.F-rung .rk{width:22px;height:22px;border-radius:50%;background:#ffffff12;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--f-dim);flex:none}
.F-rung.win .rk{background:var(--f-acc);color:#fff}
.F-rung .ly{font-weight:500;flex:1}
.F-rung .loc{margin-top:6px;font-family:"Cascadia Mono",Consolas,monospace;font-size:11.5px;color:var(--f-dim);word-break:break-all}
.F-rung .cfg{margin-top:6px;font-family:"Cascadia Mono",Consolas,monospace;font-size:11px;color:var(--f-faint);word-break:break-all}
.F-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.F-acts .note{flex-basis:100%;color:var(--f-faint);font-size:11.5px;line-height:1.45}
.F-banner{display:flex;gap:8px;align-items:center;background:#f8717114;color:#fecaca;border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:12.5px}
.F-empty{color:var(--f-faint);padding:20px 4px;text-align:center}
/* E — launcher look, after the "MISTY" Minecraft launcher on Behance (Cera Pro → Outfit stand-in) */
:root{
  --bg:#1e1f22;--panel:#26282c;--panel2:#2d3035;--line:#3a3d43;--text:#e3e5e8;--dim:#9aa0a8;--faint:#6b7079;
  --eff:#3fb950;--sha:#8b949e;--mer:#39c5cf;--dis:#d29922;--blo:#f0883e;--unr:#6e7681;--inv:#f85149;--acc:#58a6ff;
  font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;font-size:13px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
code,.mono{font-family:"Cascadia Mono",Consolas,monospace;font-size:12px}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:3px 9px;cursor:pointer}
button:hover{border-color:var(--dim)}
button[disabled]{opacity:.45;cursor:not-allowed}
select,input{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:3px 6px}
a{color:var(--acc);cursor:pointer;text-decoration:none}
a:hover{text-decoration:underline}
.top{display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.top h1{font-size:14px;margin:0;font-weight:600}
.top .proto{color:var(--blo);font-size:11px;border:1px solid var(--blo);border-radius:3px;padding:0 5px}
.top .sp{flex:1}
.dim{color:var(--dim)}.faint{color:var(--faint)}
main{flex:1;min-height:0;display:flex}
.badge{display:inline-block;border-radius:3px;padding:0 6px;font-size:11px;font-weight:600;line-height:18px;white-space:nowrap}
.b-Effective{background:#3fb95026;color:var(--eff)}.b-Shadowed{background:#8b949e26;color:var(--sha)}
.b-Merged{background:#39c5cf26;color:var(--mer)}.b-Disabled{background:#d2992226;color:var(--dis)}
.b-Blocked{background:#f0883e26;color:var(--blo)}.b-Unread{background:#6e768126;color:var(--unr)}
.b-Invalid{background:#f8514933;color:var(--inv)}
.tag{display:inline-block;font-size:10.5px;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--dim);margin-left:4px;white-space:nowrap}
.tag.git{border-color:#a371f7;color:#a371f7}.tag.link{border-color:var(--acc);color:var(--acc)}.tag.ro{border-color:var(--blo);color:var(--blo)}
.flag{color:var(--inv);font-size:12px}
.explain{padding:8px 10px;background:var(--panel2);border-radius:4px;margin-top:6px;line-height:1.5}
.explain .why{margin-bottom:4px}
.explain ul{margin:4px 0 0 16px;padding:0;color:var(--dim)}
.explain .whatif{color:var(--dim);font-style:italic}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.actions .note{color:var(--faint);font-size:11.5px;flex-basis:100%}
.fields{border-collapse:collapse;margin-top:6px}
.fields td{padding:1px 10px 1px 0;vertical-align:top}
.toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:var(--acc);color:#000;padding:6px 12px;border-radius:4px;display:none;z-index:99}
/* switcher */
.switcher{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:#fff;color:#000;
  border-radius:999px;padding:5px 8px;box-shadow:0 4px 18px #000a;z-index:100;font-weight:600}
.switcher button{background:#000;color:#fff;border:0;border-radius:999px;width:28px;height:28px;padding:0}
.switcher span{min-width:230px;text-align:center}
/* A */
.A-left{width:240px;border-right:1px solid var(--line);overflow:auto;padding:8px 0}
.A-agent{padding:7px 12px;cursor:pointer;border-left:3px solid transparent}
.A-agent.sel{background:var(--panel2);border-left-color:var(--acc)}
.A-agent .counts{font-size:11.5px;color:var(--dim);margin-top:2px}
.A-mid{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.A-tools{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line)}
.chip{border-radius:999px;padding:1px 9px;font-size:11.5px}
.chip.on{border-color:var(--acc);color:var(--acc)}
.A-list{overflow:auto;flex:1}
.A-group{padding:10px 12px 4px;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.A-row{display:grid;grid-template-columns:18px 1fr auto;gap:8px;padding:6px 12px;cursor:pointer;align-items:center;border-bottom:1px solid #ffffff08}
.A-row:hover{background:#ffffff08}.A-row.sel{background:var(--panel2)}
.A-row .sub{font-size:11.5px;color:var(--dim)}
.A-right{width:500px;overflow:auto;padding:14px}
.ladder{margin-top:10px}
.rung{border:1px solid var(--line);border-radius:5px;padding:8px 10px;margin-bottom:8px;position:relative}
.rung.win{border-color:var(--eff)}
.rung .rank{position:absolute;left:-26px;top:9px;color:var(--faint);font-size:11px;width:20px;text-align:right}
.rung .hdr{display:flex;gap:8px;align-items:center;justify-content:space-between}
.rung.lose .loc{text-decoration:line-through;text-decoration-color:var(--faint)}
.also{font-size:11.5px;color:var(--dim);margin-top:4px}
/* B */
.B-wrap{flex:1;overflow:auto;padding:12px 14px 120px}
table.mx{border-collapse:separate;border-spacing:0;width:100%}
.mx th,.mx td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.mx th{position:sticky;top:0;background:var(--panel);z-index:2;font-weight:600}
.mx td.name{font-weight:600;white-space:nowrap}
.mx td.cell{cursor:pointer;min-width:120px}
.mx td.cell:hover{background:#ffffff0a}.mx td.cell.sel{outline:2px solid var(--acc);outline-offset:-2px}
.mx td.empty{color:var(--faint)}
.dots{margin-top:3px;letter-spacing:2px;font-size:11px}
.mx tr.grp td{background:transparent;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding-top:14px}
.drawer{position:fixed;left:0;right:0;bottom:0;height:42vh;background:var(--panel);border-top:2px solid var(--acc);overflow:auto;padding:12px 16px 70px;z-index:5}
.stack{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.stack .card{flex:1 1 300px;border:1px solid var(--line);border-radius:5px;padding:8px 10px}
.stack .card.win{border-color:var(--eff)}
.arrow{align-self:center;color:var(--faint);font-size:18px}
/* C */
.C-wrap{flex:1;overflow:auto;padding:12px 16px 80px}
.C-tools{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.C-root{margin-bottom:14px}
.C-root>.h{font-weight:600;padding:4px 0;border-bottom:1px solid var(--line)}
.C-file{margin:6px 0 0 14px}
.C-file>.h{color:var(--dim)}
.C-entry{margin:3px 0 0 28px;padding:4px 8px;border-radius:4px;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.C-entry:hover{background:#ffffff08}.C-entry.sel{background:var(--panel2)}
.C-entry .k{min-width:170px}
.reader{border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:11.5px}
.C-detail{margin:2px 0 10px 28px;padding:4px 0 4px 12px;border-left:2px solid var(--acc)}
/* D */
.D-wrap{flex:1;overflow:auto;padding:0 16px 80px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:3;padding-top:10px}
.tabs .t{padding:6px 12px;cursor:pointer;border-radius:4px 4px 0 0;color:var(--dim)}
.tabs .t.sel{background:var(--panel);color:var(--text);border:1px solid var(--line);border-bottom-color:var(--panel)}
.D-sec{margin-top:14px}
.D-sec>.h{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
table.casc{border-collapse:collapse;width:100%}
.casc th{font-weight:600;color:var(--dim);text-align:left;padding:4px 6px;font-size:11.5px;border-bottom:1px solid var(--line)}
.casc th .prec{color:var(--faint);font-weight:400}
.casc td{padding:5px 6px;border-bottom:1px solid #ffffff10;vertical-align:top}
.casc td.item{font-weight:600;white-space:nowrap}
.ec{border:1px solid var(--line);border-radius:4px;padding:3px 6px;cursor:pointer;font-size:12px}
.ec.win{border-color:var(--eff);background:#3fb95012}
.ec.lose .loc{text-decoration:line-through;color:var(--faint)}
.ec.sel{outline:2px solid var(--acc)}
.result{font-size:12px}
.D-panel{position:sticky;bottom:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-top:14px}
.banner{background:#f8514922;border:1px solid var(--inv);color:var(--text);padding:6px 10px;border-radius:4px;margin:8px 0}
.banner.warn{background:#f0883e1c;border-color:var(--blo)}
/* ── flow prototype (ticket #23) ── */
.F-main{position:relative}
.F-shell{position:relative}
.FL-bg{position:fixed;inset:0;background:#0b0b0fcc;display:grid;place-items:center;z-index:50}
.FL-dlg{width:min(760px,92vw);max-height:88vh;overflow:auto;background:var(--f-pan);border-radius:20px;padding:22px 24px;box-shadow:0 20px 60px #000c;color:#fff;font-family:Outfit,"Segoe UI",sans-serif;font-size:13px}
.FL-dlg.sm{width:min(520px,92vw)}
.FL-h{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}
.FL-sub{color:var(--f-dim);margin-top:4px}
.FL-sec{margin-top:18px}
.FL-sec>.t{color:var(--f-dim);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.FL-sec>.t .ln{flex:1;height:1px;background:var(--f-line)}
.FL-gone{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11px;font-weight:600;background:#f8717122;color:#fca5a5}

  const op = FL.op, M = op.M || merged(op), cks = checks(M), v = op.plans[0].verb;
  const pages = cks.length ? ['What changes','Before you apply','Apply'] : ['What changes','Apply'];
  if (op.phase!=='preview') op.page = pages.length-1;
  const pg = pages[op.page], last = op.page===pages.length-1;
  const nav = (next) => `<div class="FL-ft"><span class="sp"></span>${op.page?`<button class="F-cta sec" onclick="FL.op.page--;render()">Back</button>`:`<button class="F-cta sec" onclick="FL.op=null;render()">Cancel</button>`}${next}</div>`;
  let body;
  if (pg==='What changes') body = `${op.replan?`<div class="FL-replan" style="margin:0 0 12px">${esc(op.replan)}</div>`:''}<div class="FL-sec" style="margin-top:0"><div class="t">State after the change <span class="ln"></span></div>${effTable(M.effects)}</div>
    <div class="FL-sec"><div class="t">Files <span class="ln"></span></div>${M.changes.map(fileBlock).join('')}</div>${nav(`<button class="F-cta" onclick="FL.op.page++;render()">Next</button>`)}`;
  else if (pg==='Before you apply') { const b = blocking(op, cks);
    body = `<div class="FL-sec" style="margin-top:0">${checkList(op, cks)}</div>${nav(`<button class="F-cta" ${b?'disabled':''} onclick="FL.op.page++;render()">Next</button>`)}`; }
  else if (op.phase==='preview') body = `<div class="FL-chk info">${ic('info','s')}<div>${esc(backupNote(M))}</div></div>
    <div class="FL-sec"><div class="t">Summary <span class="ln"></span></div><div style="line-height:1.6">${M.effects.length} State change${M.effects.length>1?'s':''} in ${esc(names(M.effects.map(f=>f.agent)))} · ${M.changes.length} location${M.changes.length>1?'s':''} written${cks.length?` · ${cks.filter(c=>c.kind!=='info').length} warning(s) acknowledged`:''}</div></div>
    ${nav(applyBtn(op, cks, op.undoOf?'Undo':v))}`;
  else body = steps(op) + (op.phase==='done' ? result(op, {closeLbl:'Back to Item'}) : '');
  return `<div class="h">${ic(VICON[op.undoOf?'Undo':v],'s')} ${esc(opTitle(op))}<span class="sp"></span>${op.phase!=='apply'?`<a style="color:var(--f-dim)" onclick="cancelOp()">${ic('close','s')}</a>`:''}</div>
    <div class="F-k" style="color:var(--f-dim);margin:-6px 0 10px">${esc(opSub(op))}</div>
    <div class="FL-stepper">${pages.map((p,i)=>`<span class="${i<=op.page?'on':''}" title="${p}"></span>`).join('')}</div>
    <div class="F-k" style="margin-bottom:10px">Step ${op.page+1} of ${pages.length} · ${pg}</div><div class="F-scroll" style="gap:0">${body}</div>`;
}

  const att = cks.filter(c=>c.kind!=='info').length;
  return `<div class="FL-tray"><span class="n">Pending Operation · ${QUEUE.length} change${QUEUE.length>1?'s':''}</span><span class="dim">${M.changes.length} location${M.changes.length>1?'s':''} · ${esc(names(M.effects.map(f=>f.agent)))}</span>
    ${att?`<span class="w">${att} need${att>1?'':'s'} attention</span>`:''}<button class="F-cta sec" onclick="QUEUE=[];render()">Discard</button><button class="F-cta" onclick="review()">Review & apply</button></div>`;
}
function ReviewView(){
  const op = FL.op, M = op.M || merged(op), cks = checks(M);

// ── pending States shown in the inventory while a preview or the queue is open
function pendingEffects(){
  const out = [];
  if (FL.op && FL.op.phase==='preview') out.push(...merged(FL.op).effects);
  if (variant==='C' && !FL.op) QUEUE.forEach(s=>{ const x = findX(s); if (x) out.push(...plan(s.verb, x).effects); });
  return out.filter(f=>f.ctx==='*' || f.ctx===S.ctx);
}
function ghostItem(i){
  const fs = pendingEffects().filter(f=>f.agent===i.agent && f.item===i.name); if (!fs.length) return '';
  const rm = fs.every(f=>!f.to);
  return `<span class="FL-ghost ${rm?'rm':''}" title="Pending, not applied">→ ${rm?'removed':esc(fs.find(f=>f.to)?.to)}</span>`;
}
function ghostEntry(x){
  const f = pendingEffects().find(f=>f.agent===x.agent && f.entry===x.entry); if (!f) return '';
  return `<span class="FL-ghost ${f.to?'':'rm'}">pending → ${f.to?esc(f.to):'removed'}</span>`;
}

  const body = AGENTS.map(a => {
    const head = `<div class="F-grp" style="text-transform:none;letter-spacing:0;font-size:13px;color:#fff">${esc(a.name)}<span class="SC-ver">${SIM.empty?'not installed':`installed ${a.ver} · read from ${esc(a.verFrom)}`} · built-in definition</span><span class="ln"></span></div>`;
    if (SIM.empty) return head + `<div class="SC-line dim"><div class="tx"><div class="sb">No home found in the default or known locations, or through environment variables.</div></div></div>`;
    return head + a.homes.map(h => {
      const n = homeEntries(a.id, h.id), tg = [
        `<span class="tag">${esc(h.src)}</span>`,
        h.mirrored ? `<span class="tag ro">Mirrored by ${esc(h.mirrored)} · read-only</span>` : '',
        h.unread ? `<span class="tag">not read</span>` : '', h.hidden ? `<span class="tag">hidden</span>` : ''].join('');
      const note = h.mirrored ? `${esc(h.mirrored)} copies this home from ${esc(h.mirrorOf)}. Actions on its Entries go to the source Entry.` : h.unread ? esc(h.why) : h.empty ? `No configuration found for ${esc(a.name)}: none of the files its definition expects are here.` : '';
      const acts = (h.hidden ? sm('sec',`hideHome('${a.id}','${h.id}',false)`,'Unhide') : sm('sec',`showHome('${a.id}','${h.id}')`,`${ic('arrow','s')} Show in Inventory`) + (h.added ? '' : sm('sec',`hideHome('${a.id}','${h.id}',true)`,'Hide')))
        + (h.added ? sm('sec',`forgetHome('${a.id}','${h.id}')`,'Remove from list') : '');
      return `<div class="SC-line ${h.hidden?'dim':''}"><span class="ic">${ic(h.mirrored?'lock':'folder','s')}</span><div class="tx"><div class="nm">${esc(h.label)}</div><div class="p">${esc(h.path)}</div>
        <div style="margin-top:6px">${tg}</div>${note?`<div class="sb">${note}</div>`:''}</div>
        <span class="F-cnt" style="width:80px">${plural(n,'Entry','Entries')}</span><div class="SC-acts">${acts}</div></div>`; }).join('');
  }).join('');
  const side = `<div class="F-pan" style="width:360px;flex:none"><div class="h">Where homes come from</div><div class="F-scroll">
    ${HOME_SOURCES.map(([k,v])=>`<div class="SC-kv"><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join('')}
    <div class="SC-note">A home is listed when its folder exists, even if the Agent is not installed. A home the Agent's lookup order skips is listed as not read, with the reason.</div>
    <div class="SC-note">Agent definitions are built in: this build carries 6 Agent definitions and the Skill manager definitions, identical to the CLI's. Installed versions are read from files, never by running the Agent.</div>
    <div class="SC-note">What happens when an installed version is not one a definition was tested against is decided in "Unknown Agent versions and feature gates".</div></div></div>`;
  return `<div class="F-pan" style="flex:1"><div class="F-scroll">${body}</div></div>` + side;
}

      <div class="F-pan" style="flex:1"><div class="h">Data on this computer</div><div class="F-scroll">
        ${data('Backups and Operation history', R`%LOCALAPPDATA%\config-digger\backups`, `${plural(HIST.length,'Operation','Operations')} kept. Kept: the last 50 Operations and everything from the last 30 days, pruned at startup together with their backups.`)}

          `<div class="sb" style="color:#fff">${p.length ? p.map(x=>`${esc(x.item)} · ${esc(AG[x.agent].name)} <a class="SC-link" onclick="S.F.agent='${x.agent}';S.F.item='${x.agent}|${x.item}';go('inv')">Show in Inventory</a>`).join('<br>') : 'None parked. (Disable filesystem in Claude Desktop to park one.)'}</div>`)}
        ${data('Logs', R`%LOCALAPPDATA%\config-digger\logs`, 'Paths, key paths, reason codes and errors only; never configuration values. Nothing leaves the computer.')}
        ${data('Your lists and settings', R`%APPDATA%\config-digger`, 'Added and hidden Agent homes and Projects, and these settings.')}

    </div></div>`;
}

      <div class="F-pan" style="width:360px;flex:none"><div class="h">Links</div>

        <div class="SC-note">The command-line tool is installed next to the app: run <span class="mono">config-digger --help</span> in a terminal.</div></div>
    </div></div>`;
}

function SecDialog(){
  const d = FL.dlg, close = `FL.dlg=null;render()`;
  const shell = (t, body, ft) => `<div class="FL-bg" onclick="if(event.target===this){${close}}"><div class="FL-dlg sm"><div class="FL-h">${t}</div>${body}<div class="FL-ft"><span class="sp"></span>${ft}</div></div></div>`;
  if (d.t==='addProject') return shell(`${ic('folder')} Add Project`,
    `<div class="FL-sub">A folder or a .code-workspace file. config-digger evaluates it for every Agent and writes nothing to any Agent.</div>
     <div class="SC-field"><input id="np" class="SC-in" value="E:\\code\\api"><button class="F-cta sm sec" onclick="document.getElementById('np').value='E:\\\\code\\\\shop-admin.code-workspace'">Choose…</button></div>
     <div class="SC-note">Choose opens the Windows picker for folders and .code-workspace files. The path must exist.</div>`,
    `<button class="F-cta sec" onclick="${close}">Cancel</button><button class="F-cta" onclick="addProject()">Add</button>`);
  if (d.t==='addHome') return shell(`${ic('folder')} Add Agent home`,
    `<div class="FL-sub">A folder an instance of an Agent reads its user configuration from, such as another CODEX_HOME or a portable install.</div>
     <div class="SC-field"><select id="na" class="SC-in" style="flex:none;width:170px">${AGENTS.map(a=>`<option value="${a.id}" ${a.id==='gm'?'selected':''}>${esc(a.name)}</option>`).join('')}</select>
       <input id="nh" class="SC-in" value="D:\\portable\\gemini-home"><button class="F-cta sm sec" onclick="toast('Prototype: Windows folder picker')">Choose…</button></div>
     <div class="SC-note">Any existing folder is accepted. config-digger reads it with the definition of the Agent you pick; if none of the files that definition expects are there, the home is listed with "No configuration found".</div>`,
    `<button class="F-cta sec" onclick="${close}">Cancel</button><button class="F-cta" onclick="addHome()">Add</button>`);
  if (d.t==='licenses') {
    const L3 = [['Outfit (bundled font)','SIL Open Font License 1.1'],['Tauri','MIT OR Apache-2.0'],['serde, serde_json','MIT OR Apache-2.0'],['toml_edit','MIT OR Apache-2.0'],['jsonc-parser','MIT'],['similar','Apache-2.0'],['rusqlite (bundled SQLite)','MIT · SQLite is public domain'],['clap, tracing','MIT'],['React','MIT'],['…','the full list and texts are generated at build time from Cargo and npm metadata']];
    return shell(`${ic('doc')} Third-party licenses`, `<div class="FL-sub">Every component shipped in this build, with its license text. Prototype list.</div>
      <div style="margin-top:12px">${L3.map(([n,l])=>`<div class="SC-kv"><b>${esc(n)}</b><span>${esc(l)}</span></div>`).join('')}</div>`, `<button class="F-cta" onclick="${close}">Close</button>`);
  }
  return '';

function Overlays(){
  return (variant==='A' && FL.op ? DialogFlow() : '') + (FL.how ? HowDialog() : '') + (FL.dlg ? SecDialog() : '')
    + (SNACK ? `<div class="FL-snack">${esc(SNACK.text)} <a onclick="undoStart(${SNACK.hid})">Undo</a><a style="color:var(--f-dim)" onclick="SNACK=null;render()">${ic('close','s')}</a></div>` : '');
}
function fActions(x){
  const a = acts(x), e = E[x.entry], notes = [], g = ghostEntry(x);
  if (a.ro) return `<div class="F-acts"><button class="F-cta" onclick="goSource('${x.item}')">${ic('arrow','s')} Go to source Entry</button><span class="note">Read-only: Orca copies this home from ~\\.codex. Actions go to the source Entry.</span></div>`;
  const call = v => `act('${v}','${x.agent}','${x.home}','${x.entry}')`;
  const q = variant==='C' && QUEUE.find(s=>s.agent===x.agent && s.home===x.home && s.entry===x.entry);
  if (q) return `<div class="F-acts"><span class="FL-q">Queued: ${q.verb} <a onclick="${call(q.verb)}" title="Take out of the pending Operation">${ic('close','s')}</a></span>${g}</div>`;
  let b = '';
  if (a.disable) { b += `<button class="F-cta" ${a.disable.no?'disabled':''} onclick="${call('Disable')}">${ic('pause','s')} Disable</button>`; notes.push(a.disable.no || 'Disable: '+a.disable.how); }
  if (a.enable)  { b += `<button class="F-cta" ${a.enable.no?'disabled':''} onclick="${call('Enable')}">${ic('play','s')} Enable</button>`; if (a.enable.no) notes.push(a.enable.no); }
  const reach = [...new Set(AGENTS.filter(g=>RD.some(y=>y.agent===g.id && y.entry===x.entry)).map(g=>g.name))];
  if (a.remove.no && a.remove.no.startsWith('Not in v0.1')) b += `<button class="F-cta sec" onclick="FL.how='${x.entry}';render()">${ic('info','s')} How to remove</button>`;
  else b += `<button class="F-cta ${a.disable||a.enable?'sec':'danger'}" ${a.remove.no?'disabled':''} onclick="${call('Remove')}">${ic('trash','s')} Remove</button>`;
  notes.push(a.remove.no || `Remove reaches ${reach.join(', ')}${e.git?' · git-versioned: needs explicit confirmation':''}${e.link?' · deletes the junction only':''}${e.rmNote?' · '+e.rmNote:''}`);
  return `<div class="F-acts">${b}${g}${notes.map(n=>`<span class="note">${esc(n)}</span>`).join('')}</div>`;
}
// the flow is fixed to A (one dialog, ticket #23); the bottom bar walks the screens instead
let variant = 'A';
const SCREENS = {inv:'Inventory', projects:'Projects & homes · Projects', homes:'Projects & homes · Agent homes', history:'History · Undo', settings:'Settings', about:'About'};
const SKEYS = Object.keys(SCREENS);
const screenKey = () => S.view==='projects' && S.P.tab==='homes' ? 'homes' : S.view;
function go(v){
  if (v==='homes') { S.view = 'projects'; S.P.tab = 'homes'; } else { if (v==='projects') S.P.tab = 'projects'; S.view = v; }
  try{ const u = new URL(location.href); u.searchParams.set('view', screenKey()); history.replaceState(null,'',u); }catch(e){}
  render();
}
{ const q = new URLSearchParams(location.search); if (q.get('ctx')) S.ctx = q.get('ctx'); if (q.get('view')) { const v = q.get('view'); if (v==='homes') { S.view='projects'; S.P.tab='homes'; } else if (SCREENS[v]) S.view = v; } }
function render(keepFocus){
  const f = keepFocus && document.activeElement && document.activeElement.id; const pos = f && document.activeElement.selectionStart;
  document.body.className = 'vF';
  document.getElementById('main').innerHTML = VariantF();
  document.getElementById('sim').innerHTML = SimPanel();
  document.getElementById('vlabel').textContent = SCREENS[screenKey()];
  if (f) { const el = document.getElementById(f); if (el) { el.focus(); el.setSelectionRange(pos,pos); } }
}
document.getElementById('prev').onclick = () => go(SKEYS[(SKEYS.indexOf(screenKey())+SKEYS.length-1)%SKEYS.length]);
document.getElementById('next').onclick = () => go(SKEYS[(SKEYS.indexOf(screenKey())+1)%SKEYS.length]);
document.addEventListener('keydown', ev => {
  const t = ev.target; if (t.matches && t.matches('input,textarea,select,[contenteditable]')) return;
  if (ev.key==='ArrowLeft') document.getElementById('prev').click();
  if (ev.key==='ArrowRight') document.getElementById('next').click();
});
recompute(); render();
// deep links: &open=Verb:agent:home:entry[,Verb:agent:home:entry…] (C queues them all and opens the review), &refused=<operation id>
{ const q = new URLSearchParams(location.search);
  if (q.get('open')) { q.get('open').split(',').forEach(o=>{ const [v,a,h,e] = o.split(':'); act(v,a,h,e); }); if (variant==='C') review(); }
  if (q.get('refused')) undoStart(+q.get('refused'));
  if (q.get('empty')) { SIM.empty = true; render(); }
  if (q.get('leftovers')) removeLeftovers(q.get('leftovers'));
  if (q.get('dlg')) { FL.dlg = {t:q.get('dlg')}; render(); } }
